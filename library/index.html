<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Thrive · Opportunity Library</title>
<link rel="icon" href="../assets/thrive-logo.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="dns-prefetch" href="https://api.github.com">
<script>(function(){try{if(sessionStorage.getItem('thrive_gate_v1')!=='e00475a9bf66c48e332882a90f2638d0bf2f37272572f60ff0ca41e49f6e7c06')document.documentElement.classList.add('gate-locked');}catch(e){document.documentElement.classList.add('gate-locked');}})();</script>
<script src="gate.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><img src="../assets/thrive-logo.png" alt="Thrive" width="26" height="26" decoding="async"><b data-i18n="brand">Thrive Digital Solutions</b></a>
  <nav class="nav">
    <a href="index.html" class="active" data-i18n="nav_library">Library</a>
    <a href="editor.html" data-i18n="nav_editor">Editor</a>
    <a href="compose.html" data-i18n="nav_compose">Email</a>
    <a href="templates.html" data-i18n="nav_templates">Templates</a>
    <a href="insights.html" data-i18n="nav_insights">Insights</a>
    <a href="activity.html" data-i18n="nav_activity">Activity</a>
    <a href="settings.html" data-i18n="nav_settings">Settings</a>
    <button id="langbtn" class="langbtn">العربية</button>
    <button id="lockbtn" class="langbtn" onclick="window.thriveLock&&window.thriveLock()" data-i18n="lock_btn">Lock</button>
  </nav>
</header>

<main class="wrap">
  <div class="page-h"><h1 class="title" data-i18n="lib_title">Opportunity Library</h1></div>
  <p class="sub" data-i18n="lib_sub"></p>

  <div class="toolbar">
    <div class="search"><input id="q" type="search" data-i18n-ph="search_ph"></div>
    <select id="sort" style="max-width:180px">
      <option value="new" data-i18n="sort_new">Newest sent</option>
      <option value="old" data-i18n="sort_old">Oldest sent</option>
      <option value="az" data-i18n="sort_az">Business A–Z</option>
    </select>
    <select id="filter" style="max-width:170px"><option value="all" data-i18n="filter_all">All templates</option></select>
    <select id="statusFilter" style="max-width:160px">
      <option value="active" data-i18n="statusf_active">Active</option>
      <option value="followup" data-i18n="statusf_followup">Needs follow-up</option>
      <option value="archived" data-i18n="statusf_archived">Archived</option>
      <option value="all" data-i18n="statusf_all">All statuses</option>
    </select>
    <a class="btn" href="editor.html" data-i18n="new_opp">New opportunity</a>
    <button class="btn ghost" id="exportManifest" data-i18n="export_manifest">Export manifest.json</button>
  </div>

  <div id="pipeline" class="pipeline"></div>
  <div id="grid" class="grid"></div>
</main>

<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
<script>document.addEventListener("DOMContentLoaded",function(){ initLang(); initDashboard(); });</script>
</body>
</html>
