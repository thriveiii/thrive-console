// BUG-2: a two-tap delete for one Library page. First tap opens an inline confirm (Delete / Cancel); the confirm
// deletes ONLY this console_pages row (restDelete, the same bounded DELETE the card delete uses - the DB grant in
// docs/supabase-opp-delete.sql permits it), then drops the row from the cached list and re-renders. No opp/card,
// no ledger row, and no other page is ever touched. A failed delete shows a red status and changes nothing.
function libDeleteToggle(slug, btn){
  var box = document.getElementById("lvDel-" + slug); if(!box) return;
  if(!box.hidden){ box.hidden = true; box.innerHTML = ""; if(btn) btn.classList.remove("on"); return; }
  box.hidden = false; if(btn) btn.classList.add("on");
  box.innerHTML = '<div class="lv-del-warn">' + esc(t("lib_del_confirm")) + '</div>'+
    '<div class="acts"><button class="act lv-del-go" type="button">' + esc(t("lib_delete")) + '</button>'+
    '<button class="act lv-del-x" type="button">' + esc(t("lib_del_cancel")) + '</button></div>'+
    '<div class="act-status" id="lvDelStatus-' + esc(slug) + '" role="status" aria-live="polite"></div>';
  var go = box.querySelector(".lv-del-go"); if(go) go.addEventListener("click", function(){ libDoDelete(slug); });
  var cx = box.querySelector(".lv-del-x"); if(cx) cx.addEventListener("click", function(){ libDeleteToggle(slug, btn); });
}
function libDoDelete(slug){
  var st = document.getElementById("lvDelStatus-" + slug);
  if(st){ st.className = "act-status"; st.textContent = t("lib_deleting"); }
  return restDelete("console_pages?slug=eq." + encodeURIComponent(slug)).then(function(){
    __libPages = (__libPages || []).filter(function(p){ return !(p && p.slug === slug); });   // optimistic: drop it from the list
    if(__libExisting) delete __libExisting[slug];
    libRenderList();
  }, function(e){
    if(st){ st.className = "act-status bad"; st.textContent = (e && e.authRequired) ? t("err") : t("lib_del_failed"); }
  });
}
// (libRepair removed: a Library template publishes and verifies on upload, so there is no manual repair button.)
// On-demand preview: read the committed html back from console_pages (pageReadHtml) into a sandboxed iframe,
// the same isolation the editor preview uses. Toggling again closes it (and frees the frame).
function libPreviewToggle(slug, btn){
  var box = document.getElementById("lvPrev-" + slug); if(!box) return;
  if(!box.hidden){ box.hidden = true; box.innerHTML = ""; if(btn) btn.classList.remove("on"); return; }
  box.hidden = false; if(btn) btn.classList.add("on");
  box.innerHTML = '<div class="muted" style="padding:8px 2px">' + esc(t("up_reading")) + '</div>';
  pageReadHtml(slug).then(function(html){
    box.innerHTML = '<iframe class="lv-frame" title="' + esc(t("lib_preview")) + '" sandbox="" referrerpolicy="no-referrer" srcdoc="' + esc(String(html||"")) + '"></iframe>';
  }, function(){ box.innerHTML = '<div class="act-status bad">' + esc(t("up_read_failed")) + '</div>'; });
}

// ===================================================================================================
// PROMOTE TO OPERATIONS (PR-L6) - from a live Library template, attach a recipient (individual or group) to
// mint a live Operations card. The template's page is already live (console_pages row), so promote is exactly
// the act of minting the console_opps anchor with the SAME slug: the board view is anchored from console_opps
// and left-joined to console_pages by slug (docs/supabase-board-view.sql:242,203,247), so a page with no opp
// is not a card until promoted. With a page row present and zero sends the card is born stage 'live'
// (docs/supabase-board-view.sql:208,232-236) and the drawer opens the compose surface (editorHtml) for the
// message to be written and then sent. CRITICAL: promote NEVER sets data.source, so sendMode stays 'personal'
// (board-send.src.js:189) - a promoted 1:1 sends in the clean personal shape, never the campaign/bulk shape.
// This is a promote surface only; runSend / sendMode / upSendLiveGate are untouched.
// ===================================================================================================
function libPageBySlug(slug){
  var ps = __libPages || [];
  for(var i=0;i<ps.length;i++){ if(ps[i] && ps[i].slug === slug) return ps[i]; }
  return null;
}
// The template's card label: the title (from #272) if present, else a prettified slug - the exact rule
// libCardHtml uses, so the Operations card business matches the Library title the operator sees.
function libPromoteTitle(slug){
  var p = libPageBySlug(slug) || {};
  return (p.title && String(p.title).trim()) || upPretty(slug);
}
// Idempotency check REMOVED (PR-A0): promote no longer keys the opp on the template slug, so there is nothing to
// collide with. A template is a reusable asset - each promote mints its OWN unique opp slug (libShortId below),
// so one template fans out to many recipients as many independent cards. (libOppExists had only this one caller.)
// A short, url-safe id for a per-promote opp slug - mirrors nmNewSlug's Date.now()/Math.random() base36 recipe.
function libShortId(){
  var tp=""; try{ tp=Date.now().toString(36).slice(-4); }catch(e){ tp="0"; }
  var rr=""; try{ rr=Math.random().toString(36).slice(2,6); }catch(e){ rr="x"; }
  return tp + rr;
}
function libPromStatus(slug, msg, cls){
  var el = document.getElementById("lvPromSt-" + slug);
  if(el){ el.className = "act-status lv-prom-st" + (cls ? (" " + cls) : ""); el.textContent = msg || ""; }
}
// The inline promote form: one recipient field (single email, or several comma / newline separated for a
// group), a confirm button, and a status line. Reuses the SAME parser the compose recipient field uses.
function libPromoteFormHtml(slug){
  return '<textarea class="lv-prom-in mono-iso" id="lvPromIn-' + esc(slug) + '" rows="1" dir="ltr" '+
      'autocomplete="off" spellcheck="false" placeholder="' + esc(t("lib_prom_ph")) + '" '+
      'aria-label="' + esc(t("lib_prom_ph")) + '"></textarea>'+
    '<div class="lv-prom-acts"><button class="act send" type="button" data-lv-prom-go="' + esc(slug) + '">' + esc(t("lib_prom_go")) + '</button></div>'+
    '<div class="act-status lv-prom-st" id="lvPromSt-' + esc(slug) + '"></div>';
}
function libPromoteToggle(slug, btn){
  var box = document.getElementById("lvProm-" + slug); if(!box) return;
  if(!box.hidden){ box.hidden = true; box.innerHTML = ""; if(btn) btn.classList.remove("on"); return; }
  box.hidden = false; if(btn) btn.classList.add("on");
  box.innerHTML = libPromoteFormHtml(slug);
  var go = box.querySelector('[data-lv-prom-go]');
  if(go) go.addEventListener("click", function(){ libPromoteConfirm(slug); });
  var inp = document.getElementById("lvPromIn-" + slug);
  if(inp){ try{ inp.focus(); }catch(e){} }
}
// Confirm: parse recipient(s), then mint a UNIQUE opp for THIS promote (PR-A0) and attach the recipients, then
// reload the board so the promoted card is live. The `slug` argument is the TEMPLATE slug (the surface card id +
// the shared page); the opp minted is `<templateSlug>-<shortId>`, so a template promotes to many recipients as
// many independent cards. published:true makes the card stage 'live' via the view (has_page = published OR page
// row, board-view.sql:208) WITHOUT minting a new console_pages row; data.page_slug points every card at the ONE
// shared template page (liveUrl(data.page_slug||slug), board-send.src.js). NO data.source -> clean personal
// shape. Optimistic confirm-or-revert: green on a confirmed write, red on failure. Returns the promise so a test
// hook can await it (it resolves to the minted opp slug, or false on a no-op/failure).
function libPromoteConfirm(slug){
  var inp = document.getElementById("lvPromIn-" + slug);
  var raw = inp ? String(inp.value || "") : "";
  var list = parseAddrs(raw).filter(isEmail).map(function(a){ return { addr:a, name:"", lang:"" }; });   // one = individual, many = group
  if(!list.length){ libPromStatus(slug, t("lib_prom_need"), "bad"); return Promise.resolve(false); }
  if(__libPromoting) return Promise.resolve(false);
  __libPromoting = true;
  var go = document.querySelector('[data-lv-prom-go="' + slug + '"]'); if(go) go.disabled = true;
  libPromStatus(slug, t("lib_prom_saving"), "");
  var title = libPromoteTitle(slug);
  var oppSlug = slug + "-" + libShortId();                                                   // this promote's OWN card identity
  return oppUpsert(oppSlug, { business: title, published: true, up: Date.now(), data: { recipients: [], page_slug: slug }, owner: ownerStamp(oppSlug) })   // OWNER column: the promoting member owns this new card
    .then(function(){ return saveRecipients(oppSlug, list); })                               // attach recipient(s), read-back confirmed
    .then(function(){ return reloadBoardData(); })                                           // the promoted card is now a board row
    .then(function(){ __libPromoting = false; if(go) go.disabled = false; libPromStatus(slug, t("lib_prom_done"), "ok"); return oppSlug; })
    .catch(function(e){
      __libPromoting = false; if(go) go.disabled = false;
      libPromStatus(slug, (e && e.authRequired) ? t("err") : t("lib_prom_failed"), "bad");
      return false;
    });
}

// ===================================================================================================
// G3: the window's Mode B ("message with campaign") PAGE tab - the ONE unified upload/library engine.
// Three ENTRY MODES (Upload / Pick from Library / Duplicate) feed the SAME review component (libRowHtml:
// pageFrameIframe render + editable title/slug/task + libCollectRows validation). NOTHING branches except the
// COMMIT, which is the campaign shape (card + B2-stripped recipients + cycle + page). Reuses upBuildPlan,
// libRowHtml, libCollectRows, libFetchPages, libMatches, pageReadHtml, pageFrameIframe, and the upCommit-shape
// primitives (oppUpsert/pageUpsert/pagePublishRelay/upActivateBackground) - no new copies, no forked commit.
var __owCommitting = false;
// G7: which of the three Page-tab paths the operator chose on this Mode B entry: "campaign" (a full multi-page
// zip -> N cards via upCommit), "page" (one uploaded page + a hand-written message -> this opp), or "pick"
// (a Library template copied onto this opp). null until a path is chosen. It routes both the entry UI (which
// input is revealed) and the commit (owCommitCampaign delegates the campaign path to owCommitCampaignAll).
var __owPagePath = null;
function owPageStatus(msg, cls){ var el=document.getElementById("owPageStatus"); if(el){ el.className="act-status"+(cls?(" "+cls):""); el.textContent=msg||""; } }
function owCommitStatus(msg, cls){ var el=document.getElementById("owCommitStatus"); if(el){ el.className="act-status"+(cls?(" "+cls):""); el.textContent=msg||""; } }
// Load the existing-slug set for validation, EXCLUDING this opp's own slug (re-publishing the opp's own page is
// not a conflict). libDistinctTasks feeds the task datalist. Best-effort; a failed read leaves an empty set.
function owPageLoadExisting(){
  return libFetchPages().then(function(pages){
    __libPages = pages || [];
    __libExisting = {}; (pages||[]).forEach(function(p){ if(p && p.slug && p.slug!==__owSlug) __libExisting[p.slug]=1; });
    return pages || [];
  }, function(){ __libExisting = __libExisting || {}; return []; });
}
// Mount a single row into the SAME review component the Library upload uses (libRowHtml), then wire its slug
// input to libCollectRows exactly as libOnFile does. The row is held on __upPlan (one place, one review).
function owPageSetReview(row){
  row.slug = row.slug || __owSlug; row.warnings = row.warnings || []; if(row.included==null) row.included = true;
  __upPlan = { rows:[row] };
  if(__owPickAwaiting){ __owPickAwaiting = false; owRevealPickEditor(); }   // FIX B: a template was picked -> reveal the editor + review + commit (scoped to the pick entry)
  owReviewRender();                     // the SAME accordion the multi-page upload uses (one section here)
}
// Entry mode 1: UPLOAD a new page/template (the SHARED upBuildPlan parse). First page row becomes the review.
function owPageOnFile(files){
  if(!files || !files.length) return;
  owPageStatus(t("up_reading"), "");
  Promise.all([ upBuildPlan(files), owPageLoadExisting() ]).then(function(a){
    var plan=a[0], rows=(plan&&plan.rows)||[];
    var pageRow=null; for(var i=0;i<rows.length;i++){ if(rows[i] && rows[i].page && rows[i].page.html){ pageRow=rows[i]; break; } }
    if(!pageRow){ owPageStatus(t("up_no_html"), "bad"); return; }
    owPageSetReview({ slug:__owSlug, title:pageRow.title||"", task:pageRow.task||"", page:pageRow.page });
  }, function(e){ owPageStatus((e&&e.message==="not_a_zip")?t("up_not_zip"):t("up_read_failed"), "bad"); });
}
// Entry modes 2 + 3: PICK an existing page (its html copied to THIS campaign at the opp slug) or DUPLICATE it
// (same html, a fresh slug the operator names). Both read the stored html via pageReadHtml -> the SAME review.
function owPagePickList(){
  var box=document.getElementById("owPickList"); if(!box) return;
  owPageLoadExisting().then(function(pages){
    var q=(document.getElementById("owPickSearch")||{}).value; q=String(q||"").trim().toLowerCase();
    var list=(pages||[]).filter(function(p){ return libMatches(p, q); });
    if(!list.length){ box.innerHTML='<div class="lv-empty">'+esc(q?t("lib_no_match"):t("lib_empty"))+'</div>'; return; }
    box.innerHTML = list.map(function(p){
      var title=(p.title&&String(p.title).trim())||upPretty(p.slug);
      return '<div class="ow-pick-row"><div class="ow-pick-meta"><span class="ow-pick-t">'+esc(title)+'</span>'+
        '<span class="ow-pick-s mono-iso" dir="ltr">'+esc(p.slug)+'</span></div>'+
        '<div class="acts"><button class="act" type="button" data-ow-pick="'+esc(p.slug)+'">'+esc(t("ow_use"))+'</button>'+
        '<button class="act" type="button" data-ow-dup="'+esc(p.slug)+'">'+esc(t("ow_duplicate"))+'</button></div></div>';
    }).join("");
    [].forEach.call(box.querySelectorAll("[data-ow-pick]"), function(b){ b.addEventListener("click", function(){ owPagePick(b.getAttribute("data-ow-pick"), false); }); });
    [].forEach.call(box.querySelectorAll("[data-ow-dup]"), function(b){ b.addEventListener("click", function(){ owPagePick(b.getAttribute("data-ow-dup"), true); }); });
  });
}
function owPagePick(slug, duplicate){
  var p=libPageBySlug(slug)||{ slug:slug };
  var title=(p.title&&String(p.title).trim())||upPretty(slug);
  owPageStatus(t("up_reading"), "");
  pageReadHtml(slug).then(function(html){
    owPageStatus("", "");
    // pick -> publish a copy at THIS opp's slug; duplicate -> a fresh slug the operator names (blank to force a choice)
    owPageSetReview({ slug: duplicate ? "" : __owSlug, title:title, task:(p.task||""), page:{ html:String(html||"") } });
  }, function(){ owPageStatus(t("up_read_failed"), "bad"); });
}
// One path button: reuses the mode-selector's .ow-mode-btn look (a titled block with a one-line subtitle), so the
// three campaign paths read exactly like the two send modes - organized, not a wall of controls.
function owPathBtnHtml(path, tkey, subkey){
  var id = "owPath" + path.charAt(0).toUpperCase() + path.slice(1);
  return '<button class="ow-mode-btn ow-path-btn" id="'+id+'" type="button">'+esc(t(tkey))+
    '<span class="ow-mode-sub">'+esc(t(subkey))+'</span></button>';
}
// Choose one of the three paths: highlight it, reveal ITS input (hide the others), and RESET the held plan +
// review so a switch never carries a stale plan into the wrong commit. The Library list loads lazily on pick.
function owSelectPath(path){
  __owPagePath = path; __upPlan = null;
  [["upload","owPathUpload","owBodyUpload"],["pick","owPathPick","owBodyPick"]].forEach(function(x){
    var btn=document.getElementById(x[1]); if(btn) btn.classList.toggle("on", x[0]===path);
    var body=document.getElementById(x[2]); if(body) body.hidden = (x[0]!==path);
  });
  var rev=document.getElementById("owPageReview"); if(rev) rev.innerHTML="";
  owPageStatus("", "");
  if(path==="pick") owPagePickList();
}
// The unified UPLOAD parse (a single page OR a multi-page zip). Keep the WHOLE plan (every page row), exactly as
// the standalone upOnFile does. A SINGLE page defaults its slug to THIS opp's slug (mirroring the old one-page
// path, so the page publishes at the opp's own link); a multi-page zip keeps each page's own derived slug and
// mints its own card. The slug stays editable in the review either way. Commit routes by row count.
function owCampaignOnFile(files){
  if(!files || !files.length) return;
  owPageStatus(t("up_reading"), "");
  Promise.all([ upBuildPlan(files), owPageLoadExisting() ]).then(function(a){
    var plan=a[0], rows=(plan&&plan.rows)||[];
    if(!rows.length){ owPageStatus(t("up_no_html"), "bad"); return; }
    if(rows.length === 1 && __owSlug){ rows[0].slug = __owSlug; }        // a single page -> the opp's own slug (old one-page behavior)
    rows.forEach(function(r){ if(r.included==null) r.included = true; }); // per-item include/exclude: default all included
    __upPlan = plan;                                                    // the WHOLE plan (all pages), never rows[0]
    owReviewRender();
  }, function(e){ owPageStatus((e&&e.message==="not_a_zip")?t("up_not_zip"):t("up_read_failed"), "bad"); });
}
// Append more files to the held plan without dropping the rows already reviewed (the "add more" control). Every
// appended page row defaults to included; the review re-renders with the combined set.
function owCampaignAddFiles(files){
  if(!files || !files.length) return;
  owPageStatus(t("up_reading"), "");
  upBuildPlan(files).then(function(plan){
    var add=(plan&&plan.rows)||[];
    if(!add.length){ owPageStatus(t("up_no_html"), "bad"); return; }
    if(!__upPlan || !__upPlan.rows) __upPlan = { rows:[] };
    add.forEach(function(r){ if(r.included==null) r.included = true; __upPlan.rows.push(r); });
    owReviewRender();
  }, function(e){ owPageStatus((e&&e.message==="not_a_zip")?t("up_not_zip"):t("up_read_failed"), "bad"); });
}
// The matched recipient + subject line for one campaign row (read-only), above its editable fields + page preview.
function owCampMetaHtml(r){
  return '<div class="up-meta"><span class="up-k">'+esc(t("up_col_email"))+':</span> '+
    '<bdi class="mono-iso">'+esc(r.email||t("none"))+'</bdi> '+
    '<span class="up-k">'+esc(t("up_col_subject"))+':</span> '+esc(r.subject||t("none"))+' '+
    upWarnChips(r.warnings||[])+'</div>';
}
function owRowIncluded(r){ return !r || r.included!==false; }
function owReviewIncluded(){ return ((__upPlan&&__upPlan.rows)||[]).filter(owRowIncluded); }
// The review: a LIGHT accordion, one collapsible section per page/row. Each section carries its per-row
// include/exclude toggle, a remove, the matched recipient/subject (its message) and the existing srcdoc
// preview + editable title/slug/task (libRowHtml). One shared renderer for 1..N rows (single page, picked
// template, or a multi-page zip), plus an "add more" control. Nothing here writes; the plan is held for review.
function owReviewRender(){
  var box=document.getElementById("owPageReview"); if(!box) return;
  var rows=(__upPlan&&__upPlan.rows)||[];
  if(!rows.length){ box.innerHTML=""; owPageStatus("", ""); return; }
  var incN = rows.filter(owRowIncluded).length;
  var html = libTasksDatalist(libDistinctTasks(__libPages||[]));
  html += '<div class="up-count" id="owReviewCount">'+esc(t("up_matched"))+' '+incN+'</div>';
  rows.forEach(function(r, i){
    var inc = owRowIncluded(r);
    var title=(r.title&&String(r.title).trim())||upPretty(r.slug||("page-"+(i+1)));
    var meta=(r.email||r.subject) ? owCampMetaHtml(r) : "";
    html += '<div class="ow-acc'+(inc?"":" ow-acc-out")+'" data-acc="'+i+'">'+
        '<div class="ow-acc-sum">'+
          '<label class="ow-acc-inc"><input type="checkbox" data-row-inc="'+i+'"'+(inc?" checked":"")+'> <span>'+esc(t("ow_row_include"))+'</span></label>'+
          '<button type="button" class="ow-acc-toggle" data-acc-toggle="'+i+'" aria-expanded="true"><span class="ow-acc-t" dir="auto">'+esc(title)+'</span></button>'+
          '<button type="button" class="ow-acc-rm" data-row-remove="'+i+'">'+esc(t("ow_row_remove"))+'</button>'+
        '</div>'+
        '<div class="ow-acc-body" id="owAccBody-'+i+'">'+meta+libRowHtml(r, i)+'</div>'+
      '</div>';
  });
  html += '<div class="ow-add-more-wrap"><label class="act ow-add-more">'+esc(t("ow_add_more"))+'<input type="file" id="owAddFile" accept=".zip,.html,.htm" hidden></label></div>';
  box.innerHTML = html;
  try{ libCollectRows(); }catch(e){}
  rows.forEach(function(r, i){
    ["libSlug-","libTitle-","libTask-"].forEach(function(pre){
      var el=document.getElementById(pre+i); if(el) el.addEventListener("input", function(){ try{ libCollectRows(); }catch(e){} });
    });
    var inc=box.querySelector('[data-row-inc="'+i+'"]'); if(inc) inc.addEventListener("change", function(){ owRowSetIncluded(i, inc.checked); });
    var rm=box.querySelector('[data-row-remove="'+i+'"]'); if(rm) rm.addEventListener("click", function(){ owRowRemove(i); });
    var tg=box.querySelector('[data-acc-toggle="'+i+'"]'); if(tg) tg.addEventListener("click", function(){ owAccToggle(i); });
  });
  var af=document.getElementById("owAddFile"); if(af) af.addEventListener("change", function(){ owCampaignAddFiles(af.files); });
  owPageStatus("", "");
}
function owAccToggle(i){
  var body=document.getElementById("owAccBody-"+i); var tg=document.querySelector('[data-acc-toggle="'+i+'"]');
  if(!body) return; var open=body.hasAttribute("hidden");
  if(open){ body.removeAttribute("hidden"); if(tg) tg.setAttribute("aria-expanded","true"); }
  else { body.setAttribute("hidden",""); if(tg) tg.setAttribute("aria-expanded","false"); }
}
function owRowSetIncluded(i, on){
  var rows=(__upPlan&&__upPlan.rows)||[]; if(!rows[i]) return;
  rows[i].included = !!on;
  var acc=document.querySelector('[data-acc="'+i+'"]'); if(acc) acc.classList.toggle("ow-acc-out", !on);
  var cnt=document.getElementById("owReviewCount"); if(cnt) cnt.textContent = t("up_matched")+" "+owReviewIncluded().length;
  try{ libCollectRows(); }catch(e){}   // re-validate: an excluded row no longer blocks the commit
}
function owRowRemove(i){
  var rows=(__upPlan&&__upPlan.rows)||[]; if(i<0 || i>=rows.length) return;
  rows.splice(i, 1);
  owReviewRender();                     // re-render with re-indexed rows (a removed file is gone from the plan)
}
// Mount the Page tab: the THREE labelled paths, the input each reveals, the shared review, the status line.
// owModeBMount calls this. A fresh mount starts with no path chosen (__owPagePath null): the operator picks.
function owPageMount(slug){
  var host=document.getElementById("owPagePanel"); if(!host) return;
  __owPagePath = null;
  // TWO paths now (Thyab's request surfaces them at the FIRST screen): ONE unified upload that accepts a single
  // page OR a full multi-page zip (upBuildPlan folder-pairs both; the review renders 1..N rows), and Pick from the
  // Library. The old separate "campaign" (zip-only) and "page" (single) paths are merged into "upload".
  host.innerHTML =
    '<div class="ow-page-paths">'+
      owPathBtnHtml("upload", "ow_path_upload", "ow_path_upload_sub")+
      owPathBtnHtml("pick", "ow_path_pick", "ow_path_pick_sub")+
    '</div>'+
    '<div class="ow-path-body" id="owBodyUpload" hidden>'+

// The ONE primary action: COMMIT the campaign. Reuses the upCommit-shape primitives (oppUpsert + pageUpsert +
// pagePublishRelay + upActivateBackground) in the same order, but MERGES the campaign fields into the opp's
// EXISTING data so the interactive compose (subject/body/signature) and any notes are preserved (upCommit's
// own data-replace is right for a fresh zip row, but would clobber an interactively-composed opp). B2 strips
// suppressed recipients here, exactly like upCommit. {{ASSET_BASE}} resolved. F1 publish-truth via
// upActivateBackground. Single recipient is fine at G3; rich multi-recipient management is G4.
function owCommitCampaign(slug){
  // Route by ROW COUNT, not by path name: a multi-page upload (N>1 rows, each folder-paired to its own message)
  // iterates into N cards with those paired messages; a single page or a picked template (1 row) takes the
  // interactively-written Message-tab message into ONE card. Both come from the one unified upload/pick surface.
  var inc=owReviewIncluded();                                          // per-item include/exclude: route by INCLUDED count
  if(!inc.length){ owCommitStatus(t("ow_none_included"), "bad"); return Promise.resolve(false); }   // guard: no empty publish
  if(inc.length > 1) return owCommitCampaignAll(slug);                 // multi-page: paired messages, N cards
  if(__owCommitting) return Promise.resolve(false);
  var subj=edVal("edSubj"), body=edVal("edBody");
  if(!(subj.trim() && body.trim())){ owCommitStatus(t("nm_need_msg"), "bad"); return Promise.resolve(false); }
  var pr=inc[0];
  if(!pr || !(pr.page && String(pr.page.html).trim())){ owCommitStatus(t("ow_need_page"), "bad"); return Promise.resolve(false); }
  var v=libCollectRows(true); if(!v.ok){ owCommitStatus(t("lib_fix_rows"), "bad"); return Promise.resolve(false); }   // format/dup/exists validation gate
  __owCommitting=true; owCommitStatus(t("up_writing"), "");
  var pageSlug=pr.slug||slug, html=assetBaseInto(pr.page.html), cycle=upNewCycle(), sig=edSignature();
  var kept=sendToList().filter(function(r){ return !isSuppressed(r.addr); });   // B2 strip at commit
  return oppReadData(slug).then(function(data){
    var next=Object.assign({}, data, { source:"upload", page_title:pr.title||pageSlug,
      outreach_subject:subj, outreach_text:body, sig:sig, recipients:kept });
    if(pageSlug!==slug) next.page_slug=pageSlug;                                 // a renamed page: the card references it by page_slug
    return oppUpsert(slug, { business:pr.title||slug, data:next, up:Date.now(), cycle:cycle, owner:ownerStamp(slug) })   // OWNER column: creator stamped once, preserved on a re-commit
      .then(function(){ return pageUpsert(pageSlug, html, { title:pr.title, task:pr.task }); })
      .then(function(){ return pagePublishRelay(pageSlug, withBeaconClient(html, cycle)); });
  }).then(function(){
    try{ upActivateBackground([pageSlug]); }catch(e){}                            // F1 publish-truth (never a false RED)
    return reloadBoardData().then(function(){},function(){});
  }).then(function(){
    __owCommitting=false; owCommitStatus(t("ow_committed"), "ok"); return true;
  }, function(e){
    __owCommitting=false; owCommitStatus((e&&e.authRequired)?t("err"):t("up_write_failed"), "bad"); return false;
  });
}
// G7 path 1 (FULL CAMPAIGN): commit EVERY row of the held plan - one card + its recipients + its page per row -
// by delegating to upCommit, the SAME multi-row commit the standalone upload path uses (oppUpsert + pageUpsert +
// pagePublishRelay per row, B2 stripping the suppressed recipient at upCommit:347, {{ASSET_BASE}} resolved at
// upCommit:351, F1 publish-truth via the returned published[] -> upActivateBackground). No forked commit; this is
// the exact fix for "a full campaign showed one page". libCollectRows is the shared per-row validation gate (slug
// format / dup / already-exists) and writes the edited slug/title/task back onto the plan rows before the commit.
function owCommitCampaignAll(slug){
  if(__owCommitting) return Promise.resolve(false);
  var rows=owReviewIncluded();                                          // per-item include/exclude: commit ONLY the included rows
  if(!rows.length){ owCommitStatus(t("ow_none_included"), "bad"); return Promise.resolve(false); }   // guard: no empty publish
  var v=libCollectRows(true); if(!v.ok){ owCommitStatus(t("lib_fix_rows"), "bad"); return Promise.resolve(false); }
  __owCommitting=true; owCommitStatus(t("up_writing"), "");
  return upCommit({ rows:rows }).then(function(res){
    try{ upActivateBackground(res.published); }catch(e){}                          // F1 publish-truth, per page
    return reloadBoardData().then(function(){ return res; }, function(){ return res; });
  }).then(function(res){
    __owCommitting=false;
    if(res.fail){                                                                   // name the failed rows, keep the panel
      var names=(res.failed||[]).join(", ");
      owCommitStatus(t("up_done_partial").replace("{k}", String(res.ok||0)).replace("{n}", String((res.ok||0)+res.fail))+" "+names, (res.ok?"warn":"bad"));
      return (res.ok||0)>0;
    }
    owCommitStatus(t("ow_committed_n").replace("{n}", String(res.ok||0)), "ok");
    return true;
  }, function(e){
    __owCommitting=false; owCommitStatus((e&&e.authRequired)?t("err"):t("up_write_failed"), "bad"); return false;
  });
}

// ===================================================================================================
// G4: the window's Mode B RECIPIENTS tab - the opp's recipient list, each with ONE derived status.
// READ-ONLY. No relay, no schema, no write. It REUSES the board's existing ledger reads (restGet /
// fetchInbound / oppReadData / ensureSuppress+isSuppressed) and MIRRORS the app engine's per-recipient
// derivation (library/app.js recipientState + campaignStats P2), so the window and the app agree:
//   - sent/queued  : console_mail rows for this opp, keyed by to_addr (status buckets per the board view:
//                    ''/sent/copied/pending = a dispatched send; queued/held/sending = still in flight);
//   - opened       : the P2 token join console_hits.data.r -> console_mail.id -> to_addr (a hit with no
//                    token stays anonymous, never guessed onto a person);
//   - replied      : a console_inbound reply (kind != auto) whose data.from matches the address;
//   - bounced       : a console_inbound auto+bounce row whose text names the address (hard vs soft from
//                    the bounce value); an unattributable bounce is never pinned onto a recipient;
//   - suppressed   : the B2 do-not-contact set (isSuppressed) - shown distinctly; B2 still refuses it at send.
// Precedence (one clear status): suppressed > hard-bounced > soft-bounced > replied > opened > sent > queued > none.
var OW_RS_KEY = { suppressed:"ow_rs_suppressed", bounced_hard:"ow_rs_bounced_hard", bounced_soft:"ow_rs_bounced_soft",
  replied:"ow_rs_replied", opened:"ow_rs_opened", sent:"ow_rs_sent", queued:"ow_rs_queued", none:"ow_rs_none" };
// Build the join structures ONCE from the three ledgers (mail/hits/inbound), then classify each address against them.
function owRecipContext(mail, inbound, hits){
  var tokTo = {}, sentSet = {}, queuedSet = {};
  (mail || []).forEach(function(m){ m = m || {}; var d = m.data || {};
    if(d.direction === "in") return;                                      // an inbound-mirrored row is not a send
    var addr = String(m.to_addr || d.to || "").trim().toLowerCase(); if(!addr) return;
    var id = m.id || d.mid; if(id) tokTo[id] = addr;                      // P2: the mail row id is the open token
    var st = String(m.status || "").toLowerCase();
    if(st === "" || st === "sent" || st === "copied" || st === "pending") sentSet[addr] = 1;   // dispatched (view counts these)
    else if(st === "queued" || st === "held" || st === "sending") queuedSet[addr] = 1;         // committed / in flight
  });
  var openedSet = {};
  (hits || []).forEach(function(h){ h = h || {}; var d = h.data || {};
    if(h.self || d.self) return;                                          // the operator's own visit is excluded
    if((h.type || d.type || "open") !== "open") return;
    var ref = d.r || d.token || d.mid; if(ref && tokTo[ref]) openedSet[tokTo[ref]] = 1;         // token -> to_addr
  });
  var repliedSet = {}, bounces = [];
  (inbound || []).forEach(function(r){ r = r || {}; var d = r.data || {};
    if(r.kind === "auto"){
      if(r.bounce){
        var text = ((d.snippet || "") + " " + (d.subject || "") + " " + (d.body || d.text || "")).toLowerCase();
        bounces.push({ hard: String(r.bounce).toLowerCase().indexOf("hard") >= 0, text: text });
      }
      return;                                                             // an auto row (bounce / vacation) is never a reply
    }
    var from = String(d.from || r.from || "").trim().toLowerCase(); if(from) repliedSet[from] = 1;
  });
  return { sentSet: sentSet, queuedSet: queuedSet, openedSet: openedSet, repliedSet: repliedSet, bounces: bounces };
}
function owRecipStatus(addr, ctx){
  addr = String(addr || "").trim().toLowerCase();
  if(!addr) return "none";
  if(typeof isSuppressed === "function" && isSuppressed(addr)) return "suppressed";   // B2 posture: refused at send regardless
  var hard = false, soft = false;
  (ctx.bounces || []).forEach(function(b){ if(b.text.indexOf(addr) >= 0){ if(b.hard) hard = true; else soft = true; } });
  if(hard) return "bounced_hard";
  if(soft) return "bounced_soft";
  if(ctx.repliedSet[addr]) return "replied";
  if(ctx.openedSet[addr]) return "opened";
  if(ctx.sentSet[addr]) return "sent";
  if(ctx.queuedSet[addr]) return "queued";
  return "none";
}
// Read the opp's recipients + the three ledgers (scoped to this opp / its effective page), then classify each.
function owRecipLoad(slug){
  return oppReadData(slug).then(function(d){ return d || {}; }, function(){ return {}; }).then(function(data){
    var recips = Array.isArray(data.recipients) ? data.recipients : [];

      var ctx = owRecipContext(mail, inbound, hits);
      return recips.map(function(r){

      });

  });
}

// ===================================================================================================
// PHASE 3 (the last arc) - the networked Contacts + Template memory + Reply tags. This ties the three
// entities (Opportunity, Template, Contact) into ONE network, every view a LENS over the existing ledger:
// nothing new is stored beyond the one console_mail.page_slug column and the console_contacts curation.
//
// It REUSES the same reads and helpers the rest of the board uses (restGet / fetchInbound / bearer / ANON /
// URL_BASE / esc / t / enc / normFrom / fmtWhen / liveUrl / upPretty / smartPerson / bareAddress), and the
// SAME thread bubble markup (.msg.in / .msg.out) the opp detail thread renders. Inlined into the board IIFE
// after the upload module, so all of the above are in scope; function declarations hoist.
//
// Data sources (all best-effort, read-only, bearer+apikey):
//   * console_contacts  - the curation overlay (id, grouped addresses, name, tags). A person is the merge of
//     addresses a human confirmed; an address in NO contact row is its own ad-hoc contact (id "addr:<email>").
//   * console_mail      - the outbound ledger (to_addr, actor=team member, subject, ts, page_slug + a
//     data.page_slug mirror). effectivePageSlug = page_slug || data.page_slug || oppPage[opp] || opp, so a
//     row from before the column landed still resolves its template via the opportunity.
//   * console_inbound   - the replies (data.from, subject, snippet). Human replies only (auto/bounce dropped),
//     the SAME rule buildReplies() uses for the card counts.
//   * console_opps      - only data->>page_slug, for the old-row fallback (the "opp -> page_slug derivation").
//   * console_pages     - slug -> title, so a template shows its human title.
// ===================================================================================================

var __ctModel = null, __ctQuery = "", __ctView = "list", __ctCurrent = null;

// A rich read that degrades to a lean read if the rich columns are not there yet (e.g. a build reaching a DB
// where the additive page_slug column has not been applied). restGet swallows the status, so this does its own
// fetch to tell a 400 (bad column) from a genuine empty, then falls back.
function ctRestOr(pathRich, pathLean){
  return fetch(URL_BASE + "/rest/v1/" + pathRich, {
    method:"GET", headers:{ "apikey":ANON, "Authorization":"Bearer " + bearer() }, cache:"no-store"
  }).then(function(res){
    if(res.ok) return res.text().then(function(tx){ var d=null; try{ d=tx?JSON.parse(tx):null; }catch(e){} return Array.isArray(d)?d:[]; });
    return restGet(pathLean);                                            // rich columns absent -> lean read + derive
  }, function(){ return restGet(pathLean); });
}

// One normalized email key for a contact address (mailto strip + trim + lowercase). The whole network keys on it.
function ctAddr(v){ return normFrom(bareAddress(v)); }

// A display name for a contact: the curated name, else a name derived from the address (smartPerson), else the
// bare address. Never a machine token.
function ctName(rec){
  var n = rec && rec.name ? String(rec.name).trim() : "";
  if(n) return n;
  var a = rec && rec.primaryAddr ? rec.primaryAddr : "";
  var d = a ? String(smartPerson(a)||"").trim() : "";
  return d || a || t("unnamed");
}

// Build the whole contact network from the five reads. Pure (no DOM); returns { contacts, byId, byAddr,
// templates, pageTitle }.
function ctBuild(contacts, mail, inbound, opps, pages){
  var oppPage = {}, pageTitle = {};
  (opps||[]).forEach(function(o){ if(o && o.slug) oppPage[o.slug] = (o.ps && String(o.ps).trim()) || o.slug; });
  (pages||[]).forEach(function(p){ if(p && p.slug) pageTitle[p.slug] = (p.title && String(p.title).trim()) || upPretty(p.slug); });

  var byId = {}, byAddr = {};
  function ensure(cid, addr){
    if(byId[cid]) return byId[cid];
    var rec = { id:cid, addresses:[], addrSet:{}, name:"", tags:[], note:"", primaryAddr:addr||"",
                sends:0, replyCount:0, lastTs:"", tmpl:{}, convo:[] };
    byId[cid] = rec; return rec;
  }
  function addAddr(rec, addr){ addr = ctAddr(addr); if(addr && !rec.addrSet[addr]){ rec.addrSet[addr]=1; rec.addresses.push(addr); byAddr[addr]=rec; if(!rec.primaryAddr) rec.primaryAddr=addr; } }

  // 1) curated contacts first, so their merge (grouped addresses) owns every address they claim
  (contacts||[]).forEach(function(c){ if(!c || !c.id) return;
    var rec = ensure(c.id, "");
    rec.name = c.name ? String(c.name).trim() : "";
    rec.tags = Array.isArray(c.tags) ? c.tags : [];
    rec.note = c.note ? String(c.note) : "";
    var addrs = Array.isArray(c.addresses) ? c.addresses : [];
    addrs.forEach(function(a){ addAddr(rec, a); });
  });
  function recFor(addr){
    addr = ctAddr(addr); if(!addr) return null;
    if(byAddr[addr]) return byAddr[addr];
    var rec = ensure("addr:"+addr, addr); addAddr(rec, addr); return rec;   // ad-hoc contact: an address no human has merged yet
  }

  // 2) outbound sends: attribute each to its contact + its template
  var templates = {};
  function tmpl(slug){ return templates[slug] || (templates[slug] = { slug:slug, title:(pageTitle[slug]||upPretty(slug)), count:0, contactIds:{}, sends:[] }); }
  (mail||[]).forEach(function(m){ if(!m) return;
    var addr = ctAddr(m.to_addr); if(!addr) return;
    var rec = recFor(addr); if(!rec) return;
    var eff = (m.page_slug && String(m.page_slug).trim()) || (m.data && m.data.page_slug && String(m.data.page_slug).trim()) || oppPage[m.opp] || m.opp || "";
    var ts = String(m.ts || (m.data && m.data.ts) || "");
    rec.sends++; if(ts > rec.lastTs) rec.lastTs = ts;
    if(eff){
      var te = rec.tmpl[eff] || (rec.tmpl[eff] = { slug:eff, title:(pageTitle[eff]||upPretty(eff)), count:0, lastTs:"" });
      te.count++; if(ts > te.lastTs) te.lastTs = ts;
      var T = tmpl(eff); T.count++; T.contactIds[rec.id] = 1;
      T.sends.push({ cid:rec.id, addr:addr, actor:(m.actor||""), ts:ts, subject:(m.subject||(m.data&&m.data.subject)||"") });
    }
    rec.convo.push({ dir:"out", ts:ts, subject:(m.subject||(m.data&&m.data.subject)||""), actor:(m.actor||""), pageSlug:eff });
  });

  // 3) inbound replies: human only (auto/bounce dropped), the same rule as the card counts
  (inbound||[]).forEach(function(r){ if(!r) return; var d=r.data||{};
    if(r.kind==="auto" || r.bounce) return;
    var from = ctAddr(d.from || r.from); if(!from) return;
    var rec = recFor(from); if(!rec) return;
    var ts = String(r.ts || d.ts || "");
    rec.replyCount++; if(ts > rec.lastTs) rec.lastTs = ts;
    rec.convo.push({ dir:"in", ts:ts, from:from, subject:(d.subject||""), snippet:(d.snippet||d.body||d.text||"") });
  });

  // 4) finalize each contact: sort the conversation, number the inbound replies, freeze the template list
  var list = Object.keys(byId).map(function(id){ return byId[id]; });
  list.forEach(function(rec){
    rec.convo.sort(function(a,b){ return a.ts<b.ts?-1:(a.ts>b.ts?1:0); });
    var n=0; rec.convo.forEach(function(x){ if(x.dir==="in"){ n++; x.num=n; } });
    rec.templates = Object.keys(rec.tmpl).map(function(k){ return rec.tmpl[k]; }).sort(function(a,b){ return b.lastTs<a.lastTs?-1:(b.lastTs>a.lastTs?1:0); });
    if(!rec.primaryAddr && rec.addresses.length) rec.primaryAddr = rec.addresses[0];
  });
  // A contact is anyone curated OR anyone ever emailed/replied. Curated-but-never-touched people still list
  // (the shared address book), so the section truly retires the Legacy Contacts.
  list.sort(function(a,b){ if(a.lastTs!==b.lastTs) return a.lastTs<b.lastTs?1:-1; return ctName(a)<ctName(b)?-1:1; });
  return { contacts:list, byId:byId, byAddr:byAddr, templates:templates, pageTitle:pageTitle };
}

// A reply tag inside the Library must leave the Library and open the Contacts conversation.
function ctOpenConvoFromLibrary(cid){
  closeLibraryView();
  openContactsView();
  // openContactsView reloads async; wait for the model, then land on the contact.
  var tries=0;
  (function land(){ if(__ctModel && __ctModel.byId[cid]){ ctOpenConvo(cid); return; } if(tries++>40) return; setTimeout(land, 50); })();
}

  function normFrom(s){ return String(s==null?"":s).trim().toLowerCase(); }
  // One resolver, linked-everywhere-or-nowhere (§3): a reply belongs to a card ONLY by its stored resolved opp
  // (the server attributed it on write); auto-replies and bounces move no card; dedup by sender keeping the
  // earliest, sort, number 1..N. An unattributed human reply is inbox backlog (feeds the inbound-health pill).
  function buildReplies(inbound){
    var byOpp={}, waiting=0;
    (Array.isArray(inbound)?inbound:[]).forEach(function(r){ try{
      r=r||{}; var data=r.data||{};
      if(r.kind==="auto" || r.bounce) return;
      var opp=r.opp||"";
      if(!opp){ waiting++; return; }
      var from=normFrom(data.from||r.from), ts=String(r.ts||data.ts||"");
      var g=byOpp[opp]||(byOpp[opp]={});
      var key=from||("_"+ts);
      // Keep a snippet for the L3 drawer thread (never changes the count/numbering; still one resolver).
      if(!g[key] || ts < g[key].ts) g[key]={ from:from, ts:ts, subject:(data.subject||""), snippet:(data.snippet||data.body||data.text||"") };
    }catch(e){} });
    var count={}, list={};
    Object.keys(byOpp).forEach(function(slug){
      var items=Object.keys(byOpp[slug]).map(function(k){ return byOpp[slug][k]; }).sort(function(a,b){ return a.ts<b.ts?-1:(a.ts>b.ts?1:0); });
      items.forEach(function(it,i){ it.num=i+1; });
      count[slug]=items.length; list[slug]=items;
    });
    return { count:count, list:list, waiting:waiting };
  }
  // new-activity (paintCardBadges spirit): per-card last-seen last_activity_ts, device-local. A card is "new"
  // only if it was seen before AND its activity is newer; a first view marks nothing new.
  function readSeen(){ try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}")||{}; }catch(e){ return {}; } }
  function writeSeen(m){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify(m||{})); }catch(e){} }
  function countUpAll(){
    try{
      var els=root.querySelectorAll("[data-countup]");
      [].forEach.call(els, function(el){
        var to=Number(el.getAttribute("data-countup"))||0, dur=520, t0=null;
        if(to<=0){ el.textContent="0"; return; }
        function step(ts){ if(t0===null) t0=ts; var p=Math.min(1,(ts-t0)/dur); el.textContent=String(Math.round(p*to)); if(p<1) requestAnimationFrame(step); else el.textContent=String(to); }
        requestAnimationFrame(step);
      });
    }catch(e){}
  }

  // ---- views (localized; a lang toggle sits on the sign-in card and in the board header) ----
  var VIEW = "signin", __data = null;

  function rerender(){ if(VIEW==="board" && __data){ renderBoard(__data); } else if(VIEW==="board"){ loadBoard(); } else { signinView(); } }

  // Synchronous "connecting" card: painted before any network call so a warm boot (an expired token that
  // needs one refresh) never shows a blank/black screen while the auth request is in flight.
  function connectingView(){

      '<div class="signin">' +

  function signinView(){

      '<div class="signin">' +
      '<h1>' + esc(t("title")) + '</h1>' +

      '<input id="em" type="email" autocomplete="username" spellcheck="false" placeholder="' + esc(t("email")) + '">' +
      '<input id="pw" type="password" autocomplete="current-password" placeholder="' + esc(t("pass")) + '">' +
      '<button id="go" class="primary" type="button">' + esc(t("go")) + '</button>' +
      '<div id="siErr"></div>' +
      '<p style="margin:14px 0 0">' + langBtn() + '</p>' +

    var em=document.getElementById("em"), pw=document.getElementById("pw"), go=document.getElementById("go"), er=document.getElementById("siErr");
    var lb=document.getElementById("langBtn"); if(lb) lb.addEventListener("click", toggleLang);

    function submit(){

        .catch(function(ex){
          go.disabled=false; go.textContent=t("go"); er.innerHTML="";

          if(offline){                                                                       // one-tap retry, only for a connection failure (not a credential error)

  // Operator chip (signed-in email) + language toggle + refresh + sign-out.

      '<span class="row-actions">' + langBtn() + themeBtn() +
        // Step 2D: the Admin executive surface is a SEPARATE header entry, hidden by default and revealed only

        // New message: the ONE compose entry. It opens the centered window on the mode selector (message without

        // campaign now lives in the window's Page tab (Mode B).
        // New message is the send-journey entry (a core console option, section 4 exception): it keeps its word
        // and gains a leading compose icon, never icon-only.
        '<button class="link link-ic" id="newMsgBtn" type="button">' + iconText("compose", t("nm_open")) + '</button>' +

  function owNewMessage(){

    try{ if(typeof nmClearStore==="function") nmClearStore(); }catch(e){}
    try{ __edBase[slug] = {}; }catch(e){}
    openOppWindow(slug, null);                                         // null mode -> the mode selector
  }
  // Stable seams for the window and its tests: owSelectMode lets a test drive the window's mode directly; the
  // card tap and "New message" reach the window through openOppWindow.
  try{ window.openOppWindow = openOppWindow; window.closeOppWindow = closeOppWindow; window.owSelectMode = owSelectMode; window.owNewMessage = owNewMessage; }catch(e){}
  try{ window.__thriveOwState = function(){ return { slug:__owSlug, mode:__owMode }; }; }catch(e){}   // test seam: the open opp + its mode
  // Phase 3 seams: open the Contacts surface and drive a contact/conversation directly (the nav button reaches
  // openContactsView; these let a test land on the surface without depending on the header paint).
  try{ window.openContactsView = openContactsView; window.closeContactsView = closeContactsView; window.ctDetailRender = ctDetailRender; window.ctOpenConvo = ctOpenConvo; }catch(e){}
  // G5: the standalone campaign-upload overlay lost its nav entry (campaign upload now lives in the window's Page
  // tab), but the overlay + its shared parser/commit engine are retained; expose openUpload as a utility seam so
  // the upload-engine E2E can still drive it. (Not a user path - the nav no longer surfaces it.)
  try{ if(typeof openUpload==="function") window.openUpload = openUpload; }catch(e){}
  // The standalone New-message overlay is retained (its shared compose writer is the same one the window uses),
  // but off-nav - the "New message" button now opens the window. Expose openNewMessage as a utility seam so the
  // overlay-mechanics E2E can still drive it directly.
  try{ if(typeof openNewMessage==="function") window.openNewMessage = openNewMessage; }catch(e){}
  function runOppWrite(slug, optimistic, patch, after){
    if(__writing) return; __writing=true;
    var row=findRow(slug); if(!row){ __writing=false; return; }
    var snap=JSON.parse(JSON.stringify(row));                            // exact pre-write state for a clean revert
    try{ optimistic(row); }catch(e){}
    __act[slug]={ msg:t("a_saving"), cls:"" };
    owActsDisabled(true);
    try{ renderBoard(__data); }catch(e){}                               // optimistic paint: the card jumps at once
    oppPatch(slug, patch).then(function(){
      return after ? Promise.resolve().then(after) : null;             // optional follow-up write (e.g. an approval note into data.notes)
    }).then(function(){
      return reloadBoardData();                                         // confirmed: adopt server truth
    }).then(function(){
      __writing=false; __act[slug]={ msg:t("a_saved"), cls:"ok" }; refreshOppDetail(slug);
    }).catch(function(e){
      __writing=false;
      replaceRow(slug, snap); try{ renderBoard(__data); }catch(x){}     // revert the optimistic change
      __act[slug]={ msg:((e&&e.authRequired)? t("err") : t("a_failed")), cls:"bad" };
      if(oppSurfaceActive(slug)) refreshOppDetail(slug); else redInto(root, "write", new Error(t("a_failed")));
    });
  }
  // Bounded DELETE through the same authFetchOnce discipline as oppPatch (settles always, one refresh-retry). The
  // DB grant (docs/supabase-opp-delete.sql) permits DELETE on console_opps/console_pages; the ledger tables have
  // no delete policy, so a delete can never reach the record of what was sent or received.
  function restDelete(path, retried){
    var url = URL_BASE + "/rest/v1/" + path;
    return authFetchOnce(url, {
      method:"DELETE",
      headers:{ "apikey":ANON, "Authorization":"Bearer "+bearer(), "Prefer":"return=minimal" },
      cache:"no-store"
    }).then(function(r){
      if((r.res.status===401 || r.res.status===403) && !retried && session() && session().refresh_token){
        return refresh().then(function(ok){ if(ok) return restDelete(path, true); var e=new Error("auth"); e.authRequired=true; throw e; });
      }
      if(!r.res.ok){ var e2=new Error((r.data && r.data.message) || ("HTTP "+r.res.status)); if(r.res.status===401||r.res.status===403) e2.authRequired=true; throw e2; }
      return true;
    });
  }
  // Full delete of one card. OWNERSHIP: a promoted card carries data.page_slug and SHARES the template page, so it
  // never owns a console_pages row of its own - delete ONLY its opp. A card with NO data.page_slug owns its page,
  // so its console_pages row is removed with it. The ledger (console_mail/console_inbound) is never touched.
  function oppDelete(slug){
    return oppReadData(slug).then(function(data){
      var ownsPage = !(data && data.page_slug);                         // no page_slug => the card owns its own page
      return restDelete("console_opps?slug=eq."+enc(slug)).then(function(){
        if(!ownsPage) return true;                                      // shared template page: leave it for the other cards
        return restDelete("console_pages?slug=eq."+enc(slug)).catch(function(){ return true; });   // best-effort; a missing page row is fine
      });
    });
  }
  function runOppDelete(slug){
    if(__writing) return; __writing=true;
    __act[slug]={ msg:t("a_deleting"), cls:"" }; owActsDisabled(true);
    if(oppSurfaceActive(slug)){ try{ refreshOppDetail(slug); }catch(e){} }
    oppDelete(slug).then(function(){
      delete __delConfirm[slug]; delete __act[slug];
      __writing=false;
      if(owDetailActive(slug)) closeOppWindow();                       // the card is gone; leave the window
      return reloadBoardData();
    }).catch(function(e){
      __writing=false;
      __act[slug]={ msg:((e&&e.authRequired)? t("err") : t("a_del_failed")), cls:"bad" };
      if(oppSurfaceActive(slug)) refreshOppDetail(slug); else redInto(root, "delete", new Error(t("a_del_failed")));
    });
  }
  // The localized name of the lane a card was archived from (archived_from stores a laneOf() key). Falls back to
  // the raw key so an unknown/legacy value is shown, never blanked.
  function laneLabel(key){ key=String(key||""); if(!key) return ""; if(key==="tray") return t("tray"); var lbl=t("l_"+key); return (lbl && lbl!=="l_"+key) ? lbl : key; }
  // The archived record shown on a closed card: WHEN it was archived and FROM WHICH column. Read from the opp
  // row (fetchDetail selects archived_at/archived_from); absent on a legacy archive, in which case it renders nothing.
  function archivedInfoHtml(row, detail){
    if(!(row && row.archived)) return "";
    var o=(detail && detail.opp) || {};
    var at=o.archived_at ? fmtWhen(o.archived_at) : "", from=o.archived_from ? laneLabel(o.archived_from) : "";
    if(!at && !from) return "";
    var rows="";
    if(at)   rows += '<div class="af-row"><span class="af-k">'+esc(t("a_arch_at"))+'</span> <bdi>'+esc(at)+'</bdi></div>';
    if(from) rows += '<div class="af-row"><span class="af-k">'+esc(t("a_arch_from"))+'</span> <bdi>'+esc(from)+'</bdi></div>';
    return '<div class="dw-sec arch-facts">'+rows+'</div>';
  }
  function onAction(slug, act){
    var m=Date.now(), row=findRow(slug); if(!row) return; var st=row.stage||"";
    if(act==="send")    return unifiedSend(slug);                         // UNIFY: persist live message+recipients, then the shared L5 runSend
    // APPROVAL GATE (stage_gate). "promote" is the admin "Approve, move to Ready": it stamps approved_at + the
    // approver's uid (Axiom 5), never the stage - the VIEW derives 'live' from approved_at (Axiom 6). No client
    // stage math, so the card can never reach Ready without this human write. An optional note is recorded on the
    // record (data.notes, carrying its own actor + ts). "revert" un-approves: it clears approved_at, and the view
    // returns the card to 'draft' (Under review).
    if(act==="promote"){
      var note = (typeof window!=="undefined" && window.prompt) ? window.prompt(t("a_approve_note")) : "";
      if(note === null) return;                                          // the operator cancelled -> do not approve
      var at = isoNow(), by = currentUid();
      return runOppWrite(slug, function(r){ r.approved_at = at; r.approved_by = by; },
                         { approved_at:at, approved_by:by, up:m },
                         (note && note.trim()) ? function(){ return addNote(slug, note.trim()); } : null);
    }
    if(act==="revert")  return runOppWrite(slug, function(r){ r.approved_at=null; r.approved_by=null; }, { approved_at:null, approved_by:null, up:m });
    // RICH ARCHIVE: keep the one opp row (all conversations by slug + notes preserved), and STAMP when + from which
    // column it was archived, so the archive is a legible record, not just a flag. laneOf(row) is the visible lane.
    if(act==="archive") return runOppWrite(slug, function(r){ r.archived=true; }, { archived:true, archived_at:isoNow(), archived_from:laneOf(row), up:m });
    if(act==="reopen"){
      var clear = TRAY_STAGES.indexOf(st)>=0;                           // a legacy terminal declaration is cleared; a replied+archived card keeps its earned stage
      return runOppWrite(slug, function(r){ r.archived=false; if(clear) r.stage=""; }, clear ? { archived:false, stage:"", up:m } : { archived:false, up:m });
    }
    // FULL DELETE, two-tap confirmed: first tap arms the confirm, the "delete_go" tap performs it, "delete_cancel" clears.
    if(act==="delete"){ __delConfirm[slug]=true; refreshOppDetail(slug); return; }          // re-render to show the two-tap confirm
    if(act==="delete_cancel"){ delete __delConfirm[slug]; refreshOppDetail(slug); return; }
    if(act==="delete_go") return runOppDelete(slug);
  }
  function setNoteStatus(msg, cls){ var el=document.getElementById("noteStatus"); if(el){ el.className="act-status"+(cls?(" "+cls):""); el.textContent=msg||""; } }
  function renderNotesInto(slug){ var host=document.getElementById("notesList"); if(!host) return; var notes=__notes[slug]||[]; host.innerHTML = notes.length ? notes.slice().reverse().map(noteItemHtml).join("") : '<div class="empty">'+esc(t("d_no_notes"))+'</div>'; }
  function onAddNote(slug){
    var input=document.getElementById("noteIn"); if(!input) return;
    var text=(input.value||"").trim(); setNoteStatus("", "");
    if(!text) return;
    if(__writing) return; __writing=true;
    setNoteStatus(t("a_note_saving"), ""); var na=document.getElementById("noteAdd"); if(na) na.disabled=true;
    addNote(slug, text).then(function(notes){                            // confirmed via read-back (count grew)
      __writing=false; __notes[slug]=notes;
      if(owDetailActive(slug)){ var i2=document.getElementById("noteIn"); if(i2) i2.value=""; renderNotesInto(slug); setNoteStatus(t("a_note_saved"), "ok"); var n2=document.getElementById("noteAdd"); if(n2) n2.disabled=false; }
    }).catch(function(e){
      __writing=false; var n3=document.getElementById("noteAdd"); if(n3) n3.disabled=false;
      setNoteStatus((e&&e.authRequired)? t("err") : t("a_note_failed"), "bad");
    });
  }

  function renderBoard(data){
    data = data || {}; __data = data; VIEW="board"; applyLang();
    var rows = Array.isArray(data.rows) ? data.rows : [];
    var groups = {}; BOARD_LANES.concat(["tray","other"]).forEach(function(l){ groups[l]=[]; });
    rows.forEach(function(r){ try{ groups[laneOf(r)].push(r); }catch(e){} });
    // ONE bucketer, ONE count (no second count path): the verdict hero, the pipeline strip, and every lane header
    // all read the SAME laneOf() grouping via laneN(). A replied+archived opp counts as Replied here precisely
    // because laneOf() keeps it in "replied"; the old cnt() scan (which subtracted archived) is gone.
    function laneN(l){ return (groups[l]||[]).length; }

    // Verdict hero (count-up) + the five-stage pipeline strip.
    var draft=laneN("draft"), live=laneN("live"), sent=laneN("sent"), opened=laneN("opened"), replied=laneN("replied");
    var awaiting=sent+opened, heroN, heroK;
    if(replied>0){ heroN=replied; heroK="v_replied"; }
    else if(awaiting>0){ heroN=awaiting; heroK="v_awaiting"; }
    else if(live>0){ heroN=live; heroK="v_ready"; }
    else { heroN=draft; heroK="v_draft"; }
    var verdict = '<div class="verdict"><span class="vnum" data-countup="' + heroN + '">0</span><span class="vlabel">' + esc(t(heroK)) + '</span></div>';

    // The STAT CLUSTER: one consistent chip shape, grouped by meaning. Group 1 is the five pipeline states
    // (the lane scale, left to right); group 2 is the status flags (live, replies waiting, stalled, archived).
    // Every chip is a state glyph + its number, its name on hover AND on touch (data-tip), with a permanent
    // aria-label. Colour is the lane/state hue (semantic, never the only carrier). The cluster wraps into a
    // compact grid on a phone (CSS below). A stat helper keeps the shape identical everywhere.
    function stat(cls, dataLane, glyph, valueHtml, label){
      var aria = label + (valueHtml!=="" ? (": " + String(valueHtml).replace(/<[^>]*>/g,"")) : "");
      return '<span class="stat' + (cls?" "+cls:"") + '"' + (dataLane?' data-lane="'+dataLane+'"':'') +
        ' aria-label="' + esc(aria) + '" title="' + esc(label) + '" data-tip="' + esc(label) + '">' +
        icon(glyph, 14) + (valueHtml!=="" ? '<span class="pn">' + valueHtml + '</span>' : '') + '</span>';
    }
    var pipeStats = ["draft","live","sent","opened","replied"].map(function(st){
      var n = laneN(st);
      return '<span class="stat" data-lane="' + st + '" aria-label="' + esc(t("l_"+st)) + ': ' + n + '" title="' + esc(t("l_"+st)) + '" data-tip="' + esc(t("l_"+st)) + '">' +
        icon(laneIcon(st), 14) + '<span class="pn" data-countup="' + n + '">0</span></span>';
    }).join("");

    // Status flags (display only): the live-freshness flag, replies waiting to be filed (console_inbound), and
    // the stalled / archived counts. Only the non-empty ones show, so the group stays tidy. The engine's
    // drift/sync pills are intentionally NOT carried: the direct reader has no local ledger to drift from and no
    // relay to be stale against, so there is nothing truthful to show.
    var stalled=0, archived=0;
    rows.forEach(function(r){ if(r && r.archived) archived++; else if((r.stage==="sent"||r.stage==="opened") && Number(r.idle_days||0)>7) stalled++; });
    var waiting = (__reps && __reps.waiting) || 0;
    var flags = stat("is-live", "", "live", "", t("p_live"));
    if(waiting)  flags += stat("is-waiting", "", "replied", String(waiting), t("p_waiting"));
    if(stalled)  flags += stat("is-stalled", "", "stalled", String(stalled), t("c_stalled"));
    if(archived) flags += stat("is-archived", "", "archived", String(archived), t("c_archived"));

    var statsHtml = '<div class="statbar">' + verdict +
      '<div class="stats">' +
        '<div class="stat-group stat-pipe" role="group" aria-label="' + esc(t("stats_pipe")) + '">' + pipeStats + '</div>' +
        '<div class="stat-group stat-flags" role="group" aria-label="' + esc(t("stats_flags")) + '">' + flags + '</div>' +
      '</div>' +
      '<div class="muted stat-total">' + rows.length + ' ' + esc(t("opps")) + '</div>' +
    '</div>';

    // Lanes: the five open lanes always; bounced/failed only when non-empty; "other" only if (unexpectedly) used.
    var order = ["draft","live","sent","opened","replied"];
    if((groups.bounced||[]).length) order.push("bounced");
    if((groups.failed||[]).length) order.push("failed");
    if((groups.other||[]).length) order.push("other");
    var lanesHtml = '<div class="lanes">' + order.map(function(l){
      var list = groups[l] || [];
      return '<div class="lane" data-lane="' + l + '"><h2><span class="lane-h-l">' + icon(laneIcon(l)) + '<span>' + esc(t("l_"+l)) + '</span></span><span class="n">' + list.length + '</span></h2>' +
             (list.length ? list.map(cardHtml).join("") : '<div class="empty">' + esc(t("none")) + '</div>') + '</div>';
    }).join("") + '</div>';

    // Closed/archived tray: the archived shelf lists EVERY archived opp plus won/lost/dropped, independent of the
    // stage lane it also appears in - a replied+archived opp shows in Replied AND here, because archiving is a
    // shelf, not an exclusion (and never subtracts from its stage count). Collapsible; per-card reopen is later.
    var tray = rows.filter(function(r){ return r && (r.archived || TRAY_STAGES.indexOf((r && r.stage) || "")>=0); });
    var trayHtml = '<section class="tray"><button class="tray-toggle link" id="trayToggle" type="button" aria-expanded="false">' +
      esc(t("tray")) + ' <span class="n">' + tray.length + '</span></button>' +
      '<div class="tray-body" id="trayBody" hidden>' + (tray.length ? tray.map(cardHtml).join("") : '<div class="empty">'+esc(t("none"))+'</div>') + '</div></section>';

    // ONE top bar: the account/quota/nav render into the shell's single .topbar (beside the logo + wordmark),
    // not as a second row. The board content (the stat cluster + lanes + tray) fills #root below the one bar.
    var hn=document.getElementById("headNav"); if(hn) hn.innerHTML = headerHtml();
    root.innerHTML = statsHtml + lanesHtml + trayHtml;
    wireHeader();
    var tt=document.getElementById("trayToggle"), tb=document.getElementById("trayBody");
    if(tt && tb) tt.addEventListener("click", function(){ var open=tb.hidden; tb.hidden=!open; tt.setAttribute("aria-expanded", String(open)); });
    // L3: tap any card (open lane OR tray) to open the opportunity. G5: the centered window is the ONE open path,
    // opened detail-first (the drawer is retired), so a card tap manages the existing opp.
    [].forEach.call(root.querySelectorAll(".card[data-slug]"), function(c){
      var slug=c.getAttribute("data-slug");
      var open=function(){ openOppWindow(slug, "detail"); };
      c.addEventListener("click", open);
      c.addEventListener("keydown", function(e){ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); open(); } });
    });
    countUpAll();
  }

  // ONE read path (fetchBoard + fetchInbound -> renderBoard), reused by the first load AND by every post-write
  // re-read: after a confirmed write, the board reads console_board again and paints from SERVER TRUTH, never
  // from the optimistic local stage (§3 stage-authority). Returns the settled promise so a write can chain on it.
  // CARD META read: the owner (additive console_opps.owner column) and the first recipient email
  // (data.recipients[0].addr), for every opp, in TWO bounded best-effort selects so the email always resolves
  // even before the owner column is applied in Supabase. A missing owner column (unapplied SQL) or any failure
  // 400s to [] via restGet, so owner stays unknown (unassigned) and the email line still shows - never a break.
  function fetchCardMeta(){
    return Promise.all([
      // the first recipient email (existing data jsonb) - always resolves.
      restGet("console_opps?select=slug,to:data->recipients->0->>addr"),
      // the OWNER column (additive; docs/supabase-owner-column.sql). Its own select so, until the column is
      // applied in Supabase, this read 400s to [] via restGet and only the owner is unknown - the email and the
      // derived fallback below still work, so the board never breaks waiting on the migration.
      restGet("console_opps?select=slug,owner"),
      // DERIVED owner fallback for rows not yet backfilled: the earliest send's actor per opp (console_mail is
      // ordered ts.asc, so the first actor seen is the original sender). No SQL needed for this to light up.
      restGet("console_mail?select=opp,actor,ts&order=ts.asc")
    ]).then(function(a){
      var m = {};
      (Array.isArray(a[0]) ? a[0] : []).forEach(function(r){ if(r && r.slug){ var e = m[r.slug] || (m[r.slug] = {}); e.email = String(r.to || ""); } });
      (Array.isArray(a[1]) ? a[1] : []).forEach(function(r){ if(r && r.slug){ var e = m[r.slug] || (m[r.slug] = {}); e.owner = String(r.owner || ""); } });
      (Array.isArray(a[2]) ? a[2] : []).forEach(function(r){ if(r && r.opp && r.actor){ var e = m[r.opp] || (m[r.opp] = {}); if(!e.derived) e.derived = String(r.actor); } });
      return m;
    }, function(){ return {}; });
  }
  // OWNER STAMP for a write: preserve the durable owner (the console_opps.owner column, mirrored into __cardMeta),
  // else the derived earliest-sender, else the current signed-in member. So the FIRST of create/upload/send stamps
  // the creator and a later re-save/re-send never clobbers them; a brand-new opp (absent from __cardMeta) is owned
  // by the current member. Never fabricates: an unknown owner resolves to the current member only at a real write.
  function ownerStamp(slug){
    var m = __cardMeta && __cardMeta[slug];
    return (m && (m.owner || m.derived)) || currentUid();
  }
  function reloadBoardData(){
    return fetchBoard(false).then(function(rows){
      return Promise.all([ fetchInbound(), fetchCardMeta() ]).then(function(res){
        var inbound = res[0]; __cardMeta = res[1] || {};
        rows = Array.isArray(rows) ? rows : [];
        __seen = readSeen();
        __reps = buildReplies(inbound);
        try{ renderBoard({ rows: rows }); }catch(e){ redFull("render", e); }
        // update last-seen to current activity, so the NEXT load flags what changed since now
        var next={}; rows.forEach(function(r){ if(r && r.slug) next[r.slug]=String(r.last_activity_ts||""); });
        writeSeen(next);
      });
    });
  }
  function loadBoard(){
    VIEW="board"; applyLang();
    try{ loadIdentity(); }catch(e){}   // Step 1: fire-and-forget profile/role load; NEVER gates the render
    try{ loadSuppressions().catch(function(){}); }catch(e){}   // B2: fire-and-forget do-not-contact set load; the send/upload paths re-await it (ensureSuppress). A failed preload leaves the set unloaded, so the FAIL-CLOSED send path blocks until a load succeeds; it never gates the render.
    var hn=document.getElementById("headNav"); if(hn) hn.innerHTML = headerHtml();
    root.innerHTML = '<div class="muted" style="padding:10px 2px">' + esc(t("loading")) + '</div>';
    wireHeader();
    reloadBoardData().catch(function(e){ if(e && e.authRequired){ signinView(); } else { redFull("board fetch", e); } });
  }

  // Warm boot: adopt a surviving mirrored session into memory (session() does it) and go STRAIGHT to the board,
  // no re-sign-in; an expired token gets one bounded refresh. Never a loop (refresh clears only on a definitive
  // 400/401), never a black screen (everything wrapped; an auth failure returns the sign-in card, not red text).
  function boot(){
    applyLang();
    applyTheme();                                                       // re-resolve the theme once the session (and its uid) is in memory
    try{
      if(!signedIn()){ signinView(); return; }
      var s=session();
      if(!expired(s)){ loadBoard(); return; }
      connectingView();   // paint at once so the warm-boot refresh never shows a blank screen while it is in flight
      refresh().then(function(ok){ ok ? loadBoard() : signinView(); }).catch(function(){ signinView(); });
    }catch(e){ redFull("boot", e); }
  }
  // Overlay dismissal wired once: a backdrop tap or Escape closes the open surface and returns to the board.
  (function(){ try{
    var ps=document.getElementById("pfScrim");                                            // Step 2B profile overlay
    if(ps) ps.addEventListener("click", function(e){ if(e.target===ps) closeProfile(); });
    var as=document.getElementById("admScrim");                                           // Step 2D admin overlay
    if(as) as.addEventListener("click", function(e){ if(e.target===as) closeAdmin(); });
    var ns=document.getElementById("nmScrim");                                            // E1 new-message overlay
    if(ns) ns.addEventListener("click", function(e){ if(e.target===ns) closeNewMessage(); });
    var us=document.getElementById("upScrim");                                            // E2 upload overlay
    if(us) us.addEventListener("click", function(e){ if(e.target===us) closeUpload(); });
    var lvs=document.getElementById("libViewScrim");                                      // PR-L1 Library surface
    if(lvs) lvs.addEventListener("click", function(e){ if(e.target===lvs) closeLibraryView(); });
    var cts=document.getElementById("ctScrim");                                           // Phase 3 Contacts surface
    if(cts) cts.addEventListener("click", function(e){ if(e.target===cts) closeContactsView(); });
    var ow=document.getElementById("owScrim");                                            // G1 centered opportunity window
    if(ow) ow.addEventListener("click", function(e){ if(e.target===ow) closeOppWindow(); });
    var owc=document.getElementById("owClose"); if(owc) owc.addEventListener("click", function(){ closeOppWindow(); });
    var owm=document.getElementById("owChangeMode"); if(owm) owm.addEventListener("click", function(){ __owMode=null; owRender(); });   // switch mode back from the header
    document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeOppWindow(); closeProfile(); closeAdmin(); closeNewMessage(); closeUpload(); closeLibraryView(); closeContactsView(); } });
  }catch(e){} })();
  boot();
})();
