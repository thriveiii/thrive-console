<script>/* First paint in the operator's language: set dir/lang from thrive_lang before any render, so Arabic is right-to-left from the first frame (i18n.js first-paint discipline). ui_lang only; there is no doc content here. */

<script>/* First paint in the operator's theme: pin data-theme before any render so there is no flash. Per user: the stored choice is keyed to the signed-in uid, with a device-level fallback. No stored choice pins dark, preserving today's console (the CSS still supports system default when nothing is pinned). */
(function(){try{var d=document.documentElement,uid="";try{var s=JSON.parse(localStorage.getItem("console_sb_session")||"{}");uid=(s&&s.uid)||"";}catch(e){}var th="";try{th=localStorage.getItem("thrive_theme:"+uid)||localStorage.getItem("thrive_theme")||"";}catch(e){}d.setAttribute("data-theme",(th==="light"||th==="dark")?th:"dark");}catch(e){}})();</script>
<style>
  /* ============================================================================================
     BRAND FONTS (canon Law 6.1): one Latin face (Lato) and one Arabic face (Alyamama), self-hosted from
     the pinned public Supabase assets bucket by their exact ASSET_MANIFEST filenames (no new vendor, no
     inline base64, no guessed URL). font-display:swap paints in the fallback and swaps the brand file in.
     font-05..08 are the Alyamama weights (300/400/700/900) the published opp pages already reference; they
     ARE Alyamama, so they bind to the Alyamama family here. The previous non-canon Arabic face is retired.
     The type stack (--font / --font-ar below) lists Lato first then Alyamama, so Latin letters render in
     Lato and Arabic glyphs, which Lato does not carry, fall through to Alyamama, in both the English and the
     Arabic interface. Syne (display) has no pinned asset yet, so the display face falls back to Lato.
     ============================================================================================ */
  @font-face{font-family:Lato;font-style:normal;font-weight:400;font-display:swap;src:url(https://ssqhwdzgegzqcjfcclmr.supabase.co/storage/v1/object/public/assets/fonts/font-02-22937cf9.woff2) format("woff2")}
  @font-face{font-family:Lato;font-style:normal;font-weight:700;font-display:swap;src:url(https://ssqhwdzgegzqcjfcclmr.supabase.co/storage/v1/object/public/assets/fonts/font-03-151d08ee.woff2) format("woff2")}
  @font-face{font-family:Lato;font-style:normal;font-weight:900;font-display:swap;src:url(https://ssqhwdzgegzqcjfcclmr.supabase.co/storage/v1/object/public/assets/fonts/font-04-dd8e8c5a.woff2) format("woff2")}
  @font-face{font-family:Alyamama;font-style:normal;font-weight:300;font-display:swap;src:url(https://ssqhwdzgegzqcjfcclmr.supabase.co/storage/v1/object/public/assets/fonts/font-05-e36207c4.woff2) format("woff2")}
  @font-face{font-family:Alyamama;font-style:normal;font-weight:400;font-display:swap;src:url(https://ssqhwdzgegzqcjfcclmr.supabase.co/storage/v1/object/public/assets/fonts/font-06-58a22f0f.woff2) format("woff2")}
  @font-face{font-family:Alyamama;font-style:normal;font-weight:700;font-display:swap;src:url(https://ssqhwdzgegzqcjfcclmr.supabase.co/storage/v1/object/public/assets/fonts/font-07-ee5dbf54.woff2) format("woff2")}
  @font-face{font-family:Alyamama;font-style:normal;font-weight:900;font-display:swap;src:url(https://ssqhwdzgegzqcjfcclmr.supabase.co/storage/v1/object/public/assets/fonts/font-08-e35f45ee.woff2) format("woff2")}
  /* ============================================================================================
     DESIGN TOKENS (foundation). Additive and behavior-preserving: every DARK value below equals the
     literal it replaces, so the default (dark) console renders byte-identically. Light values are new
     and apply only when data-theme="light" is set (or, where no explicit choice is stored, the system
     prefers light and no data-theme pins it). Brand rules: no em dash anywhere; letter-spacing stays
     scoped to Latin classes; Arabic carries letter-spacing:normal; spacing is a multiple of 8.
     ============================================================================================ */
  /* ============================================================================================
     CANON DESIGN TOKENS. Ported from docs/IDENTITY.md, docs/MOTION.md and library/styles.css onto this
     standalone board. ONE token system: the canon names below are the source of truth; the legacy
     component-facing names this file already uses (--surface, --text, --border, --radius-*, --dur-*,
     --ease, --elev-*) are re-pointed onto the canon values, so every existing rule renders canon colours
     without a rewrite. Law 6.1 fonts (Lato + Alyamama), Law 4 colour (the gradient is the one primary
     action + the logo; the lane hues are the semantic scale), Law 5 radii, MOTION.md durations/easings.
     The dusty rose and the non-canon Arabic face are gone: they had no canon basis. ============================== */
  :root{
    color-scheme:dark;
    /* ---- Type (Law 6.1). One Latin face, one Arabic face; the stack resolves per character, so Latin
       letters find Lato and Arabic glyphs fall through to Alyamama, in BOTH interfaces. No system family
       sits between them (a system Arabic face would otherwise capture the glyph first). ---- */
    --font: Lato, "Alyamama", sans-serif;
    --font-ar: Lato, "Alyamama", sans-serif;
    --font-lat: var(--font);
    --font-display: var(--font);   /* Syne not pinned; Lato at its heaviest carries the display moment */
    --font-body: var(--font);      /* legacy alias */
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* Weights (Law 7.7): Alyamama reads heavier, so Arabic steps every display weight down one (RTL below). */
    --w-body: 400; --w-strong: 700; --w-head: 800; --w-max: 900;
    /* Type scale, fixed px (canon). Legacy --fs-* names alias onto it (they were unused clamps). */
    --fs-micro: 10.5px; --fs-xs: 11.5px; --fs-sm: 12.5px; --fs-base: 13.5px;
    --fs-md: 15px; --fs-lg: 17px; --fs-xl: 22px; --fs-2xl: 30px;
    --lh-tight: 1.25; --lh-base: 1.55; --lh-read: 1.85;
    --fs-hero: var(--fs-2xl); --fs-display: var(--fs-2xl); --fs-large: var(--fs-lg);
    --fs-medium: var(--fs-md); --fs-prose: var(--fs-base); --fs-small: var(--fs-sm);
    --track-tight: -0.01em; --track-caps: 0.08em;   /* Latin-only tracking; Arabic-safe variants scope it off */

    /* ---- Space: the canon 4px base scale. Legacy --space-* alias onto it (they were unused). ---- */
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 26px; --s-7: 34px; --s-8: 48px;
    --space-1: var(--s-2); --space-2: var(--s-4); --space-3: var(--s-5); --space-4: var(--s-6);
    --space-5: 40px; --space-6: var(--s-8); --space-8: 64px;

    /* ---- Radii: four canon values. Legacy --radius-* re-point onto them. ---- */
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 18px; --r-pill: 999px;
    --radius-s: var(--r-sm); --radius-m: var(--r-md); --radius-l: var(--r-lg); --radius-pill: var(--r-pill);

    /* ---- Elevation (objects only, never surfaces). Legacy --elev-* re-point onto them. ---- */
    --el-raised: 0 6px 18px rgba(0,0,0,.40); --el-modal: 0 0 60px rgba(0,0,0,.60);
    --el-accent: 0 8px 24px rgba(150,133,202,.28);
    --elev-1: 0 1px 2px rgba(0,0,0,.30); --elev-2: var(--el-raised); --elev-3: var(--el-modal);

    /* ---- Motion (MOTION.md): five durations, three easings. Legacy --dur-*/--ease re-point onto them. ---- */
    --t-instant: 90ms; --t-quick: 160ms; --t-base: 240ms; --t-slow: 320ms; --t-page: 420ms; --t-settle: 480ms;
    --e-standard: cubic-bezier(.2,.7,.2,1); --e-enter: cubic-bezier(.16,1,.3,1); --e-exit: cubic-bezier(.4,0,1,1);
    --ease: var(--e-standard); --dur-1: var(--t-base); --dur-2: var(--t-page); --dur-3: var(--t-settle);

    /* ---- Surfaces (Law 4.5, near-black). Legacy surface names re-point onto the canon panels. ---- */
    --bg: #0a0a0c; --panel: #111116; --panel-2: #16161d;
    --hair: rgba(255,255,255,.10); --hair-2: rgba(255,255,255,.06);
    --surface: var(--panel); --surface-raised: var(--panel-2); --surface-sunken: #0d0d11;
    --surface-inset: #0e0e12; --field-bg: #14141a;
    --page-canvas: #ffffff;   /* hosted-page preview surface: white in BOTH themes */

    /* ---- Ink (canon). Legacy --text-* re-point onto it. ---- */
    --ink: #ffffff; --ink-2: #d1d5db; --ink-3: #9ca3af; --ink-4: #6b7280;
    --text: var(--ink-2); --text-hi: #e8eaf0; --text-max: var(--ink);
    --text-muted: var(--ink-3); --text-muted-2: #b0b4bd; --text-dim: var(--ink-4); --text-faint: #565b66;

    /* ---- Borders: the 10 percent hairline (Law 5.1). Legacy --border-* re-point onto it. ---- */
    --border: var(--hair); --border-soft: var(--hair-2); --border-hair: var(--hair-2);
    --border-2: var(--hair); --border-3: var(--hair); --border-card: var(--hair);

    /* ---- Brand + the gradient (Law 4). The full gradient is the ONE primary action per surface + the
       logo, and nothing else. --on-brand is the warm near-black label the gradient carries; it clears AA
       (>=4.8:1) on the gradient's lightest-to-darkest sweep. ---- */
    --grad: linear-gradient(120deg,#72BECE,#5D7FB7,#9685CA,#EE8C9D,#A78CA7,#71BFCC);
    --brand-teal: #71BFCC; --purple: #9685CA; --pink: #EE8C9D; --teal: #71BFCC;
    --on-brand: #0e0b14; --focus: #9685CA;
    /* The primary action wears the gradient with the near-black label; the neutral secondary is a raised panel. */
    --btn-primary-bg: var(--grad); --btn-primary-fg: var(--on-brand);
    --btn-neutral-bg: #17171f; --btn-neutral-border: rgba(255,255,255,.14);

    /* ---- Lanes: colour as a scale, one hue per state of the journey (Law 4). Each carries a .12 tint. ---- */
    --lane-draft: #71BFCC; --lane-live: #7F9FD4; --lane-sent: #9685CA;
    --lane-opened: #EE8C9D; --lane-replied: #7EE0B8; --lane-closed: #6b7280;
    --lane-draft-t: rgba(113,191,204,.12); --lane-live-t: rgba(127,159,212,.12);
    --lane-sent-t: rgba(150,133,202,.12); --lane-opened-t: rgba(238,140,157,.12);
    --lane-replied-t: rgba(126,224,184,.12); --lane-closed-t: rgba(107,114,128,.12);
    --glow: #7EE0B8; --glow-1: rgba(126,224,184,.42); --glow-t: rgba(126,224,184,.10);

    /* ---- Semantic states (canon; separate from the lane scale). ---- */
    --success: #7EE0B8;   --success-bg: var(--lane-replied-t); --success-border: rgba(126,224,184,.34);
    --warning: #F6CF5B;   --warning-2: #F6CF5B;  --warning-bg: rgba(246,207,91,.11); --warning-border: rgba(246,207,91,.34);
    --error: #E0736F;     --error-2: #E0736F;    --error-bg: rgba(224,115,111,.16);  --error-border: rgba(224,115,111,.40);
    /* Info takes the Live-lane blue (informational, on the scale). Neutral chip stays a quiet panel tone. */
    --info: #7F9FD4;      --info-2: #9db6e6;     --info-bg: var(--lane-live-t);      --info-border: rgba(127,159,212,.34); --info-ink: #0a0f1a;
    --chip-bg: rgba(255,255,255,.05); --chip-fg: var(--ink-3); --chip-border: var(--hair);
    --hover-border: rgba(255,255,255,.22);

    /* ---- Overlay scrim (canon). ---- */
    --scrim: rgba(0,0,0,.58); --scrim-strong: rgba(0,0,0,.66);
  }

  /* ---- LIGHT theme color values (new; behavior unchanged until chosen) ---- */
  /* ---- LIGHT theme: derived from the canon surfaces and lane scale (the canon is dark-only, so light is
     re-derived for contrast, per IDENTITY section 11). The gradient and its near-black label are NOT
     overridden, so the primary action is identical and AA in both themes. Lane hues are darkened to hold
     AA as text on the light panels; their .12 tints inherit from :root and stay pale on white. ---- */
  :root[data-theme="light"]{
    color-scheme: light;
    --bg: #f7f7f8; --panel: #ffffff; --panel-2: #f4f5f7;
    --hair: rgba(0,0,0,.12); --hair-2: rgba(0,0,0,.07);
    --surface: var(--panel); --surface-raised: #ffffff; --surface-sunken: #f0f0f2;
    --surface-inset: #ffffff; --field-bg: #ffffff;
    --ink: #0d0d0d; --ink-2: #1a1a1a; --ink-3: #5a5a63; --ink-4: #8a8a93;
    --text: var(--ink-2); --text-hi: #0d0d0d; --text-max: #000000;
    --text-muted: var(--ink-3); --text-muted-2: #6a6a74; --text-dim: var(--ink-4); --text-faint: #9a9aa6;
    --border: var(--hair); --border-soft: var(--hair-2); --border-hair: var(--hair-2);
    --border-2: var(--hair); --border-3: var(--hair); --border-card: var(--hair);
    --brand-teal: #2e7480; --purple: #725bb8; --focus: #725bb8;
    --btn-neutral-bg: #f0f1f4; --btn-neutral-border: #d7d8de;
    /* lane text colours, darkened for AA on the light panels (hue preserved from the dark scale) */
    --lane-draft: #2e7480; --lane-live: #3e6bb7; --lane-sent: #725bb8;
    --lane-opened: #c0405a; --lane-replied: #1d7752; --lane-closed: #646a77;
    --success: #1d7752;   --success-bg: rgba(126,224,184,.16); --success-border: rgba(29,119,82,.34);
    --warning: #8a6a1f;   --warning-2: #8a6a1f;  --warning-bg: rgba(246,207,91,.20); --warning-border: rgba(138,106,31,.34);
    --error: #b3261e;     --error-2: #b3261e;    --error-bg: rgba(224,115,111,.14);  --error-border: rgba(179,38,30,.34);
    --info: #3e6bb7;      --info-2: #3e6bb7;     --info-bg: rgba(127,159,212,.16);   --info-border: rgba(62,107,183,.34); --info-ink: #ffffff;
    --chip-bg: rgba(0,0,0,.05); --chip-fg: #5a5a63; --chip-border: rgba(0,0,0,.12);
    --hover-border: rgba(0,0,0,.22);
    --scrim: rgba(20,20,28,.40); --scrim-strong: rgba(20,20,28,.50);
  }

  /* System default: follow prefers-color-scheme ONLY when no explicit theme is pinned. The boot script
     pins data-theme so today's dark console is preserved on deploy; this block is the wired hook that a
     one-line boot change activates once every surface is tokenized. */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]):not([data-theme="light"]){
      color-scheme: light;
      --bg: #f7f7f8; --panel: #ffffff; --panel-2: #f4f5f7; --hair: rgba(0,0,0,.12); --hair-2: rgba(0,0,0,.07);
      --surface: var(--panel); --surface-raised: #ffffff; --surface-sunken: #f0f0f2; --surface-inset: #ffffff; --field-bg: #ffffff;
      --ink: #0d0d0d; --ink-2: #1a1a1a; --ink-3: #5a5a63; --ink-4: #8a8a93;
      --text: var(--ink-2); --text-hi: #0d0d0d; --text-max: #000000;
      --text-muted: var(--ink-3); --text-muted-2: #6a6a74; --text-dim: var(--ink-4); --text-faint: #9a9aa6;
      --border: var(--hair); --border-soft: var(--hair-2); --border-hair: var(--hair-2); --border-2: var(--hair); --border-3: var(--hair); --border-card: var(--hair);
      --brand-teal: #2e7480; --purple: #725bb8; --focus: #725bb8;
      --btn-neutral-bg: #f0f1f4; --btn-neutral-border: #d7d8de;
      --lane-draft: #2e7480; --lane-live: #3e6bb7; --lane-sent: #725bb8; --lane-opened: #c0405a; --lane-replied: #1d7752; --lane-closed: #646a77;
      --success: #1d7752; --success-bg: rgba(126,224,184,.16); --success-border: rgba(29,119,82,.34);
      --warning: #8a6a1f; --warning-2: #8a6a1f; --warning-bg: rgba(246,207,91,.20); --warning-border: rgba(138,106,31,.34);
      --error: #b3261e; --error-2: #b3261e; --error-bg: rgba(224,115,111,.14); --error-border: rgba(179,38,30,.34);
      --info: #3e6bb7; --info-2: #3e6bb7; --info-bg: rgba(127,159,212,.16); --info-border: rgba(62,107,183,.34); --info-ink: #ffffff;
      --chip-bg: rgba(0,0,0,.05); --chip-fg: #5a5a63; --chip-border: rgba(0,0,0,.12); --hover-border: rgba(0,0,0,.22);
      --scrim: rgba(20,20,28,.40); --scrim-strong: rgba(20,20,28,.50);
    }
  }
  /* Both themes get a smooth surface/text transition, honoring reduced motion. */
  @media (prefers-reduced-motion: no-preference){
    html body{ transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease); }
  }

  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-text-size-adjust:100%}

  .wrap{max-width:1200px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-inline:calc(16px + env(safe-area-inset-left)) calc(16px + env(safe-area-inset-right))}
  .compose-send .act.send{min-height:44px}   /* comfortable touch target; the phone media query pins this bar to the bottom */
  /* The wordmark is the logo moment (Law 4.2): the full gradient, clipped to the text, on dark. On the light
     theme the gradient's pale stops would not hold on white, so the wordmark falls back to solid ink there. */
  /* HEADER IDENTITY (canon Law 4.2, the logo moment): a slowly rotating brand-gradient asterisk mark leads
     the wordmark THE CONSOLE / غرفة التحكم. The mark leads on the right in RTL (logical flex order). The
     wordmark wears the gradient on dark and solid ink on light where the gradient would pale. Display face is
     Lato heavy until Syne is pinned. */
  /* ONE top bar: the official Thrive logo (rotating slowly) + the wordmark, the account, the quota and the
     iconified nav on a single aligned row under one hairline. Equal padding on all four sides; canon spacing.

     container, one hairline), never a second slab. */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s-4);flex-wrap:nowrap;padding:var(--s-2) var(--s-1);border-bottom:1px solid var(--hair)}

  .brand-logo{display:block;width:28px;height:28px;object-fit:contain}
  @keyframes brandspin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .brand-mark{animation:none} }
  html.tab-hidden .brand-mark{animation-play-state:paused}
  .brand-word{font-weight:var(--w-max);letter-spacing:.06em;font-size:var(--fs-xl);line-height:1.15;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

  .topbar-end{display:flex;align-items:center;gap:var(--s-3);flex:1 1 auto;justify-content:flex-end;min-width:0;flex-wrap:wrap}
  .op-chip{font-size:var(--fs-sm);color:var(--text-muted);unicode-bidi:isolate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
  .build-mini{font-size:var(--fs-micro);color:var(--text-faint);font-family:var(--font-mono);unicode-bidi:isolate;flex:0 0 auto}
  .muted{color:var(--text-muted);font-size:12px}
  .send-cap{font-size:12px;color:var(--text-muted);unicode-bidi:isolate;margin-inline-start:auto}
  .send-cap.warn{color:var(--warning-2)}

  .row-actions{display:flex;gap:10px;align-items:center}
  .link{background:none;border:0;color:var(--brand-teal);font:inherit;cursor:pointer;padding:0;transition:color var(--dur-1) var(--ease)}
  .link-ic{display:inline-flex;align-items:center;gap:6px}   /* a link that keeps its word and gains a leading icon */
  .link:hover{text-decoration:underline;text-underline-offset:3px}
  .err{margin:10px 0;padding:10px 12px;border:1px solid var(--error-border);background:var(--error-bg);color:var(--error);border-radius:8px;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .signin{max-width:340px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--border-3);border-radius:14px;padding:26px 22px;text-align:center}
  .signin h1{font-size:18px;margin:0 0 6px}

  input:focus{border-color:var(--focus)}
  /* Visible keyboard focus on every interactive control (mouse clicks stay clean via :focus-visible). */
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible,.link:focus-visible,.ow-tab:focus-visible,.lv-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
  button.primary{width:100%;margin-top:10px;padding:11px 16px;border:0;border-radius:var(--r-md);font-weight:var(--w-max);font-size:14px;cursor:pointer;color:var(--btn-primary-fg);background:var(--btn-primary-bg);box-shadow:var(--el-accent);font-family:inherit;transition:filter var(--t-instant) var(--e-standard),box-shadow var(--t-instant) var(--e-standard)}
  button.primary:hover{filter:brightness(1.06)}
  button.primary:disabled{opacity:.6;cursor:default}

  if(!Array.isArray(v)) return [];
  var out=[];
  v.forEach(function(s){
    if(!s || typeof s!=="object") return;
    var text=String(s.text==null?"":s.text);
    if(!text.trim()) return;
    var id=String(s.id==null?"":s.id).trim() || ("sig-"+out.length+"-"+(String(text).length));
    var name=String(s.name==null?"":s.name).trim() || String(text).split("\n")[0].slice(0,40);
    out.push({ id:id, name:name, text:text });
  });
  return out.slice(0, 24);      // a sane cap; a person keeps a handful of signatures, not hundreds
}

// Load, once, at boot: the cross-operator name index, then the current operator's own profile (signature +
// title) and role. Fire-and-forget from loadBoard(); it NEVER gates the render. Bounded and best-effort at
// every step; the safe defaults in __identity stand if anything is missing.
function loadIdentity(){
  var uid = currentUid();
  __identity.uid = uid; __identity.email = authEmail();
  return identGet("console_profile_names?select=uid,display_name,email").then(function(rows){
    __profileIndex = { byUid:{}, byEmail:{} };
    (rows||[]).forEach(function(r){
      if(!r) return;
      var rec = { uid:r.uid||"", name:r.display_name||"", email:r.email||"" };
      if(rec.uid) __profileIndex.byUid[rec.uid] = rec;
      if(rec.email) __profileIndex.byEmail[String(rec.email).toLowerCase()] = rec;
    });
    var me = uid ? __profileIndex.byUid[uid] : null;
    if(me && me.name) __identity.name = me.name;
    // own profile row (RLS own-row). select=* so an unapplied signature_title column never 400s the read.
    return uid ? identGet("console_profiles?uid=eq."+enc(uid)+"&select=*&limit=1") : [];
  }).then(function(prows){
    var pr = (prows||[])[0];
    if(pr){
      if(!__identity.name) __identity.name = pr.display_name || "";
      __identity.signature = pickSignature(pr.prefs);
      var prefs = (pr.prefs && typeof pr.prefs==="object") ? pr.prefs : {};
      __identity.title = String(pr.signature_title || prefs.title || "");   // column authoritative once applied
      // G7.1: the full prefs is kept for read-modify-write (a signatures save must not clobber other prefs keys),
      // and the per-user saved signatures are surfaced for the editor's signature strip.
      __identity.prefs = prefs;
      __identity.signatures = normSignatures(prefs.signatures);
    }
    // role, from the DATABASE: own console_members row (owner|member), console_admins the legacy fallback.
    return uid ? identGet("console_members?id=eq."+enc(uid)+"&select=id,role&limit=1") : [];
  }).then(function(mrows){
    var m = (mrows||[])[0];
    if(m && m.role==="owner"){ __identity.role = "owner"; return finishIdentity(); }
    return (currentUid() ? identGet("console_admins?uid=eq."+enc(currentUid())+"&select=uid&limit=1") : Promise.resolve([]))
      .then(function(arows){ if((arows||[]).length) __identity.role = "owner"; return finishIdentity(); });
  }).catch(function(){ return finishIdentity(); });             // any failure: the safe defaults already stand
}
function finishIdentity(){
  __identity.loaded = true;
  // Surface for later steps (read-only). Non-secret: name/title/role/uid/email plus a hasSignature flag.
  try{ window.__thriveIdentity = { uid:__identity.uid, email:__identity.email, name:__identity.name,
        title:__identity.title, signature:__identity.signature, hasSignature:!!__identity.signature,
        signatures:normSignatures(__identity.signatures), role:__identity.role, loaded:true }; }catch(e){}
  // Step 2A: the profile index just settled (fire-and-forget from loadBoard, so it may finish AFTER a drawer
  // was opened). Re-paint the open drawer's notes ONCE so an actor uid that showed raw on first paint now
  // reads as the display name. One synchronous re-render, no polling, no await; guarded so it never throws.
  try{ if(typeof owDetailActive==="function" && owDetailActive(__owSlug) && typeof renderNotesInto==="function") renderNotesInto(__owSlug); }catch(e){}
  // Step 2D: the role just settled, so reveal (or keep hidden) the Admin header entry now that isOwner() is
  // authoritative. paintAdminSlot lives in bundle.js and is idempotent; guarded so it never throws here.
  try{ if(typeof window.__thrivePaintAdminSlot==="function") window.__thrivePaintAdminSlot(); }catch(e){}
  return __identity;
}

// Role is a DATABASE fact, surfaced here for later steps. THE RULE (stated in the PR): any future
// executive-only surface MUST gate on this DB-verified value (an RLS-protected read or a policy), never on

function currentRole(){ return __identity.role || "member"; }
function isOwner(){ return currentRole()==="owner"; }

try{ window.__thriveResolveActor = resolveActor; window.__thriveCurrentUid = currentUid; window.__thriveCurrentRole = currentRole; }catch(e){}

// The bounded own-row upsert. Body carries ONLY the key (uid) and display_name: signature_title and role are
// never named, so they are never written. Same settle-always discipline as oppPatch (authFetchOnce timeout
// REJECTS, one refresh-retry). uid = currentUid() equals (auth.uid())::text, satisfying the own-row policy.
function profileSaveName(name, retried){
  var uid = currentUid();
  var body = { uid: uid, display_name: String(name==null?"":name) };
  return authFetchOnce(URL_BASE + "/rest/v1/console_profiles", {
    method:"POST",
    headers:{ "apikey":ANON, "Authorization":"Bearer "+bearer(), "Content-Type":"application/json",
              "Prefer":"resolution=merge-duplicates,return=representation" },
    cache:"no-store", body: JSON.stringify(body)
  }).then(function(r){
    if((r.res.status===401 || r.res.status===403) && !retried && session() && session().refresh_token){
      return refresh().then(function(ok){ if(ok) return profileSaveName(name, true); var e=new Error("auth"); e.authRequired=true; throw e; });
    }
    if(!r.res.ok){ var e2=new Error((r.data && r.data.message) || ("HTTP "+r.res.status)); if(r.res.status===401||r.res.status===403) e2.authRequired=true; throw e2; }
    return (Array.isArray(r.data) ? r.data[0] : r.data) || body;
  });
}
// After a CONFIRMED save, reflect the new name in runtime + the resolver index so note metas show it at once
// (Step 2A actorName reads __profileIndex live), no reload. Called only on success, so no phantom save.
function applyNameLocally(name){
  var uid = currentUid();
  __identity.name = String(name==null?"":name);
  if(uid){ if(!__profileIndex.byUid[uid]) __profileIndex.byUid[uid] = { uid:uid, name:"", email:authEmail() }; __profileIndex.byUid[uid].name = __identity.name; }
  try{ if(window.__thriveIdentity) window.__thriveIdentity.name = __identity.name; }catch(e){}
  try{ if(typeof owDetailActive==="function" && owDetailActive(__owSlug) && typeof renderNotesInto==="function") renderNotesInto(__owSlug); }catch(e){}
}
// ===================================================================================================
// G7.1 PER-USER SIGNATURES. The saved signatures live in console_profiles.prefs.signatures (own row, jsonb).
// A write is a bounded read-modify-write: merge the new signatures array INTO the existing prefs object (kept
// on __identity from loadIdentity) and upsert the whole prefs column, so other prefs keys (title, sig_en/ar,
// signature) are preserved - PostgREST merge-duplicates updates only the columns in the payload, so display_name
// (written by profileSaveName) is never touched here either. Same settle-always + one refresh-retry discipline
// as profileSaveName; own-row policy (uid = (auth.uid())::text). Per-user by construction: every write keys on
// the current uid, and the strip reads __identity.signatures, so a second operator sees only their own set.
// ===================================================================================================
function profileSavePrefs(nextPrefs, retried){
  var uid = currentUid();
  var body = { uid: uid, prefs: (nextPrefs && typeof nextPrefs==="object") ? nextPrefs : {} };
  return authFetchOnce(URL_BASE + "/rest/v1/console_profiles", {
    method:"POST",
    headers:{ "apikey":ANON, "Authorization":"Bearer "+bearer(), "Content-Type":"application/json",
              "Prefer":"resolution=merge-duplicates,return=representation" },
    cache:"no-store", body: JSON.stringify(body)
  }).then(function(r){
    if((r.res.status===401 || r.res.status===403) && !retried && session() && session().refresh_token){
      return refresh().then(function(ok){ if(ok) return profileSavePrefs(nextPrefs, true); var e=new Error("auth"); e.authRequired=true; throw e; });
    }
    if(!r.res.ok){ var e2=new Error((r.data && r.data.message) || ("HTTP "+r.res.status)); if(r.res.status===401||r.res.status===403) e2.authRequired=true; throw e2; }
    var row = (Array.isArray(r.data) ? r.data[0] : r.data) || body;
    return (row && typeof row.prefs==="object") ? row.prefs : body.prefs;    // the server's authoritative prefs
  });
}
// Apply the confirmed prefs to runtime so the editor strip (and any reader) reflects the new set without a reload.
function applyPrefsLocally(prefs){
  prefs = (prefs && typeof prefs==="object") ? prefs : {};
  __identity.prefs = prefs;
  __identity.signatures = normSignatures(prefs.signatures);
  try{ if(window.__thriveIdentity) window.__thriveIdentity.signatures = normSignatures(prefs.signatures); }catch(e){}
}
// Add (or replace, by id) one saved signature; persist; reflect. Returns the confirmed list.
function saveSignatureEntry(entry){
  entry = entry || {};
  var cur = normSignatures(__identity.signatures);
  var next = cur.filter(function(s){ return s.id !== entry.id; });
  next.push({ id:entry.id, name:entry.name, text:entry.text });
  var base = (__identity.prefs && typeof __identity.prefs==="object") ? __identity.prefs : {};
  var nextPrefs = Object.assign({}, base, { signatures: normSignatures(next) });
  return profileSavePrefs(nextPrefs).then(function(saved){ applyPrefsLocally(saved); return normSignatures(saved.signatures); });
}
// Remove one saved signature by id; persist; reflect. Returns the confirmed list.
function removeSignatureEntry(id){
  var next = normSignatures(__identity.signatures).filter(function(s){ return s.id !== id; });
  var base = (__identity.prefs && typeof __identity.prefs==="object") ? __identity.prefs : {};
  var nextPrefs = Object.assign({}, base, { signatures: next });
  return profileSavePrefs(nextPrefs).then(function(saved){ applyPrefsLocally(saved); return normSignatures(saved.signatures); });
}
try{
  window.__thriveSignatures = function(){ return normSignatures(__identity.signatures); };   // the per-user saved set
  window.__thriveSaveSignature = function(entry){ return saveSignatureEntry(entry); };        // add/replace (await the confirm)
  window.__thriveRemoveSignature = function(id){ return removeSignatureEntry(id); };           // remove (await the confirm)
}catch(e){}
// Optimistic confirm-or-revert: the person controls their own display_name (any format, first-name-only or
// full). Nothing is applied until the server confirms; a failure shows red and leaves the runtime name as it
// was, never a phantom save. Reuses the shared __writing guard so a save never overlaps a send or note write.
function onSaveProfile(){
  var input = document.getElementById("pfName"); if(!input) return;
  var name = String(input.value||"").trim();
  if(__writing) return; __writing = true;
  pfSetStatus(t("pf_saving"), ""); var btn=document.getElementById("pfSave"); if(btn) btn.disabled=true;
  profileSaveName(name).then(function(row){
    __writing = false; if(btn) btn.disabled=false;
    applyNameLocally((row && row.display_name!=null) ? row.display_name : name);
    var i2=document.getElementById("pfName"); if(i2) i2.value = __identity.name;
    pfSetStatus(t("pf_saved"), "ok");
  }).catch(function(e){
    __writing = false; var b2=document.getElementById("pfSave"); if(b2) b2.disabled=false;
    pfSetStatus((e && e.authRequired) ? t("err") : t("pf_failed"), "bad");
  });
}

// Load the roster (owner only). Members come from ONE owner-gated server view, console_team_roster, which
// resolves each member's email from auth.users SERVER-SIDE (the client cannot read auth.users directly, so
// the old console_members.email mirror column was null and the email never reached the row). The view
// returns uid, email, display_name, role and enforces the owner scope itself via is_console_owner(); a

// on from console_profiles.signature_title exactly as before, keyed on uid; a member with no title, or a

    });
  }, function(){ /* roster read failed: leave the loading note, never crash */ });
}

// The title write: a PATCH (pure UPDATE) keyed on the TARGET member's uid, body ONLY { signature_title }.
// This triggers exactly console_profiles_owner_update (UPDATE) + guard_profile_title, which the server
// permits only for an owner and rejects for a member. Bounded (authFetchOnce timeout REJECTS), one
// refresh-retry, Prefer return=minimal (the owner may lack SELECT on another row, so success is the 2xx
// status, not a read-back). Never keyed on currentUid(); never carries display_name or role.
function titlePatch(targetUid, title, retried){
  var url = URL_BASE + "/rest/v1/console_profiles?uid=eq." + enc(targetUid);

    method:"PATCH",
    headers:{ "apikey":ANON, "Authorization":"Bearer "+bearer(), "Content-Type":"application/json", "Prefer":"return=minimal" },
    cache:"no-store", body: JSON.stringify({ signature_title: String(title==null?"":title) })
  }).then(function(r){
    if((r.res.status===401 || r.res.status===403) && !retried && session() && session().refresh_token){
      return refresh().then(function(ok){ if(ok) return titlePatch(targetUid, title, true); var e=new Error("auth"); e.authRequired=true; throw e; });
    }
    if(!r.res.ok){ var e2=new Error((r.data && r.data.message) || ("HTTP "+r.res.status)); if(r.res.status===401||r.res.status===403) e2.authRequired=true; throw e2; }
    return true;
  });

// Optimistic confirm-or-revert per member row: apply the typed title ONLY on a 2xx (the server policy +
// trigger accepted it), so a rejected write (a non-owner, or any failure) reverts red with no phantom save.
function onSaveTitle(targetUid, idx){

    setTitleStatus(idx, t("pf_saved"), "ok");
  }).catch(function(e){
    __writing = false; var b2=document.querySelector('.pf-title-save[data-i="'+idx+'"]'); if(b2) b2.disabled=false;
    setTitleStatus(idx, (e && e.authRequired) ? t("err") : t("pf_admin_failed"), "bad");   // rejected -> red, nothing applied
  });

// L5 SINGLE-RECIPIENT SEND - faithful clone of relaySend (app.js:7423) + compile (app.js:1438) for ONE

// app.js:6670 - stable per-intent idempotency key (also the open token, with an empty body). Two hash passes.
function sendIdem(opp, to, subject, body){
  var s = String(opp||"") + "" + String(to||"").trim().toLowerCase() + "" + String(subject||"") + "" + String(body||"");

// The merge-field tokens are built by concatenation so the shipped board.html carries no literal

var MF_BIZ = "{{" + "BIZ}}", MF_LINK = "{{" + "LINK}}", MF_MONTH = "{{" + "MONTH}}", MF_ASSET = "{{" + "ASSET_BASE}}";

// A page is not compiled through mergeFieldsInto (it is not per-recipient), but it still carries {{ASSET_BASE}}

function assetBaseInto(str){ return String(str==null?"":str).split(MF_ASSET).join(ASSET_BASE); }
function mergeFieldsInto(str, name, ctx){                                                    // app.js:1370

  if(name){ out = out.replace(/\{\{\s*NAME\s*\}\}/g, name); }
  else { out = out.replace(/\{\{\s*NAME\s*\}\}/g, "").replace(/[ \t]+([,،.:;!?])/g, "$1").replace(/[ \t]{2,}/g, " "); }
  out = out.split(MF_BIZ).join((ctx&&ctx.business)||"");
  out = out.split(MF_LINK).join((ctx&&ctx.link)||"");
  out = out.split(MF_MONTH).join((ctx&&ctx.month)||"");
  out = out.split(MF_ASSET).join(ASSET_BASE);   // {{ASSET_BASE}} -> the public assets bucket base, same compile step as {{LINK}}
  return out.replace(/<span data-m="[^"]*"[^>]*>([\s\S]*?)<\/span>/g, "$1");

function planAttachments(list){                                                              // app.js:1396
  var items = Array.isArray(list) ? list : [];
  var attach = [], hosted = [], refused = [], total = 0, count = 0;
  for(var i=0;i<items.length;i++){
    var a = items[i] || {};
    var size = Number(a.size) || 0;
    var url = String(a.url || "");
    var name = String(a.filename || a.name || "image");
    if(!url) continue;
    if(size > ATTACH_MAX_L5){ refused.push({ filename:name, size:size, reason:"file", limit:ATTACH_MAX_L5 }); continue; }
    if(count >= ATTACH_COUNT_MAX_L5){ refused.push({ filename:name, size:size, reason:"count", limit:ATTACH_COUNT_MAX_L5 }); continue; }
    if(size <= ATTACH_INLINE_MAX_L5 && total + size <= ATTACH_TOTAL_MAX_L5){
      attach.push({ filename:name, path:url, contentType:a.contentType || "", size:size }); total += size; count++;
    } else {
      hosted.push({ filename:name, url:url, size:size }); count++;
    }
  }
  return { attach:attach, hosted:hosted, refused:refused, totalBytes:total, count:count };
}

function toPlainText(html, sig){                                                             // app.js:6371
  var s = String(html||"");
  // Markdown link -> "text (url)" so an embedded link reads as the phrase plus its URL in the plain part
  // (mirrors the <a> downgrade below). A bare {{LINK}}-substituted URL carries no [text](...) and is untouched.
  s = s.replace(/\[([^\]\n]+)\]\(((?:https?:|mailto:)[^)\s]+)\)/g, function(_, txt, url){ txt = String(txt).trim(); return (txt && txt !== url) ? (txt + " (" + url + ")") : url; });
  s = s.replace(/<br\s*\/?>/gi, "\n")
       .replace(/<\/(p|div|li|h[1-6])>/gi, "\n")
       .replace(/<li[^>]*>/gi, "- ")
       .replace(/<a[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi, function(_, h, txt){ var tt = String(txt).replace(/<[^>]*>/g, "").trim(); return (tt && tt!==h) ? (tt + " (" + h + ")") : h; })
       .replace(/<[^>]*>/g, "");
  s = s.replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  s = s.replace(/\n{3,}/g, "\n\n").replace(/[ \t]+\n/g, "\n").trim();
  return sig ? (s + "\n\n" + sig) : s;
}
// LIGHT-HTML law of the new console: outreach sends light, clean HTML - not heavy branded HTML, not
// plain-only. Allowed: black body text in one system font, a smaller grey closing/signature and grey
// footer, real paragraph breaks, the plain opp link, and the one 1x1 open pixel. Forbidden: logo, tables,
// background colors, multi-color styling, any image other than the tracking pixel, inline-styled cards.

// The agency site, used ONLY by the "Use my signature" preset default (board-editor.src.js:65).
// PR-A: the message body is previewed and sent EXACTLY as written. Nothing detects or removes
// signature-like text from the body; the ONE signature is the separate data.sig field, appended by
// lightHtml / toPlainText below. The old stripBakedSig body-mutation (and its AGENCY_NAME_L5 anchor,
// whose only user it was) is removed; AGENCY_SITE_L5 stays because the editor preset still reads it.
var AGENCY_SITE_L5 = "thriveiii.com";

// Turn markdown links [text](url) into <a> anchors, run AFTER html-escaping so the anchor is the ONLY raw
// HTML in the paragraph (text and url arrive already entity-escaped). Only http(s)/mailto targets linkify, so
// an escaped scheme like javascript: is left as plain text. This is what lets "إدراج رابط الفرصة" embed the
// opp link on a chosen phrase instead of sending a naked URL; a body with no [text](url) is unchanged.
function mdLinksHtml(escaped){
  return String(escaped).replace(/\[([^\]\n]+)\]\(((?:https?:|mailto:)[^)\s]+)\)/g, function(_, txt, url){
    return '<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>';
  });
}
// Body paragraphs as light HTML: split on blank lines into <p>, single newlines become <br>. Black text,
// one system font, normal size. No wrapper card, no colors, no tables.
function bodyParasHtml(bodyPlain){
  var s = String(bodyPlain==null?"":bodyPlain).replace(/\r\n/g, "\n").replace(/^\n+|\n+$/g, "");
  if(!s) return "";
  return s.split(/\n{2,}/).map(function(b){
    b = b.replace(/^\n+|\n+$/g, "");
    return b ? '<p style="margin:0 0 14px 0">' + mdLinksHtml(esc(b)).split("\n").join("<br>") + '</p>' : "";
  }).filter(Boolean).join("");
}

// The one light-HTML document: body (black), then the identity signature in smaller grey, then the grey
// POSTAL/STOP footer. The open pixel is appended by the caller so it is the LAST and ONLY image.
function lightHtml(bodyPlain, sig, lang, bulk){
  var font = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif";
  // E0: the signature block is a clear grey (not the near-transparent #888888), small, its own block, its
  // multi-line value (name / title / site) rendered with real <br> line breaks, separated from the body by
  // space above. Empty sig renders nothing (fully optional). The grey POSTAL/STOP footer stays distinct below.
  var sigHtml = (sig && sig.trim())
    ? '<div style="margin-top:18px;font-size:13px;line-height:1.5;color:#595959">' + esc(String(sig)).split("\n").join("<br>") + '</div>'
    : "";
  // The POSTAL/STOP footer is a bulk (campaign) marker only; a personal 1:1 message omits it (bulk===false).
  return '<div style="font-family:' + font + ';font-size:15px;line-height:1.6;color:#111111">'
    + bodyParasHtml(bodyPlain) + sigHtml + '</div>' + (bulk ? footerHtml(lang) : "");
}

// compile(recipient, content) for ONE recipient. Content is the opp RECORD's prepared message
// (console_opps.data.outreach_subject / outreach_text / sig). LIGHT-HTML: the body is the operator's text
// VERBATIM (PR-A: no signature-like text is ever detected or removed from it). The ONE signature is the
// separate data.sig field, appended EXACTLY ONCE in smaller grey above the grey footer. The plain-text arm
// mirrors it (body + blank line + sig + footer). The tokenized opp-page link (channel 2) rides in both as a
// plain URL; the 1x1 open pixel (channel 1) is the ONLY image, appended last.
// SEND MODE (DELIVERABILITY_EVIDENCE): a 1:1 personal message must look personal, not bulk. The mode is
// data-driven so preview and send always agree: an uploaded-page opp (data.source==="upload",
// board-upload.src.js:309/:391) is a "campaign" and keeps the bulk shape (open pixel + STOP/postal footer +
// List-Unsubscribe); every other opp - the standalone New message, imports - is "personal" and drops all
// three. The multipart/alternative text part stays in both modes (it helps deliverability).
function sendMode(data){ return (data && data.source === "upload") ? "campaign" : "personal"; }

// ==== SMART NAME + GREETING (Phase 2) =========================================================================
// Infer a person name and a platform name from an email address, so the greeting can open with "Hi <Name>," or
// "Hi <Platform> team," even when nothing was typed. Pure functions - no I/O, no storage - reused by the compile
// (below) and by the compose UI's gentle prefill.
var ROLE_LOCALS = { hello:1, hi:1, hey:1, info:1, team:1, contact:1, contactus:1, sales:1, support:1, admin:1,
  office:1, hq:1, mail:1, email:1, press:1, media:1, marketing:1, events:1, event:1, bookings:1, booking:1,
  reservations:1, reservation:1, orders:1, order:1, help:1, service:1, services:1, enquiries:1, inquiries:1,
  enquiry:1, inquiry:1, general:1, welcome:1, noreply:1, "no-reply":1, newsletter:1, hola:1, salam:1, ceo:1,
  founders:1, founder:1, jobs:1, careers:1, billing:1, accounts:1, finance:1, pr:1, partnerships:1, hi5:1 };
function localPart(addr){ return String(addr||"").split("@")[0] || ""; }
function domainOf(addr){ return String(addr||"").split("@")[1] || ""; }
function titleCasePart(s){
  return String(s||"").split(/[.\-_+ ]+/).filter(Boolean)
    .map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }).join(" ");
}
// PERSON: a role/generic local-part (hello@, team@, info@) names no person -> "" (the platform greeting is used).
// A dotted/underscored handle (first.last) or a single plausible given-name token becomes a titled person name.
// A digit-only or opaque handle (a1b2, x7k9) yields nothing. Trailing digits are dropped (john2 -> John).
function smartPerson(addr){
  var lp = localPart(addr).toLowerCase().replace(/^["'\s]+|["'\s]+$/g, "").replace(/\+.*$/, "").replace(/\d+$/, "");
  if(!lp) return "";
  var flat = lp.replace(/[._\-]/g, "");
  if(ROLE_LOCALS[lp] || ROLE_LOCALS[flat]) return "";
  if(/[._\-]/.test(lp)){ var t = titleCasePart(lp); return /[a-z]/i.test(t) ? t : ""; }   // first.last -> First Last
  if(/^[a-z][a-z'’]{1,14}$/.test(lp)) return titleCasePart(lp);                             // a single given name
  return "";                                                                                // opaque handle -> no name
}
// PLATFORM: the domain's second-level label, title-cased (bardsalley.com -> Bards Alley). A freemail domain
// (gmail/outlook/...) names no platform -> "" (the business/page name is used instead upstream).
var FREEMAIL = { gmail:1, googlemail:1, yahoo:1, ymail:1, hotmail:1, outlook:1, live:1, msn:1, icloud:1, me:1,
  mac:1, aol:1, proton:1, protonmail:1, pm:1, gmx:1, zoho:1, mail:1, fastmail:1, hey:1, yandex:1, qq:1 };
function smartPlatform(addr){
  var host = domainOf(addr).toLowerCase().split(":")[0];
  var parts = host.split(".").filter(Boolean); if(!parts.length) return "";
  if(parts[0] === "www") parts.shift();
  var label = parts.length >= 2 ? parts[parts.length - 2] : parts[0];
  if(FREEMAIL[label]) return "";
  return titleCasePart(label);
}
// The {{NAME}} fill for a greeting: the person in name mode (when known), else the platform team, else "" (the
// empty-name cleanup in mergeFieldsInto tidies "Hi ," -> "Hi,"). AR wraps the platform as "فريق <platform>".
function greetFill(greetMode, person, platform, lang){
  if(greetMode === "name" && person) return person;
  if(platform) return (lang === "ar") ? ("فريق " + platform) : (platform + " team");
  return "";
}
// The greeting line prepended to a body that has no greeting of its own. Built through the SAME {{NAME}} slot so

function greetingLine(greetMode, person, platform, lang){
  var open = (lang === "ar") ? "مرحبا " : "Hi ";

  var fill = greetFill(greetMode, person, platform, lang);

}
// Does the body already open with its own salutation (so the compile must NOT prepend a second greeting)?
// Conservative: the first non-empty line starts with a known salutation word.
function hasSalutation(body){
  var line = (String(body||"").split("\n").map(function(s){ return s.trim(); }).filter(Boolean)[0] || "");
  return /^(hi|hello|hey|dear|greetings|good\s+(morning|afternoon|evening))\b/i.test(line)
      || /^(مرحبا|أهلا|أهلًا|عزيز|تحية|السلام)/.test(line);
}

function sendCompile(slug, row, data, rcpt, mode){
  data = data || {}; rcpt = rcpt || {};

  var bulk = (mode === "campaign");                 // personal omits pixel + footer; campaign keeps them

  var lead = (data.greetOn === true) ? (greetingLine("name", person, platform, lang) + "\n\n") : "";   // opt-in only

  var bodyPlain = inner + attachHostedBlockText(plan.hosted, lang);   // hosted-image links ride as text lines
  var token = recipientOpenToken(slug, addr, subject);       // == the console_mail row id; still the open-pixel token below
  // CLEAN LINK (LINK_OWNERSHIP_EVIDENCE A): the body carries the bare, working liveUrl(pageSlug) with NO ?r= tail.
  // The old channel-2 rewrite (bodyPlain.split(base).join(base+"?r="+token)) is REMOVED: a query on the no-trailing-
  // slash directory URL (/opp/<slug>) is the form that failed to resolve on GitHub Pages while the bare short form
  // works, and the string replace could malform a link that already had a trailing slash. Per-recipient EMAIL-open
  // attribution is unaffected: it rides on the separate campaign open pixel (channel 1, below), not the page link.
  var text = toPlainText(bodyPlain, sig) + (bulk ? footerText(lang) : "");   // plain-text alternative part; footer only for campaigns
  var html = lightHtml(bodyPlain, sig, lang, bulk);                          // light-HTML primary part; footer only for campaigns
  if(token && bulk) html = html + openPixelHtml(slug, token, relayEp());     // channel 1: the open pixel - campaign only (never on a personal 1:1)
  return { to:addr, name:person, subject:subject, html:html, text:text, token:token, lang:lang, mode:mode, attachments:plan.attach, pageSlug:pageSlug };
}

// ---- eligibility + recipient (the engine's own gate) ------------------------------------------------
function isEmail(a){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(a||"")); }
// A sighted recipient email on the opp RECORD: the engine derives recipients from data.recipients[] (app.js:1050,
// campaignRecipients). First valid email wins.
function firstRecipient(data){
  var rs = (data && Array.isArray(data.recipients)) ? data.recipients : [];
  for(var i=0;i<rs.length;i++){ var r = rs[i]||{}; var a = bareAddress(r.addr||""); if(isEmail(a)) return { addr:a.toLowerCase(), name:r.name||"", lang:r.lang||"" }; }
  return null;
}
// SEND-HEALTH: EVERY valid recipient on the record (not just the first). A group send emails one message per
// entry - runSend loops this, so a card with N recipients reaches all N, never silently just the first.
function allRecipients(data){
  var rs = (data && Array.isArray(data.recipients)) ? data.recipients : [];
  var out = [], seen = {};
  for(var i=0;i<rs.length;i++){
    var r = rs[i]||{}; var a = bareAddress(r.addr||"").toLowerCase();
    if(isEmail(a) && !seen[a]){ seen[a]=1; out.push({ addr:a, name:r.name||"", lang:r.lang||"" }); }   // dedupe, so one address is emailed once
  }
  return out;
}
// ---- B2 suppression guard: the do-not-contact set (console_suppressions) ----------------------------
// A lowercased email -> 1 map, loaded ONCE per board load and consulted by runSend (list filter) and sendOne
// (the real chokepoint), and by the upload strip (board-upload.src.js). Refreshed after each send batch so a
// STOP recorded mid-session (B4) is seen on the next send. No new client, no new key: the read uses the board's
// own bearer + apikey + one-refresh-retry discipline through authFetchOnce (NOT the best-effort restGet, which
// returns [] on BOTH a real error and an empty table and so cannot tell them apart).
//
// FAIL-CLOSED: this is the only suppression guard in the send path, so a send must NEVER proceed on a set that
// never loaded. A read that returns 200 (even an EMPTY list - nobody suppressed) is a valid load and does not
// block. Only a NEVER-loaded / failed state blocks: runSend halts the batch with a visible error, no sends, no
// relay calls (see ensureSuppress + the runSend seam). A cached SUCCESSFUL load stays valid - a later refresh
// that fails keeps the good set (it does not clear __suppressLoaded), so a transient blip after a good load
// never blocks. A persistent block is the B1 RLS note (grant the operator role read on console_suppressions).
var __suppress = null;          // the lowercased do-not-contact map; null until a load SUCCEEDS
var __suppressLoaded = false;   // true once a read has SUCCEEDED at least once; a cached good set stays valid
var __suppressInFlight = false; // a load is currently running (so ensureSuppress reuses it, never double-fetches)
var __suppressP = null;         // the current load promise
function loadSuppressions(retried){
  __suppressInFlight = true;
  var url = URL_BASE + "/rest/v1/console_suppressions?select=email";
  __suppressP = authFetchOnce(url, {
    method:"GET", headers:{ "apikey":ANON, "Authorization":"Bearer "+bearer() }, cache:"no-store"
  }).then(function(r){
    if((r.res.status===401 || r.res.status===403) && !retried && session() && session().refresh_token){
      return refresh().then(function(ok){ if(ok) return loadSuppressions(true); var e=new Error("auth"); e.authRequired=true; throw e; });
    }
    if(!r.res.ok){ throw new Error("HTTP "+r.res.status); }        // a real failure: do NOT mark loaded (fail-closed)
    var rows = Array.isArray(r.data) ? r.data : [];
    var m = {};
    rows.forEach(function(x){ var e = bareAddress((x && x.email) || "").toLowerCase(); if(e) m[e] = 1; });
    __suppress = m; __suppressLoaded = true; __suppressInFlight = false;   // a 200 read (even empty) is a valid set
    return m;
  }, function(e){ __suppressInFlight = false; throw e; });          // keep any prior good set; a never-loaded state stays unloaded
  return __suppressP;
}
// A cached SUCCESSFUL load short-circuits (stays valid); an in-flight load is reused; otherwise a load is
// (re)started. REJECTS when the set has never loaded and the load fails, so the runSend seam can block the batch.
function ensureSuppress(){
  if(__suppressLoaded) return Promise.resolve(__suppress);
  if(__suppressInFlight) return __suppressP;
  return loadSuppressions();
}
// True only when a set has never loaded successfully - the fail-closed block condition the send path checks.
function suppressUnavailable(){ return !__suppressLoaded; }
function isSuppressed(addr){ var e = bareAddress(String(addr||"")).toLowerCase(); return !!(e && __suppress && __suppress[e]); }
// SEND-HEALTH: the free-tier provider (Resend) caps 100/day and 1000/month. The counts are SERVER TRUTH from the
// console_mail ledger (one row per accepted send), so they never drift across devices or a reload.
var SEND_CAP_DAY = 100, SEND_CAP_MONTH = 1000;
var SEND_GAP_MS = 1100;   // space each relay call so a group send stays under the ~1 req/sec relay rate
// The relay send needs a REAL bound. The default authFetchOnce bound (FETCH_TIMEOUT_MS, 6s, board.html) cut off
// a send that the Apps Script relay legitimately completes slower (cold start + Resend + the 302 body hop), so a
// DELIVERED send rejected, reverted, and printed red. Resend shows every such send Delivered. 20s covers the
// slow tail; page_publish already uses a longer bound for the same reason (see relayPost). Normal sends finish
// in a second or two, so this only extends the wait on a genuinely slow call, turning a false failure into the
// true success the row records.
var RELAY_SEND_TIMEOUT_MS = 20000;
function startOfTodayISO(){ var d=new Date(); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())).toISOString(); }
function startOfMonthISO(){ var d=new Date(); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)).toISOString(); }
// Count accepted sends today / this month from console_mail (status=sent, ts within the window). Best-effort:
// a failed read falls back to a full budget so the counter never wrongly BLOCKS a legitimate send.
function sendBudget(){
  return Promise.all([
    restGet("console_mail?status=eq.sent&ts=gte." + enc(startOfTodayISO()) + "&select=id"),
    restGet("console_mail?status=eq.sent&ts=gte." + enc(startOfMonthISO()) + "&select=id")
  ]).then(function(a){
    var day = (a[0]||[]).length, month = (a[1]||[]).length;
    return { dayUsed:day, monthUsed:month, dayLeft:Math.max(0, SEND_CAP_DAY - day), monthLeft:Math.max(0, SEND_CAP_MONTH - month) };
  }, function(){ return { dayUsed:0, monthUsed:0, dayLeft:SEND_CAP_DAY, monthLeft:SEND_CAP_MONTH }; });
}
// The live header counter: "X / 100 today - Y / 1000 month", amber at 90% of either cap. Read-only.
function refreshSendCap(){
  var el = document.getElementById("sendCap"); if(!el) return;
  sendBudget().then(function(b){
    el.textContent = b.dayUsed + " / " + SEND_CAP_DAY + " " + t("cap_today") + " · " + b.monthUsed + " / " + SEND_CAP_MONTH + " " + t("cap_month");
    var warn = (b.dayUsed >= SEND_CAP_DAY * 0.9) || (b.monthUsed >= SEND_CAP_MONTH * 0.9);
    el.className = "send-cap" + (warn ? " warn" : "");
  }, function(){});
}
// The engine allows a send when the opp has a prepared outreach message (has_email = console_board view line 210,
// docs/supabase-board-view.sql) and is not a closed/archived card, and a relay endpoint is configured (relaySend
// refuses with no endpoint, app.js:7426). The sighted-recipient requirement is checked at send time from the record.
function sendEligible(row){
  if(!row) return false;
  if(row.archived) return false;
  if(TRAY_STAGES.indexOf((row&&row.stage)||"")>=0) return false;   // won / lost / dropped are terminal
  if(!relayEp()) return false;
  return !!row.has_email;
}

// ---- the console_mail confirm write (supaConfirmMail shape) -----------------------------------------
// POST /rest/v1/console_mail, Prefer resolution=merge-duplicates,return=minimal, columns per supaMailRow
// (app.js:3913) via the generic upsert (supabase.js:408). Bounded + one refresh-retry, through authFetchOnce.
function confirmMail(row, retried){
  var url = URL_BASE + "/rest/v1/console_mail";
  return authFetchOnce(url, {
    method:"POST",
    headers:{ "apikey":ANON, "Authorization":"Bearer " + bearer(), "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
    cache:"no-store", body: JSON.stringify([row])
  }).then(function(r){
    if((r.res.status===401 || r.res.status===403) && !retried && session() && session().refresh_token){
      return refresh().then(function(ok){ if(ok) return confirmMail(row, true); var e=new Error("auth"); e.authRequired=true; throw e; });
    }
    if(!r.res.ok){ var e2=new Error((r.data && r.data.message) || ("HTTP " + r.res.status)); if(r.res.status===401||r.res.status===403) e2.authRequired=true; throw e2; }
    return true;
  });
}
// The relay POST, faithful to app.js:7452: text/plain body, the app.js:7446 payload shape. The response body is
// read INSIDE authFetchOnce's timeout race (the fix), so it settles even on a wedged body stream.
function relayPost(payload, timeoutMs){
  return authFetchOnce(relayEp(), {
    method:"POST", headers:{ "Content-Type":"text/plain;charset=UTF-8" }, cache:"no-store", body: JSON.stringify(payload)
  }, timeoutMs);   // PR-L0: an optional longer bound for slow relay ops (page_publish commits to GitHub)
}

// ---- runSend: optimistic confirm-or-revert, faithful ordering (app.js:7440-7481) --------------------
// (a) optimistic UI first (card jumps to Sent, a 'sending' pill), (b) POST to the relay, (c) ONLY on Resend
// acceptance write the console_mail server row and re-read the board from server truth, (d) on relay error /
// Resend reject / aborted body-read, revert the card and show red - never a phantom Sent (mirrors the engine's
// unsent local-only path, app.js:7458/7460/7479). A post-acceptance confirm-write failure is the engine's
// 'sending' limbo (app.js:7473): the email went out, so it is NOT reverted to unsent; the board reflects server
// truth (no phantom) and an amber 'confirming' note shows.
// Compile + relay + confirm ONE recipient. Resolves { ok:true } on a relay-accepted send (a console_mail row is
// written, or, if only the confirm-write failed, the email still went out so it counts as sent), or { ok:false }
// with the address on a relay error / Resend reject / aborted body. NEVER throws - one bad recipient must not
// abort the batch. mode/compile/idempotency/Message-ID/token are all per-recipient (unique) already.
function sendOne(slug, row, data, rcpt, mode){
  var art = sendCompile(slug, row, data, rcpt, mode);
  // B2 chokepoint (belt and suspenders): refuse a suppressed address and NEVER call relayPost for it. runSend
  // already drops suppressed recipients before the cap, so in normal flow this never fires; it is the real
  // last-line guard for any path that reaches sendOne with a suppressed address. { skipped:true } tells the
  // batch loop to count it as skipped, never as sent and never as a failure.
  if(isSuppressed(art.to)) return Promise.resolve({ ok:false, addr:art.to, skipped:true });
  var idem = sendIdem(slug, art.to, art.subject, art.html);
  var msgid = newMessageId();
  var headers = Object.assign({}, outboundHeaders(slug, mode), { "Message-ID": msgid });
  var payload = { v:REQUIRED_RELAY_L5, from:FROM_EMAIL_L5, fromName:fromName(), to:art.to, subject:art.subject,
    html:art.html, text:art.text, idempotencyKey:idem, headers:headers, slug:slug };
  if(art.attachments && art.attachments.length) payload.attachments = art.attachments;
  return relayPost(payload, RELAY_SEND_TIMEOUT_MS).then(function(r){   // a real bound so a slow-but-delivered send is not cut off
    if(!r.res.ok) return { ok:false, addr:art.to };
    var d = r.data;
    if(d && d.ok===false) return { ok:false, addr:art.to };
    // TRANSIT CYCLE: stamp the send with the opp's CURRENT cycle (row.cycle from console_board, via BOARD_QUERY).
    // The view counts this send only while the opp still carries this cycle; a re-upload bumps the opp cycle and
    // this send drops out of the count. A legacy opp (no cycle) stamps null, which the view treats as today.
    // Phase 3: stamp the template/page this send used (page_slug column + a data.page_slug mirror) so "which
    // template went to whom" is one hop. The mirror keeps the Contacts/Template lens correct even on a build
    // deployed before the additive column lands; old rows (neither present) fall back to the opp->page_slug map.
    var mailRow = { id:art.token, opp:slug, status:"sent", to_addr:art.to, subject:art.subject, ts:isoNow(),
      actor:currentUid(), up:Date.now(), cycle:(row && row.cycle) || null, page_slug:art.pageSlug,
      data:{ mid:art.token, idem:idem, msgid:msgid, resend_id:(d && d.id) || "", provider:"endpoint", direction:"out", page_slug:art.pageSlug } };
    return confirmMail(mailRow).then(function(){ return { ok:true, addr:art.to }; },
                                     function(){ return { ok:true, addr:art.to, confirming:true }; });  // email out; the confirm-write is the 'sending' limbo, still a send
  }, function(err){
    // A TIMEOUT is not a failure. With the real bound above this is the rare >20s tail; Resend still shows the
    // send Delivered, so treat kind==="timeout" (board.html:480) as likely-delivered, mirroring the page-publish
    // precedent (board-upload.src.js). A row MUST exist or reloadBoardData reverts the card, so write a PENDING
    // console_mail row - the view's mail_sends counts '', sent, copied and pending - and return a non-failing
    // 'confirming' result, so the card stays in Sent with an amber note. A genuine non-delivery flips later via
    // the bounce webhook. Every OTHER rejection (network / aborted body) stays a real failure.
    if(!(err && err.kind === "timeout")) return { ok:false, addr:art.to };
    var pendRow = { id:art.token, opp:slug, status:"pending", to_addr:art.to, subject:art.subject, ts:isoNow(),
      actor:currentUid(), up:Date.now(), cycle:(row && row.cycle) || null, page_slug:art.pageSlug,
      data:{ mid:art.token, idem:idem, msgid:msgid, resend_id:"", provider:"endpoint", direction:"out", page_slug:art.pageSlug } };
    return confirmMail(pendRow).then(function(){ return { ok:true, addr:art.to, confirming:true }; },
                                     function(){ return { ok:true, addr:art.to, confirming:true }; });   // still a send; the pending row (or the webhook) reconciles it
  });
}
// runSend: REAL group send. Loops EVERY recipient (allRecipients), one throttled relay call each, settling per
// recipient so one failure never aborts the rest, and gated by the daily/monthly send cap (server truth from
// console_mail). A card with N recipients reaches all N (up to the remaining budget), never silently just the
// first. Single-recipient behaviour is preserved (one relay, one row, revert-on-failure, no phantom Sent).
function runSend(slug){
  if(__writing) return Promise.resolve(null); __writing = true;
  var row = findRow(slug);
  if(!row){ __writing = false; return Promise.resolve(null); }
  __act[slug] = { msg:t("s_sending"), cls:"" };
  owActsDisabled(true);
  var snap = null;
  return oppReadData(slug).then(function(data){
    var recips = allRecipients(data);
    if(!recips.length) { var e0=new Error("no recipient"); e0.__kind="norecip"; throw e0; }
    // NO MESSAGE, NO SEND: a card must carry a real message before it can send, or a campaign could ship a page
    // with an empty body. Require BOTH a subject AND a body (the same bar as the interactive compose gate
    // sendReady), so an empty-body card (e.g. a page committed with no message attached) can never send.
    if(!(data && String(data.outreach_text||"").trim() && String(data.outreach_subject||"").trim())){ var e1=new Error("no message"); e1.__kind="nomsg"; throw e1; }
    // E2 ConTh-3: an uploaded-page opp must be proven LIVE before ANY send (upSendLiveGate, unchanged). The gate
    // throws __kind="notlive"/"deadlink" so the catch reverts with a clear reason. Non-upload opps pass through.
    var __liveGate = (typeof upSendLiveGate==="function") ? upSendLiveGate(slug, data) : Promise.resolve();
    return __liveGate.then(function(){
      // B2 FAIL-CLOSED: the do-not-contact set MUST be loaded before any send. If it has never loaded
      // successfully, halt the batch here - no sends, no relay calls - with a visible error. A cached good set
      // (or a fresh successful load) passes; only a never-loaded / failed read blocks.
      return ensureSuppress().then(function(){
        if(suppressUnavailable()){ var eb=new Error("suppression unavailable"); eb.__kind="suppress_block"; throw eb; }
      }, function(){ var eb=new Error("suppression unavailable"); eb.__kind="suppress_block"; throw eb; });
    }).then(function(){
      return sendBudget();
    }).then(function(budget){
      // B2: drop any suppressed recipient BEFORE the room cap, and count them for a visible skipped line. The
      // relay is never called for a suppressed address (allowed excludes them, and sendOne guards again).
      var allowed = [], skipped = 0;
      for(var si=0; si<recips.length; si++){ if(isSuppressed(recips[si].addr)) skipped++; else allowed.push(recips[si]); }
      // CAP: the send never exceeds the remaining daily/monthly budget. If a group is larger than what fits, send
      // ONLY what fits and REPORT the rest as blocked by the cap - never silently drop them.
      var room = Math.max(0, Math.min(budget.dayLeft, budget.monthLeft));
      if(room <= 0){ var ec=new Error("cap"); ec.__kind="cap"; throw ec; }
      var toSend = allowed.slice(0, room), capped = allowed.length - toSend.length;
      var mode = sendMode(data);
      snap = JSON.parse(JSON.stringify(row));
      row.stage = "sent"; row.sent_count = Number(row.sent_count||0) + toSend.length; row.__sending = true;
      try{ renderBoard(__data); }catch(e){}
      var sent = [], failed = [];
      function one(i){
        if(i >= toSend.length) return Promise.resolve();
        return sendOne(slug, row, data, toSend[i], mode).then(function(res){
          if(res && res.skipped) skipped++;                              // B2 belt-and-suspenders: a suppressed address is skipped, never sent, never a failure
          else if(res && res.ok) sent.push(res.addr);
          else failed.push((res && res.addr) || toSend[i].addr);
          if(i + 1 < toSend.length) return upDelay(SEND_GAP_MS).then(function(){ return one(i + 1); });   // THROTTLE between recipients
          return one(i + 1);
        });
      }
      return one(0).then(function(){
        return reloadBoardData().then(function(){}, function(){}).then(function(){
          __writing = false;
          if(sent.length === 0 && snap){ replaceRow(slug, snap); try{ renderBoard(__data); }catch(x){} }   // nothing went out: revert (no phantom Sent)
          var view = sendResultView(sent.length, recips.length, failed, capped, skipped);   // ONE result string+class (green / amber / red), incl. suppressed skips
          __act[slug] = { msg:view.msg, cls:view.cls };
          refreshOppDetail(slug);
          try{ refreshSendCap(); }catch(e){}                                // the header counter reflects the new sends
          try{ loadSuppressions().catch(function(){}); }catch(e){}          // B2: refresh the do-not-contact set after the batch (a failed refresh keeps the cached good set)
          return view;                                                      // resolve so a caller (the New-message overlay) can SHOW the result
        });
      });
    });
  }).catch(function(e){
    __writing = false;
    if(snap){ replaceRow(slug, snap); try{ renderBoard(__data); }catch(x){} }   // revert the optimistic send (no phantom Sent)
    var kind = e && e.__kind;
    var msg = (kind==="norecip") ? t("s_no_recip") : (kind==="nomsg") ? t("s_no_msg")
      : (kind==="cap") ? t("s_cap")
      : (kind==="suppress_block") ? t("s_suppress_unavail")   // B2 fail-closed: the do-not-contact list never loaded; nothing was sent
      : (kind==="deadlink") ? t("s_dead_link")    // page activates on upload; the ONLY page block left is a definitively dead link (404/410)
      : (e && e.authRequired) ? t("err") : t("s_failed");
    __act[slug] = { msg:msg, cls:"bad" };
    if(owDetailActive(slug)) refreshOppDetail(slug); else { try{ redInto(root, "send", new Error(t("s_failed"))); }catch(x){} }
    return { msg:msg, cls:"bad", sent:0, failed:1, capped:0 };              // resolve (never reject) so the caller can render the reason
  });
}
// "Sent k of n." with Western numerals, isolated for RTL by the .act-status container.
function sendCountMsg(k, n){ return t("s_sent_n").replace("{k}", String(k)).replace("{n}", String(n)); }
// ONE result-tied view of a send: the same string and class everywhere. Full success is GREEN (ok); a partial
// (some sent, but >=1 failed or cap-blocked) is the AMBER WARNING (warn), never neutral grey; nothing sent is
// RED (bad). Returns { msg, cls, sent, failed, capped } so the overlay and the drawer render identically.
function sendResultView(sentN, total, failedAddrs, capped, skipped){
  failedAddrs = failedAddrs || []; capped = capped || 0; skipped = skipped || 0;
  var failedN = failedAddrs.length;
  if(!failedN && !capped && !skipped){
    return { msg:(sentN > 1 ? sendCountMsg(sentN, sentN) : t("s_sent")), cls:"ok", sent:sentN, failed:0, capped:0, skipped:0 };
  }
  var msg = sendCountMsg(sentN, total);
  if(failedN) msg += " " + t("s_failed_n").replace("{f}", String(failedN)) + " " + failedAddrs.join(", ");
  if(capped)  msg += " " + t("s_capped_n").replace("{c}", String(capped));
  if(skipped) msg += " " + t("s_skipped_n").replace("{s}", String(skipped));   // B2: suppressed contacts skipped, count shown beside capped
  return { msg:msg, cls:(sentN === 0 ? "bad" : "warn"), sent:sentN, failed:failedN, capped:capped, skipped:skipped };   // partial = amber warning, never neutral
}

// ===================================================================================================
// L5.5 RECIPIENT FIELD - put a recipient email on an opp so L5's Send gate can clear. Inlined verbatim into
// library/board.html by tools/bundle.js (interpolated as a string, so its regexes need no template escaping)
// and runs inside board.html's IIFE alongside the L5 send clone (board-send.src.js). It reuses that file's
// esc, t, bareAddress, isEmail, sendEligible, oppReadData, oppPatch, isoNow, reloadBoardData, refreshOppDetail, owDetailActive,
// __writing, __act, findRow, redInto, root.
//
// The write goes through the SAME column the engine's saveDraft({slug, recipients:list}) writes: recipients
// live inside console_opps.data (supaRowFromOpp puts them there, app.js:3882-3886), and the engine's roster
// editor persists them via saveDraft (app.js:2198). board.html writes the SAME data.recipients[] via its L4
// oppPatch (PATCH console_opps {data}), so the row the L5 gate reads (campaignRecipients / firstRecipient,
// app.js:1050) is byte-identical to an engine-written one. No new column, no new write path.
// ===================================================================================================

// The email the opp already knows, from its own R11 contact model. Mirrors contactChannels / primaryEmailChannel
// (app.js:12675-12684): channels[] (the source of truth) first, then the legacy channel.to / data.email mirror
// (seeded at intake.js:626/631). Returns "" when the opp carries no email anywhere - the field then starts empty.
function knownEmail(data){
  data = data || {};
  if(Array.isArray(data.channels)){
    var prim = data.channels.filter(function(c){ return c && c.primary && c.type==="email" && c.value; })[0];
    var any  = data.channels.filter(function(c){ return c && c.type==="email" && c.value; })[0];
    var pick = prim || any;
    if(pick) return bareAddress(pick.value);
  }
  var c = data.channel || {};
  if(c.kind==="email" && c.to) return bareAddress(c.to);
  if(data.email) return bareAddress(data.email);
  if(/@/.test(String(c.to||""))) return bareAddress(c.to);
  return "";
}
// The addresses already saved on the opp (data.recipients[]), the exact field the L5 gate reads.
function recipientAddrs(data){
  var rs = (data && Array.isArray(data.recipients)) ? data.recipients : [];
  return rs.map(function(r){ return bareAddress((r && r.addr) || ""); }).filter(Boolean);
}

// Write data.recipients[] via the board's bounded oppPatch (same column as the engine's saveDraft), then read
// back to confirm it persisted. Each address becomes {addr,name,lang} - the exact shape campaignRecipients /
// firstRecipient reads (app.js:1050). Settles either way (authFetchOnce race); no storage touched.
function saveRecipients(slug, list){
  return oppReadData(slug).then(function(data){
    var next = Object.assign({}, data, { recipients: list });
    return oppPatch(slug, { data: next, up: Date.now() }).then(function(){
      return oppReadData(slug).then(function(d2){                       // read-back confirm
        var got = (d2 && Array.isArray(d2.recipients)) ? d2.recipients : [];

// saved recipient on its next tap with no manual reload, and any stale L5 "no recipient" red is cleared.
function onSaveRecipient(slug){
  var input = document.getElementById("recIn"); if(!input) return;

  var list = addrs.map(function(a){ return { addr:a, name:"", lang:"" }; });

    __writing = false;

    var b3=document.getElementById("recSave"); if(b3) b3.disabled=false;

// ONE tooltip component, wired once on the document (idempotent). Hover + keyboard focus reveal on desktop;
// a touch tap/long-press reveals it briefly without swallowing the tap, because hover never fires on iPad.
function tipWire(){
  if (window.__thriveTipWired) return; window.__thriveTipWired = true;
  var tip = document.getElementById("thriveTip");
  if (!tip){ tip = document.createElement("div"); tip.id = "thriveTip"; tip.className = "thrive-tip"; tip.setAttribute("role","tooltip"); tip.hidden = true; document.body.appendChild(tip); }
  var hideT = null;
  function tgt(e){ return (e.target && e.target.closest) ? e.target.closest("[data-tip]") : null; }
  function show(el){
    var label = el.getAttribute("data-tip") || el.getAttribute("aria-label") || ""; if (!label) return;
    if (hideT){ clearTimeout(hideT); hideT = null; }
    tip.textContent = label; tip.dir = document.documentElement.getAttribute("dir") || "ltr"; tip.hidden = false;
    var r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = Math.max(8, Math.min(r.left + r.width/2 - tw/2, window.innerWidth - tw - 8));
    var top = (r.bottom + 8 + th > window.innerHeight - 8) ? (r.top - th - 8) : (r.bottom + 8);
    tip.style.left = left + "px"; tip.style.top = Math.max(8, top) + "px"; tip.classList.add("on");
  }
  function hide(){ tip.classList.remove("on"); if (hideT) clearTimeout(hideT); hideT = setTimeout(function(){ tip.hidden = true; }, 180); }
  document.addEventListener("pointerover", function(e){ if (e.pointerType === "touch") return; var el = tgt(e); if (el) show(el); }, true);
  document.addEventListener("pointerout",  function(e){ if (e.pointerType === "touch") return; var el = tgt(e); if (el) hide(); }, true);
  document.addEventListener("focusin",  function(e){ var el = tgt(e); if (el) show(el); });
  document.addEventListener("focusout", function(e){ var el = tgt(e); if (el) hide(); });
  document.addEventListener("pointerdown", function(e){ if (e.pointerType !== "touch") return; var el = tgt(e); if (el){ show(el); if (hideT) clearTimeout(hideT); hideT = setTimeout(function(){ tip.classList.remove("on"); tip.hidden = true; }, 1600); } }, true);
}

function edEl(id){ try{ var r=edRoot(); return r ? r.querySelector("#"+id) : null; }catch(e){ return document.getElementById(id); } }
function edVal(id){ var el=edEl(id); return el ? String(el.value||"") : ""; }
// PR-A0: the page a card points at is data.page_slug when set (a promoted card shares the template page), else

// Build the data jsonb the preview/send compiles from: the captured base overlaid with the LIVE subject,
// body, and the operator's signature FIELD value (empty allowed). edCompileFrom then runs the SAME sendCompile

function edLiveData(slug){
  var base = __edBase[slug] || {};

  // field applied), and carries the live platform + greeting mode, so the greeting toggle and the smart-name
  // fields change the preview at once, per the first recipient.
  var recips = (typeof sendToList==="function") ? sendToList() : [];

    outreach_subject:edVal("edSubj"), outreach_text:edVal("edBody"), sig:edSignature(),
    greetOn:edGreetOn(slug),                                        // OPTIONAL greeting: applied only when the suggestion is checked

// ---- Optional greeting state (in-memory on __edBase for a live preview; persisted by the compose writer). It is
//      a single opt-in: OFF by default, applied only when the operator checks the suggestion chip. ----
function edGreetOn(slug){ var d=__edBase[slug]||{}; return d.greetOn === true; }

// The greeting line the suggestion would prepend, for the FIRST live recipient, in the operator's UI language.

function greetSuggestText(slug, data){

// Re-mark the four check items from the LIVE values (no value reset, so undo is untouched). Recipient is not

// Grey the Send button while the MESSAGE is incomplete (subject/body/link). Recipient stays enforced by

// subject AND body AND a valid recipient), so the drawer's board Send and the overlay's Send obey the same
// rule. The link stays optional; the gate is never keyed on the stored has_email flag.
function edApplyGate(slug){ if(typeof sendApplyGate==="function") sendApplyGate(slug); }
// Recompile the preview from the LIVE values, through the send path's own sendCompile, and show it. The
// srcdoc html is byte-identical to what runSend would POST for the same record (proven by edCompileFrom

function edRenderPreview(slug){
