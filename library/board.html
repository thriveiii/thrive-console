      ? fetch(URL_BASE+"/auth/v1/logout", { method:"POST", headers:{ "apikey":ANON, "Authorization":"Bearer "+s.access_token }, cache:"no-store" }).then(function(){}, function(){})
      : Promise.resolve();
    return p.then(function(){ setSession(null); });
  }

  // One REST GET of console_board with bearer() + apikey; one refresh-and-retry on 401/403 (rest() discipline).
  function fetchBoard(retried){
    return fetch(URL_BASE + "/rest/v1/console_board?" + QUERY, {
      method:"GET", headers:{ "apikey": ANON, "Authorization": "Bearer " + bearer() }, cache:"no-store"
    }).then(function(res){
      if((res.status===401 || res.status===403) && !retried && session() && session().refresh_token){
        return refresh().then(function(ok){ if(ok) return fetchBoard(true); var e=new Error("auth"); e.authRequired=true; throw e; });
      }
      return res.text().then(function(tx){
        var d=null; try{ d = tx ? JSON.parse(tx) : null; }catch(e){}
        if(!res.ok){ var e2=new Error((d && d.message) || ("HTTP "+res.status)); if(res.status===401||res.status===403) e2.authRequired=true; throw e2; }
        return Array.isArray(d) ? d : [];
      });
    });
  }

  // L2 reply detail comes from console_inbound (the reply resolver read path: repliesForOpp / replyCountFor).
  // The board STAGE still comes only from console_board; this read adds reply COUNTS, never a stage. Best-effort:
  // if it fails the board still renders and replies just do not show. Bearer + apikey, read-only.
  function fetchInbound(){
    return fetch(URL_BASE + "/rest/v1/console_inbound?select=id,opp,kind,bounce,ts,data&order=ts.asc", {
      method:"GET", headers:{ "apikey": ANON, "Authorization": "Bearer " + bearer() }, cache:"no-store"
    }).then(function(res){
      if(!res.ok) return [];
      return res.text().then(function(tx){ var d=null; try{ d=tx?JSON.parse(tx):null; }catch(e){} return Array.isArray(d)?d:[]; });
    }, function(){ return []; });
  }
  // L3 detail reads (best-effort, scoped to ONE opp, ONLY on drawer open): the opportunity RECORD (console_opps,
  // for its carried notes - there is NO server-side accrued-memory store), its SENDS (console_mail) and OPENS
  // (console_hits) for the activity timeline and the Thrive->prospect side of the thread. Any failure degrades to
  // empty; the drawer's heart (the reply thread + the counts) already comes from the in-memory board row and the
  // ONE reply resolver, so it never depends on these. Bearer + apikey, read-only. PRIVACY: prospect addresses/
  // names/reply text are read LIVE here and only displayed - never written to storage, a log, or any artifact.
  function enc(s){ return encodeURIComponent(String(s==null?"":s)); }
  function restGet(path){
    return fetch(URL_BASE + "/rest/v1/" + path, {
      method:"GET", headers:{ "apikey": ANON, "Authorization": "Bearer " + bearer() }, cache:"no-store"
    }).then(function(res){ if(!res.ok) return []; return res.text().then(function(tx){ var d=null; try{ d=tx?JSON.parse(tx):null; }catch(e){} return Array.isArray(d)?d:[]; }); }, function(){ return []; });
  }
  function fetchDetail(slug){
    return Promise.all([
      restGet("console_opps?slug=eq."+enc(slug)+"&select=slug,data&limit=1"),
      restGet("console_mail?opp=eq."+enc(slug)+"&select=id,opp,ts,data&order=ts.asc"),
      restGet("console_hits?slug=eq."+enc(slug)+"&select=id,slug,ts,data&order=ts.asc")
    ]).then(function(a){ return { opp:(a[0]||[])[0]||null, mail:a[1]||[], hits:a[2]||[] }; }, function(){ return { opp:null, mail:[], hits:[] }; });
  }
  function normFrom(s){ return String(s==null?"":s).trim().toLowerCase(); }
  // One resolver, linked-everywhere-or-nowhere (§3): a reply belongs to a card ONLY by its stored resolved opp
  // (the server attributed it on write); auto-replies and bounces move no card; dedup by sender keeping the
  // earliest, sort, number 1..N. An unattributed human reply is inbox backlog (feeds the inbound-health pill).
  function buildReplies(inbound){
    var byOpp={}, waiting=0;
    (Array.isArray(inbound)?inbound:[]).forEach(function(r){ try{
      r=r||{}; var data=r.data||{};
      if(r.kind==="auto" || r.bounce) return;
      var opp=r.opp||"";
      if(!opp){ waiting++; return; }
      var from=normFrom(data.from||r.from), ts=String(r.ts||data.ts||"");
      var g=byOpp[opp]||(byOpp[opp]={});
      var key=from||("_"+ts);
      // Keep a snippet for the L3 drawer thread (never changes the count/numbering; still one resolver).
      if(!g[key] || ts < g[key].ts) g[key]={ from:from, ts:ts, subject:(data.subject||""), snippet:(data.snippet||data.body||data.text||"") };
    }catch(e){} });
    var count={}, list={};
    Object.keys(byOpp).forEach(function(slug){
      var items=Object.keys(byOpp[slug]).map(function(k){ return byOpp[slug][k]; }).sort(function(a,b){ return a.ts<b.ts?-1:(a.ts>b.ts?1:0); });
      items.forEach(function(it,i){ it.num=i+1; });
      count[slug]=items.length; list[slug]=items;
    });
    return { count:count, list:list, waiting:waiting };
  }
  // new-activity (paintCardBadges spirit): per-card last-seen last_activity_ts, device-local. A card is "new"

  function readSeen(){ try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}")||{}; }catch(e){ return {}; } }
  function writeSeen(m){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify(m||{})); }catch(e){} }
  function countUpAll(){
    try{
      var els=root.querySelectorAll("[data-countup]");
      [].forEach.call(els, function(el){
        var to=Number(el.getAttribute("data-countup"))||0, dur=520, t0=null;
        if(to<=0){ el.textContent="0"; return; }
        function step(ts){ if(t0===null) t0=ts; var p=Math.min(1,(ts-t0)/dur); el.textContent=String(Math.round(p*to)); if(p<1) requestAnimationFrame(step); else el.textContent=String(to); }
        requestAnimationFrame(step);
      });
    }catch(e){}
  }

  // Bucket by the SERVER stage only (never derived here). Domain law: a REPLIED opp is a terminal-success story
  // and stays in Replied even once archived - archiving is end-of-conversation, NOT exclusion, so it must never
  // subtract from the replied stage count. Every OTHER archived opp (and won/lost/dropped) belongs to the tray;
  // the archived tray is rebuilt separately below from the archived flag, so a replied+archived opp shows in BOTH
  // its Replied lane and the closed shelf. "other" must end empty.
  function laneOf(row){
    var st=(row && row.stage) || "";
    if(st==="replied") return "replied";
    if(row && row.archived) return "tray";
    if(BOARD_LANES.indexOf(st)>=0) return st;
    if(TRAY_STAGES.indexOf(st)>=0) return "tray";
    return "other";
  }
  // A card. The NAME (business) is shown in BOTH languages, never the slug (the slug is only a last resort when
  // an opp has no business at all). Counts/opens/idle and the reply N-badge come from the server; no stage math.
  function cardHtml(row){

    var isNew = (__seen && (slug in __seen)) && (String(row.last_activity_ts||"") > String(__seen[slug]||""));
    var rc = (__reps && __reps.count && __reps.count[slug]) || 0;
    var bits = [];

    if(oc) bits.push(oc + " " + t(oc===1 ? "b_open" : "b_opens"));

    var dot = isNew ? '<span class="newdot" aria-hidden="true"></span>' : '';
    var reps = "";
    if(rc && __reps.list && __reps.list[slug]){
      // reply grouping (replyGroupHtml spirit): numbered repliers 1..N, the same count as the N-badge.
      reps = '<div class="reps">' + __reps.list[slug].map(function(it){
        return '<div class="rep"><span class="repn">' + it.num + '</span> ' + esc(it.from || t("unnamed")) + '</div>';
      }).join("") + '</div>';

    return '<div class="card" data-slug="' + esc(slug) + '" role="button" tabindex="0">' + dot +

  // ---- L3 opportunity detail drawer (read-only): open and view; no edit/send/archive. Cloned from the engine

  function fmtWhen(ts){ ts=String(ts||""); if(!ts) return ""; return ts.replace("T"," ").replace(/\.\d+.*$/,"").replace(/Z$/,"").trim(); }

  function factsHtml(row){

  // The reply thread is the HEART. Inbound replies come from the ONE resolver (__reps.list[slug]) - the SAME list
  // and numbering as the card badge and the header count (§3 linked-everywhere-or-nowhere). The Thrive->prospect
  // outbound sends (context) come from the best-effort console_mail read; they never change the reply count.
  function threadHtml(slug, detail){
    var list = (__reps.list && __reps.list[slug]) ? __reps.list[slug] : [];
    var rc = (__reps.count && __reps.count[slug]) || 0;
    var items = [];
    if(detail && detail.mail) detail.mail.forEach(function(m){ m=m||{}; var d=m.data||{}; items.push({ dir:"out", ts:String(m.ts||d.ts||""), subject:(d.subject||m.subject||""), who:t("d_you") }); });
    list.forEach(function(it){ items.push({ dir:"in", ts:String(it.ts||""), num:it.num, from:it.from, subject:it.subject, snip:it.snippet }); });
    items.sort(function(a,b){ return a.ts<b.ts?-1:(a.ts>b.ts?1:0); });
    var bubbles = items.map(function(m){
      if(m.dir==="in"){

          (m.subject?'<div class="msubj">'+esc(m.subject)+'</div>':'')+

  // Activity timeline: sends (console_mail) + opens (console_hits) + replies (the ONE resolver), newest first.

  function renderBoard(data){
    data = data || {}; __data = data; VIEW="board"; applyLang();
    var rows = Array.isArray(data.rows) ? data.rows : [];
    var groups = {}; BOARD_LANES.concat(["tray","other"]).forEach(function(l){ groups[l]=[]; });
    rows.forEach(function(r){ try{ groups[laneOf(r)].push(r); }catch(e){} });
    // ONE bucketer, ONE count (no second count path): the verdict hero, the pipeline strip, and every lane header
    // all read the SAME laneOf() grouping via laneN(). A replied+archived opp counts as Replied here precisely
    // because laneOf() keeps it in "replied"; the old cnt() scan (which subtracted archived) is gone.
    function laneN(l){ return (groups[l]||[]).length; }

    // Verdict hero (count-up) + the five-stage pipeline strip.
    var draft=laneN("draft"), live=laneN("live"), sent=laneN("sent"), opened=laneN("opened"), replied=laneN("replied");
    var awaiting=sent+opened, heroN, heroK;
    if(replied>0){ heroN=replied; heroK="v_replied"; }
    else if(awaiting>0){ heroN=awaiting; heroK="v_awaiting"; }
    else if(live>0){ heroN=live; heroK="v_ready"; }
    else { heroN=draft; heroK="v_draft"; }
    var verdict = '<div class="verdict"><span class="vnum" data-countup="' + heroN + '">0</span><span class="vlabel">' + esc(t(heroK)) + '</span></div>';
    var pipe = '<div class="pipe">' + ["draft","live","sent","opened","replied"].map(function(st){
      return '<span class="pchip"><span class="pn" data-countup="' + laneN(st) + '">0</span> ' + esc(t("l_"+st)) + '</span>';
    }).join("") + '</div>';

    // Chips (display only in L2): stalled sent/opened cards, and archived count.
    var stalled=0, archived=0;
    rows.forEach(function(r){ if(r && r.archived) archived++; else if((r.stage==="sent"||r.stage==="opened") && Number(r.idle_days||0)>7) stalled++; });
    var chips=""; if(stalled) chips+='<span class="chip">'+stalled+' '+esc(t("c_stalled"))+'</span>';
    if(archived) chips+='<span class="chip">'+archived+' '+esc(t("c_archived"))+'</span>';
    var chipsHtml = chips ? ('<div class="chips">'+chips+'</div>') : "";

    // Pills: a truthful live-freshness pill, and the inbound-health pill (replies waiting to be filed) from the
    // console_inbound read. The engine's drift/sync pills are intentionally NOT carried: the direct reader has
    // no local ledger to drift from and no relay to be stale against, so there is nothing truthful to show.
    var pills = '<span class="pill live">'+esc(t("p_live"))+'</span>';
    var waiting = (__reps && __reps.waiting) || 0;
    if(waiting) pills += '<span class="pill warn">'+waiting+' '+esc(t("p_waiting"))+'</span>';
    var pillsHtml = '<div class="pills">'+pills+'</div>';

    // Lanes: the five open lanes always; bounced/failed only when non-empty; "other" only if (unexpectedly) used.
    var order = ["draft","live","sent","opened","replied"];
    if((groups.bounced||[]).length) order.push("bounced");

      var list = groups[l] || [];
      return '<div class="lane"><h2>' + esc(t("l_"+l)) + '<span class="n">' + list.length + '</span></h2>' +
             (list.length ? list.map(cardHtml).join("") : '<div class="empty">' + esc(t("none")) + '</div>') + '</div>';
    }).join("") + '</div>';

    // Closed/archived tray: the archived shelf lists EVERY archived opp plus won/lost/dropped, independent of the
    // stage lane it also appears in - a replied+archived opp shows in Replied AND here, because archiving is a
    // shelf, not an exclusion (and never subtracts from its stage count). Collapsible; per-card reopen is later.
    var tray = rows.filter(function(r){ return r && (r.archived || TRAY_STAGES.indexOf((r && r.stage) || "")>=0); });
    var trayHtml = '<section class="tray"><button class="tray-toggle link" id="trayToggle" type="button" aria-expanded="false">' +
      esc(t("tray")) + ' <span class="n">' + tray.length + '</span></button>' +
      '<div class="tray-body" id="trayBody" hidden>' + (tray.length ? tray.map(cardHtml).join("") : '<div class="empty">'+esc(t("none"))+'</div>') + '</div></section>';

    root.innerHTML = headerHtml() + verdict + pipe + pillsHtml + chipsHtml +
      '<div class="muted" style="padding:2px">' + rows.length + ' ' + esc(t("opps")) + '</div>' +
      lanesHtml + trayHtml;
    wireHeader();
    var tt=document.getElementById("trayToggle"), tb=document.getElementById("trayBody");
    if(tt && tb) tt.addEventListener("click", function(){ var open=tb.hidden; tb.hidden=!open; tt.setAttribute("aria-expanded", String(open)); });
    // L3: tap any card (open lane OR tray) to open its read-only detail drawer.
    [].forEach.call(root.querySelectorAll(".card[data-slug]"), function(c){
      var slug=c.getAttribute("data-slug");
      c.addEventListener("click", function(){ openDrawer(slug); });
      c.addEventListener("keydown", function(e){ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); openDrawer(slug); } });
    });
    countUpAll();
  }

  function loadBoard(){
    VIEW="board"; applyLang();
    root.innerHTML = headerHtml() + '<div class="muted" style="padding:10px 2px">' + esc(t("loading")) + '</div>';
    wireHeader();
    fetchBoard(false).then(function(rows){
      return fetchInbound().then(function(inbound){
        rows = Array.isArray(rows) ? rows : [];
        __seen = readSeen();
        __reps = buildReplies(inbound);
        try{ renderBoard({ rows: rows }); }catch(e){ redFull("render", e); }
        // update last-seen to current activity, so the NEXT load flags what changed since now
        var next={}; rows.forEach(function(r){ if(r && r.slug) next[r.slug]=String(r.last_activity_ts||""); });
        writeSeen(next);
      });
    }).catch(function(e){ if(e && e.authRequired){ signinView(); } else { redFull("board fetch", e); } });
  }

  // Warm boot: adopt a surviving mirrored session into memory (session() does it) and go STRAIGHT to the board,
  // no re-sign-in; an expired token gets one bounded refresh. Never a loop (refresh clears only on a definitive
  // 400/401), never a black screen (everything wrapped; an auth failure returns the sign-in card, not red text).
  function boot(){
    applyLang();
    try{
      if(!signedIn()){ signinView(); return; }
      var s=session();
      if(!expired(s)){ loadBoard(); return; }
      refresh().then(function(ok){ ok ? loadBoard() : signinView(); }).catch(function(){ signinView(); });
    }catch(e){ redFull("boot", e); }
  }
  // Drawer dismissal wired once: a backdrop tap or Escape closes it and returns to the board (no reload).
  (function(){ try{
    var s=document.getElementById("scrim");
    if(s) s.addEventListener("click", function(e){ if(e.target===s) closeDrawer(); });
    document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeDrawer(); });
  }catch(e){} })();
  boot();
})();
</script>
</body>
</html>
