<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Thrive · Compose</title>
<link rel="icon" href="../assets/thrive-logo.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="dns-prefetch" href="https://api.github.com">
<script>(function(){var d=document.documentElement;function lock(){d.classList.add('gate-locked')}try{if(sessionStorage.getItem('thrive_gate_v2')!=='0983eea9ab7aa4a1dea8d6015db3b63a66e67144947a7705cbab6ce91b395dc8')lock()}catch(e){lock()}/* boot failsafe: a script that never runs must not leave a blank locked page */setTimeout(function(){if(!d.classList.contains('gate-locked')||document.getElementById('thriveGate'))return;var ar=false;try{ar=localStorage.getItem('thrive_lang')==='ar'}catch(e){}var p=document.createElement('p');p.className='bootfail';p.textContent=ar?'تعذّر تشغيل الكونسول. أعد تحميل الصفحة، وتحقق من الاتصال إن تكرر الأمر.':'The console could not start. Reload the page, and check your connection if it happens again.';(document.body||d).appendChild(p)},6000)})();</script>
<script src="gate.js" defer></script>
</head>
<body>
<noscript><p class="bootfail">This console needs JavaScript to run. <span dir="rtl">يحتاج هذا الكونسول إلى تفعيل JavaScript.</span></p></noscript>
<header class="top">
  <a class="brand" href="index.html"><img src="../assets/thrive-logo.png" alt="Thrive" width="26" height="26" decoding="async"><b data-i18n="brand">Thrive Digital Solutions</b></a>
  <nav class="nav">
    <a href="console.html#board" data-i18n="nav_board">Thrive Operations</a>
    <a href="console.html#home" data-i18n="nav_insights">Insights</a>
    <a href="console.html#library" data-i18n="nav_library">Library</a>
    <a href="console.html#settings" data-i18n="nav_settings">Settings</a>
    <button id="langbtn" class="langbtn">العربية</button>
  </nav>
</header>

<main class="wrap">
  <div class="page-h"><h1 class="title" data-i18n="cmp_title">Compose email</h1></div>
  <p class="sub" data-i18n="cmp_sub"></p>

  <section class="panel compose-panel">
    <!-- At rest this screen asks for four things: which message, to whom, what it says, and
         send. Everything else is real and rarely touched, so it waits behind one disclosure
         rather than competing for the same glance while you are writing. -->
    <div class="etpl-bar">
      <label for="etpl" class="etpl-label" data-i18n="cmp_template">Message template</label>
      <select id="etpl" class="input"></select>
      <button class="btn ghost sm" id="cmpMoreBtn" aria-expanded="false" aria-controls="cmpMore" data-icon="filter" data-i18n="lib_more">More</button>
    </div>
    <!-- One tap to a starting message. The editor still opens blank: this offers, it does not
         decide. It is how a page you just activated goes out without writing from nothing. -->
    <div class="etpl-quick" id="etplQuick" hidden></div>
    <div id="cmpMore" class="more-bar" hidden>
      <div class="field"><label for="efrom" data-i18n="cmp_from">From</label><input id="efrom" class="input" readonly></div>
      <button class="btn ghost sm" id="eSaveTpl" data-i18n="cmp_save_tpl">Save as template</button>
      <label class="btn ghost sm" for="eTplFile" data-icon="import" data-i18n="cmp_tpl_upload">Import HTML as a message</label>
      <input id="eTplFile" type="file" accept=".html,.htm,text/html" hidden>
      <a class="btn ghost sm" href="templates.html?kind=mail" data-icon="edit" data-i18n="cmp_manage_tpl">Manage</a>
      <label class="chk"><input type="checkbox" id="efirst"> <span data-i18n="cmp_firstname">Greet by first name only (Hi Ahmed)</span></label>
      <label class="chk"><input type="checkbox" id="ebrand"> <span data-i18n="cmp_branded">Add logo header (for known contacts; a plain personal email reaches the inbox better)</span></label>
    </div>
    <div class="grid2">
      <div class="field"><label for="eto" data-i18n="cmp_to">To</label><input id="eto" class="input" type="email" autocomplete="off" placeholder="name@example.com"></div>
      <div class="field"><label for="ename" data-i18n="cmp_name">Recipient name</label><input id="ename" class="input" autocomplete="off" data-i18n-ph="cmp_name_ph"></div>
    </div>
    <div class="field" id="emonthWrap" hidden><label for="emonth" data-i18n="cmp_month">Month (this template asks for it)</label>
      <input id="emonth" class="input month-input" autocomplete="off" placeholder="July"></div>
    <div class="field"><label for="esubject" data-i18n="cmp_subject">Subject</label><input id="esubject" class="input" autocomplete="off">
      <!-- Past roughly 60 characters most clients truncate, so the writer is told
           while there is still time to shorten it. WO-013 §5.2. -->
      <div class="hint subj-meter" id="subjMeter"></div></div>

    <div class="field"><label id="ebodyL" data-i18n="cmp_message">Message</label>
      <div class="etoolbar">
        <!-- Undo and redo for the message text, by icon and by Cmd+Z / Cmd+Shift+Z / Cmd+Y. Greyed
             when there is nothing to undo or redo, so an enabled tap always changes the text. -->
        <button type="button" class="etb-hist" id="cmpUndo" data-icon="undo" data-i18n-aria="cmp_undo" disabled></button>
        <button type="button" class="etb-hist ed-redo" id="cmpRedo" data-icon="undo" data-i18n-aria="cmp_redo" disabled></button>
        <!-- title alone is not an accessible name, and a bare bullet is not a label
             at all: it was the second instance of the [.] defect and verify found it.
             WO-013 §4.1. -->
        <button type="button" id="tbBold" data-i18n-aria="cmp_tb_bold" aria-label="Bold" title="Bold"><b>B</b></button>
        <button type="button" id="tbItalic" data-i18n-aria="cmp_tb_italic" aria-label="Italic" title="Italic"><i>I</i></button>
        <button type="button" id="tbUnder" data-i18n-aria="cmp_tb_under" aria-label="Underline" title="Underline"><u>U</u></button>
        <button type="button" id="tbList" data-i18n="cmp_tb_list">List</button>
        <button type="button" id="tbLink" data-i18n="cmp_tb_link">Link</button>
        <button type="button" id="tbUnlink" data-i18n="cmp_tb_unlink">Unlink</button>
        <!-- Personalize names (D4): add the name merge token to the greeting as a soft pill, or
             remove it cleanly. A toggle; nothing here sends. -->
        <button type="button" id="tbPersonalize" class="tb-toggle" aria-pressed="false" data-i18n="pn_chip" data-i18n-aria="pn_aria">Personalize names</button>
        <button type="button" id="tbOpp" class="tb-accent" hidden data-i18n="cmp_insert_opp">Link to opportunity</button>
      </div>
      <div id="elinkbar" class="elinkbar" hidden>
        <div class="elinkrow">
          <input id="elinktext" class="input" data-i18n-ph="cmp_link_text_ph">
          <input id="elinkurl" class="input" type="text" inputmode="url" data-i18n-ph="cmp_link_ph">
        </div>
        <div id="elinkpresets" class="elinkpresets"></div>
        <div class="elinkrow elinkrow-actions">
          <button type="button" class="btn sm" id="elinkApply" data-i18n="cmp_link_apply">Apply</button>
          <button type="button" class="btn ghost sm" id="elinkCancel" data-i18n="close">Close</button>
        </div>
      </div>
      <div id="eoppbar" class="elinkbar eoppbar" hidden>
        <div class="eopp-preview" id="eoppPreview"></div>
        <label class="eopp-l" data-i18n="cmp_opp_which">Which words in your message should link to the opportunity?</label>
        <div class="elinkrow">
          <input id="eopptext" class="input" data-i18n-ph="cmp_opp_text_ph">
        </div>
        <div class="elinkrow elinkrow-actions">
          <button type="button" class="btn sm" id="eoppInsert" data-i18n="cmp_opp_insert">Insert linked text</button>
          <button type="button" class="btn ghost sm" id="eoppLine" data-i18n="cmp_opp_line">Insert as a link line</button>
          <button type="button" class="btn ghost sm" id="eoppCancel" data-i18n="close">Close</button>
        </div>
      </div>
      <div id="ebody" class="ebody" contenteditable="true" spellcheck="true" aria-labelledby="ebodyL"></div>
      <div class="cmp-belowbody">
        <div class="hint" data-i18n="cmp_link_hint"></div>
        <div id="eoppstatus" class="eoppstatus" hidden></div>
      </div>
      <div id="elinks" class="elinks" hidden></div>
    </div>

    <!-- The bottom of the email is a real object, not a fixed string nobody sees
         until send. It previews, it is editable for this message only, and there
         is one saved block per locale chosen by the DOCUMENT language. §5.1. -->
    <details class="mw-more" id="sigWrap">
      <summary data-i18n="sig_h">Closing block</summary>
      <p class="hint" data-i18n="sig_sub"></p>
      <div class="field"><label for="sigBox" data-i18n="sig_this">This message only</label>
        <textarea id="sigBox" class="input oc-body" rows="4"></textarea></div>
      <div class="bar">
        <button class="btn ghost sm" type="button" id="sigSave" data-i18n="sig_save">Save as my block for this language</button>
        <button class="btn ghost sm" type="button" id="sigReset" data-i18n="sig_reset">Back to the saved block</button>
      </div>
      <span class="sig-loc" id="sigLoc"></span>
    </details>

    <!-- Some contact forms and some mail clients strip HTML, and a message that
         arrives as tag soup is worse than no message. Generated, and editable. -->
    <details class="mw-more" id="plainWrap">
      <summary data-i18n="pt_h">Plain text alternative</summary>
      <p class="hint" data-i18n="pt_sub"></p>
      <div class="field"><textarea id="plainBox" class="input oc-body" rows="6"></textarea></div>
      <button class="btn ghost sm" type="button" id="plainRegen" data-i18n="pt_regen">Generate it again from the message</button>
    </details>

    <!-- A live preview of the whole message as the recipient will see it,
         including the link card and the closing block. -->
    <details class="mw-more" id="prevWrap">
      <summary data-i18n="cmp_preview_h">Preview as the recipient sees it</summary>
      <div class="cmp-preview"><iframe id="cmpPreview" title="preview" sandbox=""></iframe></div>
    </details>

    <!-- The pre-send roster (D4): every recipient of a campaign with the exact name that will merge
         and the greeting each will read. Read-only; the P5 roster rows are where names are edited. -->
    <div id="mergeRoster" class="merge-roster" hidden></div>

    <!-- Three lines, shown once, before the message leaves. -->
    <div id="preSend" class="pre-send" hidden></div>

    <div class="bar bar-actions">
      <button class="btn" id="eSend" data-icon="send" data-i18n="cmp_send">Send</button>
      <button class="btn ghost" id="eSelf" data-icon="mail" data-i18n="cmp_self">Send to myself</button>
      <button class="btn ghost" id="eCopy" data-icon="copy" data-i18n="cmp_copy">Copy for Gmail</button>
      <button class="btn ghost" id="eMail" data-icon="mail" data-i18n="cmp_mailto">Open in mail app</button>
      <span id="draftSaved" class="draft-saved" data-icon="check" hidden></span>
      <div id="quotaMeter" class="quota-meter" title=""></div>
    </div>
  </section>
</main>

<script src="icons.js" defer></script>
<script src="i18n.js" defer></script>
<script src="stage-model.js" defer></script>
<script src="kinds.js" defer></script>
<script src="store.js" defer></script>
<script src="drafts.js" defer></script>
<script src="flows.js" defer></script>
<script src="app.js" defer></script>
<script>document.addEventListener("DOMContentLoaded",function(){ initLang(); initCompose(); });</script>
</body>
</html>
