<style>

var MF_BIZ = "{{" + "BIZ}}", MF_LINK = "{{" + "LINK}}", MF_MONTH = "{{" + "MONTH}}";
function mergeFieldsInto(str, name, ctx){                                                    // app.js:1370
  var out = String(str==null?"":str);
  if(name){ out = out.replace(/\{\{\s*NAME\s*\}\}/g, name); }
  else { out = out.replace(/\{\{\s*NAME\s*\}\}/g, "").replace(/[ \t]+([,،.:;!?])/g, "$1").replace(/[ \t]{2,}/g, " "); }
  out = out.split(MF_BIZ).join((ctx&&ctx.business)||"");
  out = out.split(MF_LINK).join((ctx&&ctx.link)||"");
  out = out.split(MF_MONTH).join((ctx&&ctx.month)||"");
  return out.replace(/<span data-m="[^"]*"[^>]*>([\s\S]*?)<\/span>/g, "$1");
}
function planAttachments(list){                                                              // app.js:1396
  var items = Array.isArray(list) ? list : [];
  var attach = [], hosted = [], refused = [], total = 0, count = 0;
  for(var i=0;i<items.length;i++){
    var a = items[i] || {};
    var size = Number(a.size) || 0;
    var url = String(a.url || "");
    var name = String(a.filename || a.name || "image");
    if(!url) continue;
    if(size > ATTACH_MAX_L5){ refused.push({ filename:name, size:size, reason:"file", limit:ATTACH_MAX_L5 }); continue; }
    if(count >= ATTACH_COUNT_MAX_L5){ refused.push({ filename:name, size:size, reason:"count", limit:ATTACH_COUNT_MAX_L5 }); continue; }
    if(size <= ATTACH_INLINE_MAX_L5 && total + size <= ATTACH_TOTAL_MAX_L5){
      attach.push({ filename:name, path:url, contentType:a.contentType || "", size:size }); total += size; count++;
    } else {
      hosted.push({ filename:name, url:url, size:size }); count++;
    }
  }
  return { attach:attach, hosted:hosted, refused:refused, totalBytes:total, count:count };
}

function toPlainText(html, sig){                                                             // app.js:6371
  var s = String(html||"");
  // Markdown link -> "text (url)" so an embedded link reads as the phrase plus its URL in the plain part
  // (mirrors the <a> downgrade below). A bare {{LINK}}-substituted URL carries no [text](...) and is untouched.
  s = s.replace(/\[([^\]\n]+)\]\(((?:https?:|mailto:)[^)\s]+)\)/g, function(_, txt, url){ txt = String(txt).trim(); return (txt && txt !== url) ? (txt + " (" + url + ")") : url; });
  s = s.replace(/<br\s*\/?>/gi, "\n")
       .replace(/<\/(p|div|li|h[1-6])>/gi, "\n")
       .replace(/<li[^>]*>/gi, "- ")
       .replace(/<a[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi, function(_, h, txt){ var tt = String(txt).replace(/<[^>]*>/g, "").trim(); return (tt && tt!==h) ? (tt + " (" + h + ")") : h; })
       .replace(/<[^>]*>/g, "");
  s = s.replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  s = s.replace(/\n{3,}/g, "\n\n").replace(/[ \t]+\n/g, "\n").trim();
  return sig ? (s + "\n\n" + sig) : s;
}
// LIGHT-HTML law of the new console: outreach sends light, clean HTML - not heavy branded HTML, not
// plain-only. Allowed: black body text in one system font, a smaller grey closing/signature and grey
// footer, real paragraph breaks, the plain opp link, and the one 1x1 open pixel. Forbidden: logo, tables,
// background colors, multi-color styling, any image other than the tracking pixel, inline-styled cards.

// The agency site, used ONLY by the "Use my signature" preset default (board-editor.src.js:65).
// PR-A: the message body is previewed and sent EXACTLY as written. Nothing detects or removes
// signature-like text from the body; the ONE signature is the separate data.sig field, appended by
// lightHtml / toPlainText below. The old stripBakedSig body-mutation (and its AGENCY_NAME_L5 anchor,
// whose only user it was) is removed; AGENCY_SITE_L5 stays because the editor preset still reads it.
var AGENCY_SITE_L5 = "thriveiii.com";

// Turn markdown links [text](url) into <a> anchors, run AFTER html-escaping so the anchor is the ONLY raw
// HTML in the paragraph (text and url arrive already entity-escaped). Only http(s)/mailto targets linkify, so
// an escaped scheme like javascript: is left as plain text. This is what lets "إدراج رابط الفرصة" embed the
// opp link on a chosen phrase instead of sending a naked URL; a body with no [text](url) is unchanged.
function mdLinksHtml(escaped){
  return String(escaped).replace(/\[([^\]\n]+)\]\(((?:https?:|mailto:)[^)\s]+)\)/g, function(_, txt, url){
    return '<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>';
  });
}
// Body paragraphs as light HTML: split on blank lines into <p>, single newlines become <br>. Black text,
// one system font, normal size. No wrapper card, no colors, no tables.
function bodyParasHtml(bodyPlain){
  var s = String(bodyPlain==null?"":bodyPlain).replace(/\r\n/g, "\n").replace(/^\n+|\n+$/g, "");
  if(!s) return "";
  return s.split(/\n{2,}/).map(function(b){
    b = b.replace(/^\n+|\n+$/g, "");
    return b ? '<p style="margin:0 0 14px 0">' + mdLinksHtml(esc(b)).split("\n").join("<br>") + '</p>' : "";
  }).filter(Boolean).join("");
}

// The one light-HTML document: body (black), then the identity signature in smaller grey, then the grey
// POSTAL/STOP footer. The open pixel is appended by the caller so it is the LAST and ONLY image.
function lightHtml(bodyPlain, sig, lang, bulk){
  var font = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif";
  // E0: the signature block is a clear grey (not the near-transparent #888888), small, its own block, its
  // multi-line value (name / title / site) rendered with real <br> line breaks, separated from the body by
  // space above. Empty sig renders nothing (fully optional). The grey POSTAL/STOP footer stays distinct below.
  var sigHtml = (sig && sig.trim())
    ? '<div style="margin-top:18px;font-size:13px;line-height:1.5;color:#595959">' + esc(String(sig)).split("\n").join("<br>") + '</div>'
    : "";
  // The POSTAL/STOP footer is a bulk (campaign) marker only; a personal 1:1 message omits it (bulk===false).
  return '<div style="font-family:' + font + ';font-size:15px;line-height:1.6;color:#111111">'
    + bodyParasHtml(bodyPlain) + sigHtml + '</div>' + (bulk ? footerHtml(lang) : "");
}

// compile(recipient, content) for ONE recipient. Content is the opp RECORD's prepared message
// (console_opps.data.outreach_subject / outreach_text / sig). LIGHT-HTML: the body is the operator's text
// VERBATIM (PR-A: no signature-like text is ever detected or removed from it). The ONE signature is the
// separate data.sig field, appended EXACTLY ONCE in smaller grey above the grey footer. The plain-text arm
// mirrors it (body + blank line + sig + footer). The tokenized opp-page link (channel 2) rides in both as a
// plain URL; the 1x1 open pixel (channel 1) is the ONLY image, appended last.
// SEND MODE (DELIVERABILITY_EVIDENCE): a 1:1 personal message must look personal, not bulk. The mode is
// data-driven so preview and send always agree: an uploaded-page opp (data.source==="upload",
// board-upload.src.js:309/:391) is a "campaign" and keeps the bulk shape (open pixel + STOP/postal footer +
// List-Unsubscribe); every other opp - the standalone New message, imports - is "personal" and drops all
// three. The multipart/alternative text part stays in both modes (it helps deliverability).
function sendMode(data){ return (data && data.source === "upload") ? "campaign" : "personal"; }

function sendCompile(slug, row, data, rcpt, mode){
  data = data || {}; rcpt = rcpt || {};
  mode = mode || sendMode(data);
  var bulk = (mode === "campaign");                 // personal omits pixel + footer; campaign keeps them
  var full = String(rcpt.name==null?"":rcpt.name).trim();
  var name = (data.firstName && full) ? full.split(/\s+/)[0] : full;
  var lang = (rcpt.lang==="ar" || data.lang==="ar") ? "ar" : "en";
  var addr = bareAddress(rcpt.addr||"");
  var pageSlug = (data && data.page_slug) || slug;   // PR-A0: a promoted card carries its own slug but points at the SHARED template page
  var ctx = { business:(row&&row.business)||data.business||"", link:liveUrl(pageSlug), month:data.month||"" };
  var inner = mergeFieldsInto(data.outreach_text||"", name, ctx);   // PR-A: body sent verbatim, no signature strip
  var subject = mergeFieldsInto(data.outreach_subject||"", name, ctx).replace(/^\s+|\s+$/g, "");
  var sig = data.sig || "";
  var plan = planAttachments(data.attachments||[]);
  var bodyPlain = inner + attachHostedBlockText(plan.hosted, lang);   // hosted-image links ride as text lines
  var token = recipientOpenToken(slug, addr, subject);       // == the console_mail row id (attribution join)
  if(token){
    var base = liveUrl(pageSlug), tokd = base + (base.indexOf("?")<0?"?":"&") + "r=" + encodeURIComponent(token);
    bodyPlain = bodyPlain.split(base).join(tokd);            // channel 2: the SHARED page link carries the token (PR-A0: page_slug-aware)
  }
  var text = toPlainText(bodyPlain, sig) + (bulk ? footerText(lang) : "");   // plain-text alternative part; footer only for campaigns
  var html = lightHtml(bodyPlain, sig, lang, bulk);                          // light-HTML primary part; footer only for campaigns
  if(token && bulk) html = html + openPixelHtml(slug, token, relayEp());     // channel 1: the open pixel - campaign only (never on a personal 1:1)
  return { to:addr, name:name, subject:subject, html:html, text:text, token:token, lang:lang, mode:mode, attachments:plan.attach };
}

// ---- eligibility + recipient (the engine's own gate) ------------------------------------------------
function isEmail(a){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(a||"")); }
// A sighted recipient email on the opp RECORD: the engine derives recipients from data.recipients[] (app.js:1050,
// campaignRecipients). First valid email wins.
function firstRecipient(data){
  var rs = (data && Array.isArray(data.recipients)) ? data.recipients : [];
  for(var i=0;i<rs.length;i++){ var r = rs[i]||{}; var a = bareAddress(r.addr||""); if(isEmail(a)) return { addr:a.toLowerCase(), name:r.name||"", lang:r.lang||"" }; }
  return null;
}
// SEND-HEALTH: EVERY valid recipient on the record (not just the first). A group send emails one message per
// entry - runSend loops this, so a card with N recipients reaches all N, never silently just the first.
function allRecipients(data){
  var rs = (data && Array.isArray(data.recipients)) ? data.recipients : [];
  var out = [], seen = {};
  for(var i=0;i<rs.length;i++){
    var r = rs[i]||{}; var a = bareAddress(r.addr||"").toLowerCase();
    if(isEmail(a) && !seen[a]){ seen[a]=1; out.push({ addr:a, name:r.name||"", lang:r.lang||"" }); }   // dedupe, so one address is emailed once
  }
  return out;
}
// SEND-HEALTH: the free-tier provider (Resend) caps 100/day and 1000/month. The counts are SERVER TRUTH from the
// console_mail ledger (one row per accepted send), so they never drift across devices or a reload.
var SEND_CAP_DAY = 100, SEND_CAP_MONTH = 1000;
var SEND_GAP_MS = 1100;   // space each relay call so a group send stays under the ~1 req/sec relay and the 6s per-call bound
function startOfTodayISO(){ var d=new Date(); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())).toISOString(); }
function startOfMonthISO(){ var d=new Date(); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)).toISOString(); }
// Count accepted sends today / this month from console_mail (status=sent, ts within the window). Best-effort:
// a failed read falls back to a full budget so the counter never wrongly BLOCKS a legitimate send.
function sendBudget(){
  return Promise.all([
    restGet("console_mail?status=eq.sent&ts=gte." + enc(startOfTodayISO()) + "&select=id"),
    restGet("console_mail?status=eq.sent&ts=gte." + enc(startOfMonthISO()) + "&select=id")
  ]).then(function(a){
    var day = (a[0]||[]).length, month = (a[1]||[]).length;
    return { dayUsed:day, monthUsed:month, dayLeft:Math.max(0, SEND_CAP_DAY - day), monthLeft:Math.max(0, SEND_CAP_MONTH - month) };
  }, function(){ return { dayUsed:0, monthUsed:0, dayLeft:SEND_CAP_DAY, monthLeft:SEND_CAP_MONTH }; });
}
// The live header counter: "X / 100 today - Y / 1000 month", amber at 90% of either cap. Read-only.
function refreshSendCap(){
  var el = document.getElementById("sendCap"); if(!el) return;
  sendBudget().then(function(b){
    el.textContent = b.dayUsed + " / " + SEND_CAP_DAY + " " + t("cap_today") + " · " + b.monthUsed + " / " + SEND_CAP_MONTH + " " + t("cap_month");
    var warn = (b.dayUsed >= SEND_CAP_DAY * 0.9) || (b.monthUsed >= SEND_CAP_MONTH * 0.9);
    el.className = "send-cap" + (warn ? " warn" : "");
  }, function(){});
}
// The engine allows a send when the opp has a prepared outreach message (has_email = console_board view line 210,
// docs/supabase-board-view.sql) and is not a closed/archived card, and a relay endpoint is configured (relaySend
// refuses with no endpoint, app.js:7426). The sighted-recipient requirement is checked at send time from the record.
function sendEligible(row){
  if(!row) return false;
  if(row.archived) return false;
  if(TRAY_STAGES.indexOf((row&&row.stage)||"")>=0) return false;   // won / lost / dropped are terminal
  if(!relayEp()) return false;
  return !!row.has_email;
}

// ---- the console_mail confirm write (supaConfirmMail shape) -----------------------------------------
// POST /rest/v1/console_mail, Prefer resolution=merge-duplicates,return=minimal, columns per supaMailRow
// (app.js:3913) via the generic upsert (supabase.js:408). Bounded + one refresh-retry, through authFetchOnce.
function confirmMail(row, retried){
  var url = URL_BASE + "/rest/v1/console_mail";
  return authFetchOnce(url, {
    method:"POST",
    headers:{ "apikey":ANON, "Authorization":"Bearer " + bearer(), "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
    cache:"no-store", body: JSON.stringify([row])
  }).then(function(r){
    if((r.res.status===401 || r.res.status===403) && !retried && session() && session().refresh_token){
      return refresh().then(function(ok){ if(ok) return confirmMail(row, true); var e=new Error("auth"); e.authRequired=true; throw e; });
    }
    if(!r.res.ok){ var e2=new Error((r.data && r.data.message) || ("HTTP " + r.res.status)); if(r.res.status===401||r.res.status===403) e2.authRequired=true; throw e2; }
    return true;
  });
}
// The relay POST, faithful to app.js:7452: text/plain body, the app.js:7446 payload shape. The response body is
// read INSIDE authFetchOnce's timeout race (the fix), so it settles even on a wedged body stream.
function relayPost(payload, timeoutMs){
  return authFetchOnce(relayEp(), {
    method:"POST", headers:{ "Content-Type":"text/plain;charset=UTF-8" }, cache:"no-store", body: JSON.stringify(payload)
  }, timeoutMs);   // PR-L0: an optional longer bound for slow relay ops (page_publish commits to GitHub)
}

// ---- runSend: optimistic confirm-or-revert, faithful ordering (app.js:7440-7481) --------------------
// (a) optimistic UI first (card jumps to Sent, a 'sending' pill), (b) POST to the relay, (c) ONLY on Resend
// acceptance write the console_mail server row and re-read the board from server truth, (d) on relay error /
// Resend reject / aborted body-read, revert the card and show red - never a phantom Sent (mirrors the engine's
// unsent local-only path, app.js:7458/7460/7479). A post-acceptance confirm-write failure is the engine's
// 'sending' limbo (app.js:7473): the email went out, so it is NOT reverted to unsent; the board reflects server
// truth (no phantom) and an amber 'confirming' note shows.
// Compile + relay + confirm ONE recipient. Resolves { ok:true } on a relay-accepted send (a console_mail row is
// written, or, if only the confirm-write failed, the email still went out so it counts as sent), or { ok:false }
// with the address on a relay error / Resend reject / aborted body. NEVER throws - one bad recipient must not
// abort the batch. mode/compile/idempotency/Message-ID/token are all per-recipient (unique) already.
function sendOne(slug, row, data, rcpt, mode){
  var art = sendCompile(slug, row, data, rcpt, mode);
  var idem = sendIdem(slug, art.to, art.subject, art.html);
  var msgid = newMessageId();
  var headers = Object.assign({}, outboundHeaders(slug, mode), { "Message-ID": msgid });
  var payload = { v:REQUIRED_RELAY_L5, from:FROM_EMAIL_L5, fromName:fromName(), to:art.to, subject:art.subject,
    html:art.html, text:art.text, idempotencyKey:idem, headers:headers, slug:slug };
  if(art.attachments && art.attachments.length) payload.attachments = art.attachments;
  return relayPost(payload).then(function(r){
    if(!r.res.ok) return { ok:false, addr:art.to };
    var d = r.data;
    if(d && d.ok===false) return { ok:false, addr:art.to };
    var mailRow = { id:art.token, opp:slug, status:"sent", to_addr:art.to, subject:art.subject, ts:isoNow(),
      actor:currentUid(), up:Date.now(),
      data:{ mid:art.token, idem:idem, msgid:msgid, resend_id:(d && d.id) || "", provider:"endpoint", direction:"out" } };
    return confirmMail(mailRow).then(function(){ return { ok:true, addr:art.to }; },
                                     function(){ return { ok:true, addr:art.to, confirming:true }; });  // email out; the confirm-write is the 'sending' limbo, still a send
  }, function(){ return { ok:false, addr:art.to }; });
}
// runSend: REAL group send. Loops EVERY recipient (allRecipients), one throttled relay call each, settling per
// recipient so one failure never aborts the rest, and gated by the daily/monthly send cap (server truth from
// console_mail). A card with N recipients reaches all N (up to the remaining budget), never silently just the
// first. Single-recipient behaviour is preserved (one relay, one row, revert-on-failure, no phantom Sent).
function runSend(slug){
  if(__writing) return Promise.resolve(null); __writing = true;
  var row = findRow(slug);
  if(!row){ __writing = false; return Promise.resolve(null); }
  __act[slug] = { msg:t("s_sending"), cls:"" };
  drawerActsDisabled(true);
  var snap = null;
  return oppReadData(slug).then(function(data){
    var recips = allRecipients(data);
    if(!recips.length) { var e0=new Error("no recipient"); e0.__kind="norecip"; throw e0; }
    if(!(data && (String(data.outreach_text||"").trim() || String(data.outreach_subject||"").trim()))){ var e1=new Error("no message"); e1.__kind="nomsg"; throw e1; }
    // E2 ConTh-3: an uploaded-page opp must be proven LIVE before ANY send (upSendLiveGate, unchanged). The gate
    // throws __kind="notlive"/"deadlink" so the catch reverts with a clear reason. Non-upload opps pass through.
    var __liveGate = (typeof upSendLiveGate==="function") ? upSendLiveGate(slug, data) : Promise.resolve();
    return __liveGate.then(function(){
      return sendBudget();
    }).then(function(budget){
      // CAP: the send never exceeds the remaining daily/monthly budget. If a group is larger than what fits, send
      // ONLY what fits and REPORT the rest as blocked by the cap - never silently drop them.
      var room = Math.max(0, Math.min(budget.dayLeft, budget.monthLeft));
      if(room <= 0){ var ec=new Error("cap"); ec.__kind="cap"; throw ec; }
      var toSend = recips.slice(0, room), capped = recips.length - toSend.length;
      var mode = sendMode(data);
      snap = JSON.parse(JSON.stringify(row));
      row.stage = "sent"; row.sent_count = Number(row.sent_count||0) + toSend.length; row.__sending = true;
      try{ renderBoard(__data); }catch(e){}
      var sent = [], failed = [];
      function one(i){
        if(i >= toSend.length) return Promise.resolve();
        return sendOne(slug, row, data, toSend[i], mode).then(function(res){
          if(res && res.ok) sent.push(res.addr); else failed.push((res && res.addr) || toSend[i].addr);
          if(i + 1 < toSend.length) return upDelay(SEND_GAP_MS).then(function(){ return one(i + 1); });   // THROTTLE between recipients
          return one(i + 1);
        });
      }
      return one(0).then(function(){
        return reloadBoardData().then(function(){}, function(){}).then(function(){
          __writing = false;
          if(sent.length === 0 && snap){ replaceRow(slug, snap); try{ renderBoard(__data); }catch(x){} }   // nothing went out: revert (no phantom Sent)
          var view = sendResultView(sent.length, recips.length, failed, capped);   // ONE result string+class (green / amber / red)
          __act[slug] = { msg:view.msg, cls:view.cls };
          if(__drawerSlug===slug) refreshDrawer(slug);
          try{ refreshSendCap(); }catch(e){}                                // the header counter reflects the new sends
          return view;                                                      // resolve so a caller (the New-message overlay) can SHOW the result
        });
      });
    });
  }).catch(function(e){
    __writing = false;
    if(snap){ replaceRow(slug, snap); try{ renderBoard(__data); }catch(x){} }   // revert the optimistic send (no phantom Sent)
    var kind = e && e.__kind;
    var msg = (kind==="norecip") ? t("s_no_recip") : (kind==="nomsg") ? t("s_no_msg")
      : (kind==="cap") ? t("s_cap")
      : (kind==="notlive") ? t("s_not_live") : (kind==="deadlink") ? t("s_dead_link")
      : (e && e.authRequired) ? t("err") : t("s_failed");
    __act[slug] = { msg:msg, cls:"bad" };
    if(__drawerSlug===slug) refreshDrawer(slug); else { try{ redInto(root, "send", new Error(t("s_failed"))); }catch(x){} }
    return { msg:msg, cls:"bad", sent:0, failed:1, capped:0 };              // resolve (never reject) so the caller can render the reason
  });
}
// "Sent k of n." with Western numerals, isolated for RTL by the .act-status container.
function sendCountMsg(k, n){ return t("s_sent_n").replace("{k}", String(k)).replace("{n}", String(n)); }
// ONE result-tied view of a send: the same string and class everywhere. Full success is GREEN (ok); a partial
// (some sent, but >=1 failed or cap-blocked) is the AMBER WARNING (warn), never neutral grey; nothing sent is
// RED (bad). Returns { msg, cls, sent, failed, capped } so the overlay and the drawer render identically.
function sendResultView(sentN, total, failedAddrs, capped){
  failedAddrs = failedAddrs || []; capped = capped || 0;
  var failedN = failedAddrs.length;
  if(!failedN && !capped){
    return { msg:(sentN > 1 ? sendCountMsg(sentN, sentN) : t("s_sent")), cls:"ok", sent:sentN, failed:0, capped:0 };
  }
  var msg = sendCountMsg(sentN, total);
  if(failedN) msg += " " + t("s_failed_n").replace("{f}", String(failedN)) + " " + failedAddrs.join(", ");
  if(capped)  msg += " " + t("s_capped_n").replace("{c}", String(capped));
  return { msg:msg, cls:(sentN === 0 ? "bad" : "warn"), sent:sentN, failed:failedN, capped:capped };   // partial = amber warning, never neutral
}

// ===================================================================================================
// L5.5 RECIPIENT FIELD - put a recipient email on an opp so L5's Send gate can clear. Inlined verbatim into
// library/board.html by tools/bundle.js (interpolated as a string, so its regexes need no template escaping)
// and runs inside board.html's IIFE alongside the L5 send clone (board-send.src.js). It reuses that file's
// esc, t, bareAddress, isEmail, sendEligible, oppReadData, oppPatch, isoNow, reloadBoardData, refreshDrawer,
// __drawerSlug, __writing, __act, findRow, redInto, root.
//
// The write goes through the SAME column the engine's saveDraft({slug, recipients:list}) writes: recipients
// live inside console_opps.data (supaRowFromOpp puts them there, app.js:3882-3886), and the engine's roster
// editor persists them via saveDraft (app.js:2198). board.html writes the SAME data.recipients[] via its L4
// oppPatch (PATCH console_opps {data}), so the row the L5 gate reads (campaignRecipients / firstRecipient,
// app.js:1050) is byte-identical to an engine-written one. No new column, no new write path.
// ===================================================================================================

// The email the opp already knows, from its own R11 contact model. Mirrors contactChannels / primaryEmailChannel
// (app.js:12675-12684): channels[] (the source of truth) first, then the legacy channel.to / data.email mirror
// (seeded at intake.js:626/631). Returns "" when the opp carries no email anywhere - the field then starts empty.
function knownEmail(data){
  data = data || {};
  if(Array.isArray(data.channels)){
    var prim = data.channels.filter(function(c){ return c && c.primary && c.type==="email" && c.value; })[0];
    var any  = data.channels.filter(function(c){ return c && c.type==="email" && c.value; })[0];
    var pick = prim || any;
    if(pick) return bareAddress(pick.value);
  }
  var c = data.channel || {};
  if(c.kind==="email" && c.to) return bareAddress(c.to);
  if(data.email) return bareAddress(data.email);
  if(/@/.test(String(c.to||""))) return bareAddress(c.to);
  return "";
}
// The addresses already saved on the opp (data.recipients[]), the exact field the L5 gate reads.
function recipientAddrs(data){
  var rs = (data && Array.isArray(data.recipients)) ? data.recipients : [];
  return rs.map(function(r){ return bareAddress((r && r.addr) || ""); }).filter(Boolean);
}
// The field's pre-fill: the saved recipients if any, else the known email as an editable SUGGESTION (not saved).
function recipientPrefill(data){
  var ex = recipientAddrs(data);
  if(ex.length) return ex.join(", ");
  return knownEmail(data);
}
// Parse one or more addresses, comma / newline / semicolon separated (single AND future group send).
function parseAddrs(text){
  return String(text||"").split(/[\n,;]+/).map(function(s){ return bareAddress(s).toLowerCase(); }).filter(Boolean);
}
// UNIFY: ONE recipient reader/parser for BOTH the overlay and the drawer. Both mount the same field (#recIn),
// so this is the single source the send gate and the send writer read. Valid emails only, {addr,name,lang} shape.
function sendToRaw(){ var el=document.getElementById("recIn"); return el ? String(el.value||"") : ""; }
function sendToList(){ return parseAddrs(sendToRaw()).filter(isEmail).map(function(a){ return { addr:a, name:"", lang:"" }; }); }
function sendHasRecip(){ return sendToList().length > 0; }

var __recSaved = {};   // per-slug transient "Saved." status, rendered on each drawer paint (survives the enrichment re-render)

function recipientHtml(slug, row, detail){
  // UNIFY: the recipient field renders wherever the compose editor renders (editorEligible), NOT gated on
  // has_email. So a card whose message did not persist still shows a recipient field, and the overlay and the
  // drawer mount the SAME field (#recIn). Send stays gated on subject+body+recipient (sendReady), never has_email.
  if(!editorEligible(row)) return "";
  var data = (detail && detail.opp && detail.opp.data) || null;
  var val = data ? recipientPrefill(data) : "";
  var st = __recSaved[slug] || {};
  return '<div class="dw-sec"><h3>'+esc(t("r_h"))+'</h3>'+
    '<textarea class="rec-in mono-iso" id="recIn" rows="1" dir="ltr" autocomplete="off" spellcheck="false" '+
      'placeholder="'+esc(t("r_ph"))+'" aria-label="'+esc(t("r_h"))+'">'+esc(val)+'</textarea>'+
    '<div class="acts"><button class="act send" id="recSave" type="button">'+esc(t("r_save"))+'</button></div>'+
    '<div class="act-status'+(st.cls?(" "+st.cls):"")+'" id="recStatus">'+esc(st.msg||"")+'</div></div>';
}

function setRecStatus(msg, cls){ var el=document.getElementById("recStatus"); if(el){ el.className="act-status"+(cls?(" "+cls):""); el.textContent=msg||""; } }

// Write data.recipients[] via the board's bounded oppPatch (same column as the engine's saveDraft), then read
// back to confirm it persisted. Each address becomes {addr,name,lang} - the exact shape campaignRecipients /
// firstRecipient reads (app.js:1050). Settles either way (authFetchOnce race); no storage touched.
function saveRecipients(slug, list){
  return oppReadData(slug).then(function(data){
    var next = Object.assign({}, data, { recipients: list });
    return oppPatch(slug, { data: next, up: Date.now() }).then(function(){
      return oppReadData(slug).then(function(d2){                       // read-back confirm
        var got = (d2 && Array.isArray(d2.recipients)) ? d2.recipients : [];
        if(got.length < list.length){ throw new Error("recipients did not persist"); }
        return got;
      });
    });
  });
}

// Optimistic confirm-or-revert, same discipline as L4/L5. Validate first (an @ and a dotted domain); reject empty
// or malformed with red and NO write. On success re-read the board (server truth), so L5's Send gate reads the
// saved recipient on its next tap with no manual reload, and any stale L5 "no recipient" red is cleared.
function onSaveRecipient(slug){
  var input = document.getElementById("recIn"); if(!input) return;
  var addrs = parseAddrs(input.value); setRecStatus("", "");
  if(!addrs.length){ setRecStatus(t("r_empty"), "bad"); return; }
  var bad = addrs.filter(function(a){ return !isEmail(a); });
  if(bad.length){ setRecStatus(t("r_bad"), "bad"); return; }
  if(__writing) return; __writing = true;
  setRecStatus(t("r_saving"), ""); var btn=document.getElementById("recSave"); if(btn) btn.disabled=true;
  var list = addrs.map(function(a){ return { addr:a, name:"", lang:"" }; });
  saveRecipients(slug, list).then(function(){
    return reloadBoardData();
  }).then(function(){
    __writing = false;
    if(__act[slug] && __act[slug].cls==="bad"){ delete __act[slug]; }    // clear a stale L5 "no recipient email" red
    __recSaved[slug] = { msg:t("r_saved"), cls:"ok" };
    if(__drawerSlug===slug) refreshDrawer(slug);
  }).catch(function(e){
    __writing = false; var b2=document.getElementById("recSave"); if(b2) b2.disabled=false;
    setRecStatus((e && e.authRequired) ? t("err") : t("r_failed"), "bad");
  });
}

// ===================================================================================================
// UNIFIED MESSAGE EDITOR (compose + reply) - net-new on board.html (EDITOR_EVIDENCE 2: no compose surface
// exists today; the L5 send refuses when data.outreach_subject/outreach_text are both empty, board.html
// gate). Inlined verbatim into library/board.html by tools/bundle.js (interpolated as a string, so no
// template escaping; this file therefore uses NO backticks and NO dollar-brace). Runs inside board.html's
// IIFE alongside the L5 send clone (board-send.src.js) and the L5.5 recipient field (board-recipient.src.js),
// reusing their scope: esc, t, oppReadData, oppPatch, sendCompile, firstRecipient, liveUrl, MF_LINK,
// bareAddress, isEmail, findRow, refreshDrawer, reloadBoardData, __drawerSlug, __writing, __act, root,
// and window.__thriveIdentity (Step 2 identity).
//
// WHAT IT DOES (one surface for both first compose and reply):
//   * subject input + body textarea (textarea so newlines are real, the L5.5 lesson), pre-filled from the
//     opp record (data.outreach_subject / data.outreach_text) or empty.
//   * a SEPARATE, OPTIONAL Signature field (E0, Thyab): its own textarea (#edSig), distinct from the body.
//     Its live value IS data.sig - the single source. Empty = no signature block appended (fully optional).
//     A "Use my signature" button FILLS the field from runtime identity as three lines (name / title / site);
//     it is a convenience fill only, never an automatic injection. The editor NEVER derives or fuses a
//     signature into the body: the body is shown and sent exactly as typed.
//   * the opp link inserted as the LINK merge token (MF_LINK, built by concatenation), which sendCompile
//     tokenizes to liveUrl(slug) = console.thriveiii.com/opp/<slug> (EDITOR_EVIDENCE 3); never a hardcoded URL.
//   * a live preview compiled by the SAME sendCompile the send path uses, so preview == send (no
//     false-success gap): the preview iframe html is byte-identical to what runSend would POST.
//   * debounced auto-save to data.outreach_subject/outreach_text/sig via the bounded oppPatch (same shape
//     as L4/2B/L5.5 writes), optimistic confirm-or-revert with a visible red on failure and NEVER a phantom
//     save. No forced value reset on each keystroke, so the native textarea undo stack is preserved (ConTh 4).
//   * a light pre-send checklist (subject / body / recipient / link). The Send button is greyed while the
//     MESSAGE is incomplete (subject/body/link); the RECIPIENT check is shown but stays enforced by the
//     existing runSend gate (its red refusal is the tested backstop), so this pre-flight never walls off the
//     send path. Reply carries the opp's slug for free: the editor is bound to one slug and runSend(slug)
//     stamps outboundHeaders(slug) Reply-To hi+<slug> (EDITOR_EVIDENCE 4), never a campaign.
//   * Send itself is UNCHANGED: the editor only prepares subject/body/sig/link on the record; the actual
//     send is the existing L5 single-recipient path (runSend). No fork, no duplicate send logic.
// ===================================================================================================

var __edT = {};        // per-slug debounce timer id
var __edSaving = false; // editor's own in-flight guard (separate from the shared __writing send/note lock)
var __edBase = {};      // per-slug base data jsonb (non-message fields), captured at render for the preview compile
var __edStat = {};      // per-slug transient save status {msg,cls}, re-rendered on each drawer paint

// The editor renders for any editable opp: not archived, not a terminal tray declaration (won/lost/dropped).
// It deliberately does NOT require has_email, so an opp with NO prepared message can be given one from the
// board, flipping the L5 gate on the next reload. Sent/replied/live/draft all show it (reply is just a new
// compose on the same slug).
function editorEligible(row){
  if(!row) return false;
  if(row.archived) return false;
  if(TRAY_STAGES.indexOf((row&&row.stage)||"")>=0) return false;
  return true;
}

// E0: the signature is the operator's OWN field, not an auto-derived value. edSignature() is the LIVE value of
// the Signature textarea (#edSig) - authoritative and OPTIONAL: an empty field ships an empty data.sig, so NO
// signature block is appended (sendCompile/lightHtml render nothing when sig is empty). The editor never
// injects a signature on its own; the operator types one, fills one from identity via "Use my signature", or
// leaves it blank.
function edIdentity(){ try{ return window.__thriveIdentity || {}; }catch(e){ return {}; } }
function edSignature(){ return edVal("edSig"); }
// The "Use my signature" preset: a quiet three-line block from runtime identity, name / title / site, each on
// its own line. Title omitted if unset (name then site); name omitted if unset (site alone). This only FILLS
// the field on demand; it is never applied automatically. The site is the send-side agency constant.
function edSignaturePreset(){
  var id = edIdentity();
  var name = String(id.name==null?"":id.name).trim();
  var title = String(id.title==null?"":id.title).trim();
  var site = (typeof AGENCY_SITE_L5!=="undefined" && AGENCY_SITE_L5) ? AGENCY_SITE_L5 : "thriveiii.com";
  var lines = [];
  if(name) lines.push(name);
  if(title) lines.push(title);
  lines.push(site);
  return lines.join("\n");
}

// SURFACE SCOPING (COMPOSE_SURFACE_EVIDENCE A1): the editor markup (#edSubj/#edBody/#edSig/#edPreview/
// #edLink/#edStatus and the checklist items) is mounted by BOTH the drawer (#drawer) and the standalone
// New-message overlay (#nmPanel). When both exist, document.getElementById returns the FIRST in DOM order
// (the drawer, which sits before #nmPanel), so overlay reads/writes would bind to the drawer's fields.
// edRoot() returns the ACTIVE compose surface - the overlay while it is open, otherwise the drawer - and
// edEl() scopes every compose lookup to it, so a read never resolves to a hidden second copy.
function edRoot(){
  if(typeof __nmOpen!=="undefined" && __nmOpen){ var p=document.getElementById("nmPanel"); if(p) return p; }
  var d=document.getElementById("drawer"); if(d) return d;
  return document;
}
function edEl(id){ try{ var r=edRoot(); return r ? r.querySelector("#"+id) : null; }catch(e){ return document.getElementById(id); } }
function edVal(id){ var el=edEl(id); return el ? String(el.value||"") : ""; }
// PR-A0: the page a card points at is data.page_slug when set (a promoted card shares the template page), else
// the card's own slug. __edBase[slug] holds the opp's data (captured at render), so this needs no new argument.
function edPageSlug(slug){ var d = __edBase[slug] || {}; return (d && d.page_slug) || slug; }
// The link is present when the body carries the merge token OR an already-tokenized/literal opp URL. The literal
// check uses the SHARED page URL (edPageSlug) so a pasted template link is recognized on a promoted card too.
function edHasLink(slug, body){
  var b = String(body||"");
  if(b.indexOf(MF_LINK) >= 0) return true;
  try{ if(b.indexOf(liveUrl(edPageSlug(slug))) >= 0) return true; }catch(e){}
  return false;
}

// Build the data jsonb the preview/send compiles from: the captured base overlaid with the LIVE subject,
// body, and the operator's signature FIELD value (empty allowed). edCompileFrom then runs the SAME sendCompile
// the send path uses, so the preview html equals the send payload html for identical inputs.
function edLiveData(slug){
  var base = __edBase[slug] || {};
  return Object.assign({}, base, { outreach_subject:edVal("edSubj"), outreach_text:edVal("edBody"), sig:edSignature() });
}
function edCompileFrom(slug, data){
  var row = findRow(slug) || { slug:slug, business:(data&&data.business)||"" };
  var rcpt = firstRecipient(data) || { addr:"", name:"", lang:"" };
  return sendCompile(slug, row, data, rcpt);          // the send path's own compiler (EDITOR_EVIDENCE 1)
}

// The editor surface. Placed just before the recipient field and the Send action in the drawer, so compose
// -> recipient -> send read top to bottom. Pre-fills from the record; empty for a fresh compose.
function editorHtml(slug, row, detail){
  if(!editorEligible(row)) return "";
  var data = (detail && detail.opp && detail.opp.data) || null;
  __edBase[slug] = data || __edBase[slug] || {};       // capture base for the preview compile (enrich paint sets it)
  var subj = data ? String(data.outreach_subject||"") : (edVal("edSubj"));
  var body = data ? String(data.outreach_text||"") : (edVal("edBody"));
  var hasRecip = data ? !!firstRecipient(data) : false;
  var st = __edStat[slug] || {};
  var ck = function(id, ok, key){
    return '<li class="ed-ck '+(ok?"ck-ok":"ck-no")+'" id="'+id+'">'+esc(t(key))+'</li>';
  };
  // The signature FIELD pre-fills from the persisted record's data.sig (empty if none); on re-render inside an
  // open drawer it keeps the live typed value so a paint never clobbers an in-progress signature.
  var sig = data ? String(data.sig||"") : (edVal("edSig"));
  var subjOk = !!subj.trim(), bodyOk = !!body.trim(), linkOk = edHasLink(slug, body);
  return '<div class="dw-sec ed-sec"><h3>'+esc(t("ed_h"))+'</h3>'+
    '<input class="ed-subj" id="edSubj" type="text" autocomplete="off" spellcheck="true" '+
      'placeholder="'+esc(t("ed_subj_ph"))+'" aria-label="'+esc(t("ed_subj"))+'" value="'+esc(subj)+'">'+
    '<textarea class="rec-in ed-body" id="edBody" rows="6" autocomplete="off" spellcheck="true" '+
      'placeholder="'+esc(t("ed_body_ph"))+'" aria-label="'+esc(t("ed_body"))+'">'+esc(body)+'</textarea>'+
    '<div class="acts"><button class="act" id="edLink" type="button">'+esc(t("ed_link"))+'</button></div>'+
    '<ul class="ed-checks">'+
      ck("ckSubj", subjOk, "ed_ck_subj")+ck("ckBody", bodyOk, "ed_ck_body")+
      ck("ckRecip", hasRecip, "ed_ck_recip")+ck("ckLink", linkOk, "ed_ck_link")+
    '</ul>'+
    '<div class="ed-sig-field">'+
      '<div class="ed-sig-head"><span class="ed-sig-lab">'+esc(t("ed_sig"))+'</span>'+
        '<button class="act ed-sig-use" id="edSigFill" type="button">'+esc(t("ed_sig_use"))+'</button></div>'+
      '<textarea class="rec-in ed-sig-in" id="edSig" rows="3" autocomplete="off" spellcheck="true" '+
        'placeholder="'+esc(t("ed_sig_ph"))+'" aria-label="'+esc(t("ed_sig"))+'">'+esc(sig)+'</textarea>'+
    '</div>'+
    '<div class="ed-prev-h">'+esc(t("ed_preview"))+'</div>'+
    '<iframe class="ed-preview" id="edPreview" title="'+esc(t("ed_preview"))+'" sandbox="" referrerpolicy="no-referrer" srcdoc=""></iframe>'+
    '<div class="act-status'+(st.cls?(" "+st.cls):"")+'" id="edStatus">'+esc(st.msg||"")+'</div></div>';
}

function edSetStatus(slug, msg, cls){
  __edStat[slug] = { msg:msg||"", cls:cls||"" };
  var el=edEl("edStatus"); if(el){ el.className="act-status"+(cls?(" "+cls):""); el.textContent=msg||""; }
}
// Re-mark the four check items from the LIVE values (no value reset, so undo is untouched). Recipient is not
// re-derived on keystroke (it changes only via the recipient field, which reloads the drawer).
function edRefreshChecks(slug){
  var set=function(id, ok){ var el=edEl(id); if(el) el.className="ed-ck "+(ok?"ck-ok":"ck-no"); };
  set("ckSubj", !!edVal("edSubj").trim());
  set("ckBody", !!edVal("edBody").trim());
  set("ckLink", edHasLink(slug, edVal("edBody")));
}
// Grey the Send button while the MESSAGE is incomplete (subject/body/link). Recipient stays enforced by
// runSend, so the no-recipient refusal remains a live, clickable path.
// UNIFY: the editor delegates its Send-disable gate to the one shared gate (sendApplyGate -> sendReady =
// subject AND body AND a valid recipient), so the drawer's board Send and the overlay's Send obey the same
// rule. The link stays optional; the gate is never keyed on the stored has_email flag.
function edApplyGate(slug){ if(typeof sendApplyGate==="function") sendApplyGate(slug); }
// Recompile the preview from the LIVE values, through the send path's own sendCompile, and show it. The
// srcdoc html is byte-identical to what runSend would POST for the same record (proven by edCompileFrom
// reusing sendCompile). Best-effort: a compile hiccup never throws into the editor.
function edRenderPreview(slug){
  try{
    var art = edCompileFrom(slug, edLiveData(slug));
    var f=edEl("edPreview"); if(f) f.setAttribute("srcdoc", art.html);
  }catch(e){}
}
function edTick(slug){ edRefreshChecks(slug); edApplyGate(slug); edRenderPreview(slug); }

// Insert the opp link. With a selection, EMBED the link on the chosen phrase as a markdown link
// [selected]({{LINK}}) (ConTh 11: an anchor, not a naked URL - bodyParasHtml renders it as <a>). With no
// selection, insert the bare {{LINK}} token as before (the naked token stays supported and optional). Either
// way {{LINK}} is present, so edHasLink still clears the ckLink gate. execCommand keeps the native undo stack
// (ConTh 4); a splice fallback covers browsers without it.
function edInsertLink(slug){
  var el=edEl("edBody"); if(!el) return;
  el.focus();
  var s=el.selectionStart==null?el.value.length:el.selectionStart, e2=el.selectionEnd==null?el.value.length:el.selectionEnd;
  var sel=el.value.slice(s,e2);
  var token = sel ? ("[" + sel + "](" + MF_LINK + ")") : MF_LINK;
  var ok=false;
  try{ ok=document.execCommand("insertText", false, token); }catch(e){ ok=false; }
  if(!ok){
    el.value = el.value.slice(0,s) + token + el.value.slice(e2);
    var pos=s+token.length; try{ el.selectionStart=el.selectionEnd=pos; }catch(_){}
    try{ el.dispatchEvent(new Event("input", { bubbles:true })); }catch(_){}
  }
  edTick(slug); edScheduleSave(slug, 300);
}

// "Use my signature": a convenience FILL of the Signature field with the identity preset (name / title / site,
// each on its own line). It is never automatic - the operator taps it, then may edit or clear the field. After
// filling, refresh the preview and debounce a save so the chosen signature persists like any typed one.
function edFillSignature(slug){
  var el=edEl("edSig"); if(!el) return;
  el.value = edSignaturePreset();
  try{ el.dispatchEvent(new Event("input", { bubbles:true })); }catch(_){}
  try{ el.focus(); }catch(_){}
  edTick(slug); edScheduleSave(slug, 300);
}

function edScheduleSave(slug, delay){
  // E1 seam: when the standalone New Message overlay owns this slug, its own single writer persists the
  // message + recipient together (one read-modify-write, no data-jsonb race with the drawer writer). Every
  // editor input / link-insert / signature-fill routes here, so this is the one place that redirects the save.
  if(typeof nmActive==="function" && nmActive(slug)){ if(typeof nmScheduleSave==="function") nmScheduleSave(slug, delay); return; }
  if(__edT[slug]) clearTimeout(__edT[slug]);
  __edT[slug] = setTimeout(function(){ __edT[slug]=null; edSaveNow(slug); }, delay||700);
}
// Bounded, optimistic confirm-or-revert save. The textarea IS the optimistic state; on a CONFIRMED write we
// show green (never a phantom "Saved" without persistence); on failure we show red and leave the operator's
// text intact (reverting it would lose typing). Never fights the shared send/note lock: if one is in flight,
// reschedule shortly so the text is never dropped. On the FIRST message that makes an opp sendable, reload
// the board once so the L5 gate flips and Send appears; ongoing edits do not reload (undo preserved).
function edSaveNow(slug){
  if(__drawerSlug!==slug) return;
  var subjEl=edEl("edSubj"), bodyEl=edEl("edBody");
  if(!subjEl || !bodyEl) return;
  if(__writing || __edSaving){ edScheduleSave(slug, 500); return; }
  __edSaving = true;
  var subj=String(subjEl.value||""), body=String(bodyEl.value||""), sig=edSignature();
  edSetStatus(slug, t("a_saving"), "");
  oppReadData(slug).then(function(data){
    var wasEmpty = !(String(data.outreach_subject||"").trim() || String(data.outreach_text||"").trim());
    var nowHas = !!(subj.trim() || body.trim());
    var next = Object.assign({}, data, { outreach_subject:subj, outreach_text:body, sig:sig });
    return oppPatch(slug, { data:next, up:Date.now() }).then(function(){
      __edSaving = false;
      __edBase[slug] = next;                                   // keep the preview base in sync with the persisted record
      var row = findRow(slug);
      var reveal = wasEmpty && nowHas && row && !row.has_email; // first message: flip the L5 gate so Send appears
      if(reveal){
        return reloadBoardData().then(function(){ edSetStatus(slug, t("a_saved"), "ok"); if(__drawerSlug===slug) refreshDrawer(slug); },
                                     function(){ edSetStatus(slug, t("a_saved"), "ok"); });
      }
      edSetStatus(slug, t("a_saved"), "ok"); edRenderPreview(slug);
    });
  }).catch(function(e){
    __edSaving = false;
    edSetStatus(slug, (e && e.authRequired) ? t("err") : t("a_failed"), "bad");   // red, no phantom save; text kept
  });
}

// Wire the editor after each drawer paint (called from wireDrawer). Input listeners update the checklist,
// the Send gate, and the live preview, then debounce a save. No value is ever reset here, so undo is intact.
function wireEditor(slug){
  var subjEl=edEl("edSubj"), bodyEl=edEl("edBody");
  if(!subjEl && !bodyEl) return;
  // edTick runs edApplyGate -> sendApplyGate, which toggles BOTH the overlay's #nmSend and the drawer's board
  // Send. So completing subject/body (or recipient) LAST re-enables Send in either surface. No link term.
  var onInput=function(){ edTick(slug); edScheduleSave(slug, 700); };
  if(subjEl) subjEl.addEventListener("input", onInput);
  if(bodyEl) bodyEl.addEventListener("input", onInput);
  var sigEl=edEl("edSig"); if(sigEl) sigEl.addEventListener("input", onInput);   // E0: signature is field-driven
  var lk=edEl("edLink"); if(lk) lk.addEventListener("click", function(){ edInsertLink(slug); });
  var sf=edEl("edSigFill"); if(sf) sf.addEventListener("click", function(){ edFillSignature(slug); });
  edTick(slug);                                                // initial checklist + gate + preview
}

// Read-only hooks for later steps and board_editor_test:
//   __thriveComposeArtifact(slug): the artifact compiled from the PERSISTED record, byte-identical to what
//     runSend compiles before it POSTs (oppReadData -> firstRecipient -> sendCompile), so preview == send.
//   __thriveReplyTo(slug): the Reply-To the send stamps, proving a reply carries the opp slug (never a campaign).
try{
  window.__thriveComposeArtifact = function(slug){ return oppReadData(slug).then(function(data){ return edCompileFrom(slug, data); }); };
  window.__thriveReplyTo = function(slug){ try{ return outboundHeaders(slug)["Reply-To"]; }catch(e){ return ""; } };
  //   __thriveSendHeaders(slug): the exact header set the send stamps for a slug's own mode (personal 1:1 vs
  //     campaign), proving a personal send carries NO List-Unsubscribe. Derives mode from the persisted record.
  window.__thriveSendHeaders = function(slug){ return oppReadData(slug).then(function(data){ return outboundHeaders(slug, sendMode(data)); }); };
  window.__thriveEditorSignature = function(){ return edSignature(); };     // the LIVE field value (empty allowed)
  window.__thriveSignaturePreset = function(){ return edSignaturePreset(); }; // the "Use my signature" fill (name/title/site)
}catch(e){}

// ===================================================================================================
// E1 NEW MESSAGE - the editor as a STANDALONE process. A header "New message" button opens the unified
// editor in its OWN overlay (#nmScrim/#nmPanel, mirroring the profile/admin scrims), to compose and send a
// message to any recipient, with or without an opp link, with no opp required up front and no draft lost on
// accidental close. Inlined verbatim into library/board.html by tools/bundle.js AFTER the editor clone, so it
// reuses that IIFE scope: editorHtml, wireEditor, edVal, edSignature, edTick, edRenderPreview, __edBase (the
// editor); recipientPrefill, parseAddrs (the recipient field); isEmail, runSend (the send); oppReadData,
// reloadBoardData, authFetchOnce, URL_BASE, ANON, bearer, session, refresh, __writing, t, esc, root.
//
// GROUNDED IN E1_EVIDENCE.md:
//   * The send is bound to an OPP, not to a link (runSend needs findRow(slug) + a recipient + a message;
//     it never checks for a link). So New Message mints a LIGHTWEIGHT opp on first save and hands that slug
//     to the unchanged runSend. A message with no link sends (E1_EVIDENCE 3 + 5).
//   * The draft is DURABLE from the first character: the first save upserts a console_opps row (the row the
//     board and runSend read), so an accidental close never loses it (the ConTh 3 lesson). Reopening resumes
//     it from the server via a small guarded localStorage pointer.
//   * One WRITER for the standalone draft (nmSaveNow) persists subject + body + signature + recipients in a
//     single read-modify-write, so there is no data-jsonb race with the drawer's editor writer. The editor's
//     edScheduleSave routes here whenever nmActive(slug) is true (the one seam in board-editor.src.js).
// ===================================================================================================

var __nmSlug = null;       // the current standalone draft's opp slug (null when the overlay has never opened)
var __nmOpen = false;      // is the New Message overlay currently open
var __nmT = {};            // per-slug debounce timer id (the standalone writer)
var __nmSaving = false;    // the standalone writer's in-flight guard (separate from the shared __writing lock)
var NM_KEY = "thrive_nm_draft";   // guarded localStorage pointer to the unsent standalone draft slug

// The editor's save seam calls this: the standalone overlay owns the slug while it is open.
function nmActive(slug){ return !!(__nmOpen && __nmSlug && __nmSlug===slug); }

// A fresh, unique opp slug for a standalone message. Date.now()/Math.random() are available in the board
// runtime; guarded so a hostile environment still yields a usable slug.
function nmNewSlug(){
  var tp=""; try{ tp=Date.now().toString(36); }catch(e){ tp="0"; }
  var rr=""; try{ rr=Math.random().toString(36).slice(2,8); }catch(e){ rr="x"; }
  return "msg-" + tp + "-" + rr;
}
// The guarded draft pointer. All three wrapped in try/catch: a partitioned/blocked storage never throws out.
function nmStoredSlug(){ try{ var v=localStorage.getItem(NM_KEY); return v?String(v):""; }catch(e){ return ""; } }
function nmStore(slug){ try{ localStorage.setItem(NM_KEY, String(slug||"")); }catch(e){} }
function nmClearStore(){ try{ localStorage.removeItem(NM_KEY); }catch(e){} }

// The bounded create-or-update. POST console_opps with resolution=merge-duplicates, so the FIRST save inserts
// the lightweight opp row and every later save updates it - idempotent by slug. Same settle-always discipline
// as oppPatch (authFetchOnce timeout REJECTS, one refresh-retry). console_opps RLS is "for all" to the role,
// so the insert is allowed; the row the board view and runSend read is a real console_opps row.
function oppUpsert(slug, fields, retried){
  var url = URL_BASE + "/rest/v1/console_opps";
  var row = Object.assign({ slug:slug }, fields||{});
  return authFetchOnce(url, {
    method:"POST",
    headers:{ "apikey":ANON, "Authorization":"Bearer "+bearer(), "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
    cache:"no-store", body: JSON.stringify([row])
  }).then(function(r){
    if((r.res.status===401 || r.res.status===403) && !retried && session() && session().refresh_token){
      return refresh().then(function(ok){ if(ok) return oppUpsert(slug, fields, true); var e=new Error("auth"); e.authRequired=true; throw e; });
    }
    if(!r.res.ok){ var e2=new Error((r.data && r.data.message) || ("HTTP "+r.res.status)); if(r.res.status===401||r.res.status===403) e2.authRequired=true; throw e2; }
    return true;
  });
}

// ---- the recipient input ---------------------------------------------------------------------------
// UNIFY: the overlay no longer has its own recipient field. It mounts the SAME #recIn (recipientHtml) the
// drawer uses, read through the one shared parser sendToList() (board-recipient.src.js). One field, one parser.
// A short board-card label for the standalone opp: the subject, or the localized "New message" when empty.
function nmBusiness(subj){ var s=String(subj==null?"":subj).trim(); return s ? s.slice(0,140) : t("nm_h"); }

// ---- the overlay surface -----------------------------------------------------------------------------
// Reuses editorHtml for subject/body/signature/link/preview/checklist (a synthetic draft row makes it
// eligible), then adds a recipient input, a Send button, and a status line. Everything the editor renders is
// the SAME markup the drawer uses, so the light-HTML preview and the signature field behave identically.
function nmPanelHtml(slug, data){
  data = data || {};
  var row = { slug:slug, business:nmBusiness(data.outreach_subject), stage:"draft", archived:false };
  return '<div class="nm-head"><h2>'+esc(t("nm_h"))+'</h2>'+
      '<button class="link nm-x" id="nmClose" type="button">'+esc(t("pf_close"))+'</button></div>'+
    '<div class="nm-body">'+
      editorHtml(slug, row, { opp:{ data:data } })+
      recipientHtml(slug, row, { opp:{ data:data } })+                      // UNIFY: the SAME #recIn field the drawer mounts
      '<div class="acts"><button class="act send" id="nmSend" type="button">'+esc(t("nm_send"))+'</button></div>'+
      '<div class="act-status" id="nmStatus" role="status" aria-live="polite"></div>'+
    '</div>';
}

function nmSetStatus(msg, cls){ var el=document.getElementById("nmStatus"); if(el){ el.className="act-status"+(cls?(" "+cls):""); el.textContent=msg||""; } }
// UNIFY: ONE Send gate for BOTH surfaces. Send is enabled only when subject + body + a valid recipient are
// present (a linkless message is allowed; the opp link stays optional). Never gated on the stored has_email
// flag. sendApplyGate toggles whichever Send control is mounted: the overlay's #nmSend and/or the drawer's
// board Send action (#drawer .act[data-act="send"]).
function sendReady(slug){ return !!(edVal("edSubj").trim() && edVal("edBody").trim() && sendHasRecip()); }
function sendApplyGate(slug){
  var ok = sendReady(slug);
  var nb = document.getElementById("nmSend"); if(nb) nb.disabled = !ok;
  var db = document.querySelector('#drawer .act[data-act="send"]'); if(db) db.disabled = !ok;
}
// Refresh the editor's preview + checklist, then the unified Send gate. Called on every field input.
function nmTick(slug){ try{ edTick(slug); }catch(e){} sendApplyGate(slug); }

function nmScheduleSave(slug, delay){
  if(__nmT[slug]) clearTimeout(__nmT[slug]);
  __nmT[slug] = setTimeout(function(){ __nmT[slug]=null; nmSaveNow(slug); }, delay||700);
}
// The ONE standalone writer: subject + body + signature + recipients in a single read-modify-write, upserted
// to the lightweight opp. Optimistic confirm-or-revert - green on a CONFIRMED write, red on failure with the
// operator's text left intact (never a phantom "Saved"). Records the guarded draft pointer on first success,
// so an accidental close resumes. Never fights the shared send lock: reschedules if one is in flight.
function nmSaveNow(slug){
  if(!nmActive(slug)) return;
  var subjEl=edEl("edSubj"), bodyEl=edEl("edBody");                     // scoped to the active surface (COMPOSE_SURFACE_EVIDENCE A1)
  if(!subjEl || !bodyEl) return;
  if(__writing || __nmSaving){ nmScheduleSave(slug, 500); return; }
  __nmSaving = true;
  var subj=String(subjEl.value||""), body=String(bodyEl.value||""), sig=edSignature(), recips=sendToList();
  nmSetStatus(t("a_saving"), "");
  oppReadData(slug).then(function(data){
    var next = Object.assign({}, data, { outreach_subject:subj, outreach_text:body, sig:sig, recipients:recips });
    return oppUpsert(slug, { business:nmBusiness(subj), data:next, up:Date.now() }).then(function(){
      __nmSaving = false;
      __edBase[slug] = next;                 // keep the editor's preview base in sync with the persisted record
      nmStore(slug);                         // the draft is now server-durable; remember it for resume
      nmSetStatus(t("a_saved"), "ok");
      try{ edRenderPreview(slug); }catch(e){}
    });
  }).catch(function(e){
    __nmSaving = false;
    nmSetStatus((e && e.authRequired) ? t("err") : t("a_failed"), "bad");   // red, no phantom save, text kept
  });
}

// Wire the overlay after each paint. The editor fields are wired by wireEditor (its saves route to nmSaveNow
// via the edScheduleSave seam); the recipient input, close, and Send are wired here.
function nmWire(slug){
  try{ wireEditor(slug); }catch(e){}
  var rc=document.getElementById("recIn"); if(rc) rc.addEventListener("input", function(){ nmTick(slug); nmScheduleSave(slug, 700); });
  var cl=document.getElementById("nmClose"); if(cl) cl.addEventListener("click", function(){ closeNewMessage(); });
  var sd=document.getElementById("nmSend"); if(sd) sd.addEventListener("click", function(){ unifiedSend(slug); });
  nmTick(slug);
}

// Open the standalone editor overlay. IDENTITY (NEWMSG_AUDIT): the "New message" action ALWAYS starts a
// FRESH compose - it mints a brand-new msg-<ts>-<rand> slug and never resumes the stored draft pointer.
// This is the fix for the resume-loop: a blocked or unsent draft used to leave thrive_nm_draft set, so the
// next New message reopened the SAME opp pre-filled with the prior subject/body, collapsing separate
// messages onto one card (sent_count is per slug). A durable draft is not lost - it persists as its own
// console_opps row / board card and is reopened by tapping THAT card (openDrawer), not by this button.
function openNewMessage(){
  if(__nmOpen) return;
  var sc=document.getElementById("nmScrim"), pn=document.getElementById("nmPanel");
  if(!sc || !pn) return;
  // ONE compose surface at a time (COMPOSE_SURFACE_EVIDENCE A1): close any open card drawer and clear its
  // DOM before mounting the overlay, so the drawer's #edSubj/#edBody/#edPreview cannot linger as a duplicate
  // set of ids ahead of the overlay's in the document. closeDrawer clears __drawerSlug and hides the scrim;
  // openDrawer rebuilds #drawer innerHTML on its next open, so emptying it here is safe.
  try{ if(typeof closeDrawer==="function") closeDrawer(); }catch(e){}
  var dz=document.getElementById("drawer"); if(dz) dz.innerHTML="";
  var slug = nmNewSlug();               // ALWAYS fresh: never resume nmStoredSlug() onto the generic button
  nmClearStore();                       // drop any stale pointer so it cannot hijack this or a later compose
  __nmSlug = slug; __nmOpen = true;
  __edBase[slug] = {};
  pn.innerHTML = nmPanelHtml(slug, {}); sc.hidden=false; pn.scrollTop=0; nmWire(slug);   // an empty compose, every time
}
// Close the overlay. FLUSH FIRST for a NON-empty compose: if a debounced save is pending, cancel the timer
// and write NOW (from the live fields), so a recipient or message typed within the debounce window is never
// lost - the draft stays as its own console_opps row / board card and is reopened by tapping that card.
// IDENTITY (NEWMSG_AUDIT): an EMPTY, never-typed compose leaves nothing behind - skip the flush (no junk
// "New message" opp) and clear the draft pointer, so a blocked send cannot leave a sticky pointer.
function closeNewMessage(){
  var slug = __nmSlug;
  var empty = !((edVal("edSubj")||"").trim() || (edVal("edBody")||"").trim());
  if(slug && __nmT[slug]){ clearTimeout(__nmT[slug]); __nmT[slug]=null; if(!empty){ try{ nmSaveNow(slug); }catch(e){} } }
  if(empty) nmClearStore();
  __nmOpen=false; var sc=document.getElementById("nmScrim"); if(sc) sc.hidden=true;
}

// Where a send-time status goes: the overlay's #nmStatus when it owns the slug, else the drawer card status.
function sendFail(slug, msg){
  if(typeof nmActive==="function" && nmActive(slug)){ nmSetStatus(msg, "bad"); }
  else { __act[slug] = { msg:msg, cls:"bad" }; if(__drawerSlug===slug) refreshDrawer(slug); }
}
// UNIFY: the ONE send path for BOTH surfaces. Persist the live subject/body/signature/recipients to the opp,
// reload the board so runSend's findRow(slug) resolves, then hand off to the UNCHANGED L5 runSend (which does
// the optimistic paint, the relay POST, and writes console_mail only on Resend acceptance). When the overlay
// owns the slug, the draft graduates: clear the pointer and close the overlay first. Gated on subject+body+
// recipient (the send controls are disabled otherwise); the opp link stays optional; upSendLiveGate (the live
// -page check for source==="upload") still runs inside runSend, unchanged.
function unifiedSend(slug){
  if(__writing || __nmSaving){ if(typeof nmActive==="function" && nmActive(slug)){ nmSetStatus(t("a_saving"), ""); nmScheduleSave(slug, 300); } return; }
  var subj=edVal("edSubj"), body=edVal("edBody"), sig=edSignature(), recips=sendToList();
  if(!(subj.trim() && body.trim())){ sendFail(slug, t("nm_need_msg")); return; }
  if(!recips.length){ sendFail(slug, t("nm_need_to")); return; }
  var over = (typeof nmActive==="function" && nmActive(slug));
  if(over){ nmSetStatus(t("s_sending"), ""); var sd=document.getElementById("nmSend"); if(sd) sd.disabled=true; }
  var row = findRow(slug) || { slug:slug };
  oppReadData(slug).then(function(data){
    var next = Object.assign({}, data, { outreach_subject:subj, outreach_text:body, sig:sig, recipients:recips });
    return oppUpsert(slug, { business:(row.business || nmBusiness(subj)), data:next, up:Date.now() });
  }).then(function(){
    return reloadBoardData();                          // so the opp is a board row runSend can find
  }).then(function(){
    // FEEDBACK: do NOT close the overlay before the send settles - otherwise a standalone send shows its result
    // NOWHERE. Run the send, then surface the SAME result string (Sent K of N / failed / capped) in the overlay.
    if(over) nmClearStore();                            // the draft has graduated to a board card; do not resume it
    return Promise.resolve(runSend(slug)).then(function(result){   // runSend resolves with { msg, cls, ... }
      if(over && result){
        nmSetStatus(result.msg, result.cls);            // green on full success, amber on partial, red on failure
        if(result.cls !== "ok"){ var sd2=document.getElementById("nmSend"); if(sd2) sd2.disabled=false; }   // let the operator retry a failed/partial send
      }
      // a drawer-originated send (over===false) shows its result via runSend's own __act[slug] + refreshDrawer
    });
  }).catch(function(e){
    var b2=document.getElementById("nmSend"); if(b2) b2.disabled=false;
    sendFail(slug, (e && e.authRequired) ? t("err") : t("a_failed"));
  });
}

// Read-only hooks for board_newmsg_test:
try{
  window.__thriveNewMessageSlug = function(){ return __nmSlug; };
  window.__thriveNewMessageOpen = function(){ return __nmOpen; };
}catch(e){}

// ===================================================================================================
// E2 CAMPAIGN UPLOAD - upload a zip from the device (html pages + message texts + emails), match each page
// to its message + recipient + slug, review a match table, and on APPROVAL open draft opp cards while storing
// each page to console_pages. A ported subset of the old engine's proven ingest (library/intake.js), inlined
// into library/board.html by tools/bundle.js AFTER the send + editor + new-message clones, so it reuses their
// IIFE scope: esc, t, liveUrl, oppReadData, oppPatch, authFetchOnce, URL_BASE, ANON, bearer, session, refresh,
// reloadBoardData, findRow, refreshDrawer, __drawerSlug, __writing, root; and oppUpsert (board-newmsg.src.js).
//
// GROUNDED IN E2_EVIDENCE.md, porting the cited old-engine logic (never rewritten):
//   * zip read: intake.js:1052-1128 (readZip / readFiles, native DecompressionStream).
//   * slug per html: intake.js:409/434 (slugify / pageSlug, folder-aware).
//   * one token matcher: intake.js:454-468 (normTokens / rankTokens).
//   * the mailto ConTh-3 fix: the old readSendTo set e.url = "mailto:"+em (intake.js:95); here the recipient
//     is the BARE address, mailto stripped, never "mailto:foo@bar" (matches toRecord's bare `to`, intake.js:610/626).
//   * nothing before approval: the report reads only (intake.js:1207); the write is the approve step
//     (commitDraftsBatch, app.js:4649). Here upBuildPlan previews, upCommit writes - two separate steps.
//   * no send until proven live: the real-fetch gate (pageIsGone/pageSendable, app.js:816/835). Here
//     verifyLive does a real GET of liveUrl(slug); upSendLiveGate blocks runSend for an upload opp that is
//     not activated or whose live URL does not resolve. A preview looking good is never the proof.
// ===================================================================================================

var __upPlan = null;       // the previewed plan, held until the operator approves (nothing written before then)
var __upBusy = false;      // in-flight guard for the read/commit
var __libExisting = {};    // PR-L1: the set of console_pages slugs already taken (for upload uniqueness check)
var __libPages = null;     // PR-L1: the last console_pages rows fetched for the Library surface (+ tests)
var __libQuery = "";       // PR-L1: the live Library search query
var __libPromoting = false;// PR-L6: in-flight guard for promote-to-Operations (one at a time)
var __libState = {};       // PR-CF: per-slug liveness state after re-verify ("live"|"confirming"|"fault") - survives search re-renders
var __libTab = "templates";// PR-AF: the Library view tab ("templates" | "archive")
var __libArch = [];        // PR-AF: the last console_opps?archived=eq.true rows fetched for the Archive tab
// PR-L0: a page_publish commits to GitHub (GET sha + PUT, relay:pagePublish_ two round-trips) which routinely
// takes longer than the 6s sign-in fetch timeout. This op gets its own longer client bound so a slow-but-
// successful commit is not aborted by the client and falsely reported "could not publish".
var PAGE_PUBLISH_TIMEOUT_MS = 30000;

// ---- ported zip reader (intake.js:1052-1128), native DecompressionStream, no library --------------
function upU16(v, p){ return v[p] | (v[p+1] << 8); }
function upU32(v, p){ return (v[p] | (v[p+1] << 8) | (v[p+2] << 16) | (v[p+3] << 24)) >>> 0; }
function upInflateRaw(bytes){                                                       // intake.js:1055
  if(typeof DecompressionStream !== "function") return Promise.reject(new Error("no_inflate"));
  var ds = new DecompressionStream("deflate-raw");
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Response(stream).arrayBuffer().then(function(ab){ return new Uint8Array(ab); });
}
function upFindEOCD(v){                                                             // intake.js:1064
  for(var i = v.length - 22; i >= 0 && i > v.length - 66000; i--){ if(upU32(v, i) === 0x06054b50) return i; }
  return -1;
}
function upReadZip(arrayBuffer){                                                    // intake.js:1071
  var v = new Uint8Array(arrayBuffer);
  var eocd = upFindEOCD(v);
  if(eocd < 0) return Promise.reject(new Error("not_a_zip"));
  var count = upU16(v, eocd + 10), p = upU32(v, eocd + 16);
  var out = [], dec = new TextDecoder("utf-8");
  function step(i){
    if(i >= count || p + 46 > v.length) return Promise.resolve(out);
    if(upU32(v, p) !== 0x02014b50) return Promise.resolve(out);
    var method = upU16(v, p + 10), csize = upU32(v, p + 20);
    var nameLen = upU16(v, p + 28), extraLen = upU16(v, p + 30), commentLen = upU16(v, p + 32);
    var local = upU32(v, p + 42);
    var name = dec.decode(v.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    var skip = (/\/$/.test(name)) || (name.replace(/^.*\//, "").charAt(0) === ".") ||
               (!/\.(html?|md|txt|json)$/i.test(name)) || (upU32(v, local) !== 0x04034b50);
    if(skip) return step(i + 1);
    var dataAt = local + 30 + upU16(v, local + 26) + upU16(v, local + 28);
    var raw = v.subarray(dataAt, dataAt + csize);
    var bytesP = (method === 0) ? Promise.resolve(raw) : (method === 8) ? upInflateRaw(raw) : null;
    if(!bytesP) return step(i + 1);
    return bytesP.then(function(bytes){ out.push({ name:name, text:dec.decode(bytes) }); return step(i + 1); });
  }
  return step(0);
}
// One entry point (intake.js:1107): unpack any zip, classify html -> pages, md/txt/json -> texts.
function upReadFiles(files){
  var pages = [], texts = [], skipped = [];
  var list = Array.prototype.slice.call(files || []);
  function one(i){
    if(i >= list.length) return Promise.resolve({ pages:pages, texts:texts, skipped:skipped });
    var f = list[i], name = f.name || "";
    if(/\.zip$/i.test(name)){
      return f.arrayBuffer().then(upReadZip).then(function(inner){
        inner.forEach(function(z){
          if(/\.html?$/i.test(z.name)) pages.push({ name:z.name, html:z.text });
          else if(/\.(md|txt|json)$/i.test(z.name)) texts.push({ name:z.name, text:z.text });
          else skipped.push(z.name);
        });
        return one(i + 1);
      });
    }
    if(/\.html?$/i.test(name)) return f.text().then(function(h){ pages.push({ name:name, html:h }); return one(i + 1); });
    if(/\.(md|txt|json)$/i.test(name)) return f.text().then(function(x){ texts.push({ name:name, text:x }); return one(i + 1); });
    skipped.push(name); return one(i + 1);
  }
  return one(0);
}

// ---- ported slug + matcher (intake.js:409/434/454/468) --------------------------------------------
function upSlugify(s){                                                              // intake.js:409
  return String(s || "").toLowerCase().replace(/['’]/g, "").replace(/&/g, " and ")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
}
function upBaseName(name){ return String(name || "").replace(/^.*\//, ""); }
function upPageSlug(name){                                                          // intake.js:434
  var parts = String(name || "").split("/").filter(Boolean);
  var file = parts.length ? parts[parts.length - 1] : "";
  var base = file.replace(/\.html?$/i, "");
  if(parts.length >= 2 && /^(index|page|opp|opportunity|default|home)$/i.test(base)) return upSlugify(parts[parts.length - 2]);
  return upSlugify(base);
}
function upFirstHeading(text){ var m = String(text || "").match(/^[ \t]*#{1,6}[ \t]*(.+?)[ \t]*$/m); return m ? m[1].trim() : ""; }
function upNormTokens(s){ return upSlugify(s).split("-").filter(Boolean); }         // intake.js:454
function upRankTokens(a, b){                                                        // intake.js:455
  if(!a.length || !b.length) return { score:0, matched:0 };
  if(a.join("-") === b.join("-")) return { score:3, matched:a.length };
  var sh = a.length <= b.length ? a : b, lo = a.length <= b.length ? b : a;
  if(sh.every(function(t, i){ return lo[i] === t; })) return { score:2, matched:sh.length };
  var setA = {}, setB = {}; a.forEach(function(t){ setA[t] = 1; }); b.forEach(function(t){ setB[t] = 1; });
  var subset = a.every(function(t){ return setB[t]; }) || b.every(function(t){ return setA[t]; });
  if(subset) return { score:2, matched:Math.min(a.length, b.length) };
  var inter = 0; Object.keys(setA).forEach(function(t){ if(setB[t]) inter++; });
  var uni = Object.keys(setA).length + Object.keys(setB).length - inter;
  var j = uni ? inter / uni : 0;
  if(j >= 0.6) return { score:1, matched:inter };
  return { score:0, matched:0 };
}

// The recipient email, ALWAYS bare. The old readSendTo also set e.url = "mailto:"+em (intake.js:95); here the
// address a person reads and the console sends is the bare form, mailto stripped - the ConTh-3 mailto fix.
var UP_EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
function upEmailFrom(text){
  var s = String(text || "");
  var m = s.match(/mailto:\s*([^\s"'<>]+)/i);              // a mailto: link, if present
  var raw = m ? m[1] : ((s.match(UP_EMAIL_RE) || [])[0] || "");
  return String(raw).replace(/^\s*mailto:/i, "").trim().toLowerCase();   // strip the scheme, always
}
// Subject + body + email from one message text. Subject is a "Subject:" line, else the first heading; the
// body is the remainder with that subject line and any fenced ```json block removed. Nothing invented.
function upExtract(text){
  var s = String(text || "").replace(/\r\n/g, "\n");
  var subj = "";
  var sm = s.match(/^[ \t]*subject[ \t]*:[ \t]*(.+)$/im);
  if(sm){ subj = sm[1].trim(); s = s.replace(sm[0], ""); }
  else { subj = upFirstHeading(s); }
  var body = s.replace(/```json[\s\S]*?```/gi, "").replace(/^[ \t]*#{1,6}[ \t]*.+$/m, function(h){ return (h.trim() === "# " + subj || upFirstHeading(h) === subj) ? "" : h; });
  body = body.replace(/^\n+/, "").replace(/\s+$/, "");
  return { subject:subj, body:body, email:upEmailFrom(text) };
}
function upPretty(slug){ return String(slug || "").split("-").filter(Boolean).map(function(w){ return w.charAt(0).toUpperCase() + w.slice(1); }).join(" ") || slug; }

// ---- consolidated messages file: MANY messages in ONE file -----------------------------------------
// The device-proven BATCH13 zip carries every message + email + subject in ONE file (e.g.
// BATCH13_research_and_messages.md), not one text file per page. Each per-opportunity SECTION is a heading
// ("## 2) Hypergoat Coffee Roasters - Alexandria (Del Ray), VA"), a metadata line
// ("- **Send to:** contact@hyper-goat.com · **Subject:** The Del Ray opening, louder"), and the email
// body inside a fenced code block ("```" ... "Hi ...," ... signature ... "```"). upParseSections reads that
// structure; upBuildPlan below supports BOTH it AND the original one-file-per-page mode, auto-detecting which
// a zip uses. Robust matching: a section maps to a page slug by normalized-name similarity (the same token
// ranker), so "Hypergoat Coffee Roasters" resolves to the page slug "hypergoat-coffee".
function upSectionName(heading){
  var h = String(heading || "").replace(/^[ \t]*#{1,6}[ \t]*/, "");   // drop the leading hashes
  h = h.replace(/^\s*\d+[\).:]\s*/, "");                              // drop a leading "n)" / "n." number
  // the business name is the head of the line, before a location dash / middot / pipe / parenthesis / comma.
  // The dash class uses \u2014 (long dash) and \u2013 (mid dash) escapes so no literal long dash sits in source.
  var cut = h.split(/\s+[\u2014\u2013-]\s+|\s+\u00b7\s+|\s+\|\s+|\s*\(|,/)[0];
  return cut.replace(/[*_`]+/g, "").trim();
}
function upFenceBody(chunk){
  // the first fenced code block; drop an optional language token on the opening fence line; verbatim otherwise.
  // The [LINK] token inside the body is preserved untouched so it survives into the opp's outreach text.
  var m = String(chunk || "").match(/```[^\n]*\n([\s\S]*?)```/);
  if(!m) return "";
  return m[1].replace(/\s+$/, "");
}
function upParseSections(text){
  var s = String(text || "").replace(/\r\n/g, "\n");
  var lines = s.split("\n"), heads = [];
  lines.forEach(function(ln, i){
    var m = ln.match(/^[ \t]*(#{1,6})[ \t]+(.+?)[ \t]*$/);
    if(m) heads.push({ i:i, level:m[1].length, text:ln, numbered: /^[ \t]*#{1,6}[ \t]*\d+[\).:]/.test(ln) });
  });
  if(!heads.length) return [];
  // numbered opportunity headers ("## 2) Name") are the strongest boundary; else the shallowest heading level.
  var numbered = heads.filter(function(h){ return h.numbered; });
  var bounds = numbered.length ? numbered : heads.filter(function(h){ return h.level === heads[0].level; });
  if(!bounds.length) return [];
  var out = [];
  bounds.forEach(function(h, k){
    var end = (k + 1 < bounds.length) ? bounds[k + 1].i : lines.length;
    var chunk = lines.slice(h.i, end).join("\n");
    var fenceAt = chunk.indexOf("```");
    var meta = fenceAt >= 0 ? chunk.slice(0, fenceAt) : chunk;      // metadata lives before the fenced body
    var sendM = meta.match(/send[ \t]*to[^\n]*/i);
    var email = sendM ? upEmailFrom(sendM[0]) : "";
    var subjM = meta.match(/subject[ \t]*:?[ \t*]*([^\n]+)/i);
    var subject = subjM ? subjM[1].replace(/[*`]+/g, "").replace(/\s*·.*$/, "").trim() : "";
    var body = upFenceBody(chunk);
    var isMessage = !!(email || (body && sendM));
    out.push({ name:upSectionName(h.text), email:email, subject:subject, body:body, isMessage:isMessage });
  });
  return out;
}

// ---- upBuildPlan: the preview (read-only, nothing written) ---------------------------------------
// For each html page derive its slug. Build ONE pool of message UNITS from every text file, supporting BOTH
// structures: a consolidated file yields one unit per per-opportunity section; a plain per-page file (with a
// recipient email) is a single whole-file unit (the original mode). A text that is neither a section message
// nor an email-bearing message (a README or a market assessment) is INFORMATIONAL - surfaced by name, never
// an error. Match each page to its best unit by the token ranker, extract subject / body / bare email.
// Warnings by name in BOTH directions, so nothing is silently dropped: dup_slug (two pages one slug),
// no_message (a page that resolved no message), orphanTexts (a message that matched no page, by name),
// informational (a file that is not a per-page message). This only reads; it writes nothing.
function upBuildPlan(files){
  return upReadFiles(files).then(function(kinds){
    var pages = kinds.pages, texts = kinds.texts, seen = {}, rows = [];
    pages.forEach(function(pg){
      var slug = upPageSlug(pg.name);
      var dup = !!seen[slug]; seen[slug] = (seen[slug] || 0) + 1;
      rows.push({ slug:slug, page:pg, title:"", subject:"", body:"", email:"", text_name:"", warnings: dup ? ["dup_slug"] : [] });
    });
