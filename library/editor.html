<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Thrive · Editor</title>
<link rel="icon" href="../assets/thrive-logo.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="dns-prefetch" href="https://api.github.com">
<script>(function(){var d=document.documentElement;function lock(){d.classList.add('gate-locked')}try{if(sessionStorage.getItem('thrive_gate_v2')!=='0983eea9ab7aa4a1dea8d6015db3b63a66e67144947a7705cbab6ce91b395dc8')lock()}catch(e){lock()}/* boot failsafe: a script that never runs must not leave a blank locked page */setTimeout(function(){if(!d.classList.contains('gate-locked')||document.getElementById('thriveGate'))return;var ar=false;try{ar=localStorage.getItem('thrive_lang')==='ar'}catch(e){}var p=document.createElement('p');p.className='bootfail';p.textContent=ar?'تعذّر تشغيل الكونسول. أعد تحميل الصفحة، وتحقق من الاتصال إن تكرر الأمر.':'The console could not start. Reload the page, and check your connection if it happens again.';(document.body||d).appendChild(p)},6000)})();</script>
<script src="gate.js" defer></script>
</head>
<body>
<noscript><p class="bootfail">This console needs JavaScript to run. <span dir="rtl">يحتاج هذا الكونسول إلى تفعيل JavaScript.</span></p></noscript>
<header class="top">
  <a class="brand" href="index.html"><img src="../assets/thrive-logo.png" alt="Thrive" width="26" height="26" decoding="async"><b data-i18n="brand">Thrive Digital Solutions</b></a>
  <nav class="nav">
    <a href="console.html#board" data-i18n="nav_board">Thrive Operations</a>
    <a href="console.html#home" data-i18n="nav_insights">Insights</a>
    <a href="console.html#library" data-i18n="nav_library">Library</a>
    <a href="console.html#settings" data-i18n="nav_settings">Settings</a>
    <button id="langbtn" class="langbtn">العربية</button>
  </nav>
</header>

<main class="wrap">
  <div class="page-h"><h1 class="title" data-i18n="ed_title">Template Editor</h1></div>
  <p class="sub" data-i18n="ed_sub"></p>

  <div class="editor">
    <div class="panel">
      <div class="seg">
        <button id="mode_fill" class="on" data-i18n="mode_fill">Fill a template</button>
        <button id="mode_upload" data-i18n="mode_upload">Upload HTML</button>
      </div>

      <!-- Four groups, not twelve loose fields. Identity and Content are open because they are
           what you are here to fill in; Proof and Activation wait, because they are real and
           occasional. WO-012 §7.3: the "too many boxes" complaint is a grouping problem. -->
      <h4 class="sec-h" data-icon="edit" data-i18n="ed_g_identity">Identity</h4>
      <div class="field" id="templateField"><label for="f_template" data-i18n="f_template">Page template</label>
        <select id="f_template"><option value="en-opp1">en-opp1 · The Signal Brief (EN)</option><option value="ar-opp1">ar-opp1 · موجز الإشارة (AR)</option></select></div>
      <!-- Never ambiguous which library you are editing, and never inherited from the chrome. -->
      <div class="field"><label for="f_doclang" data-i18n="loc_doc">Document language</label>
        <select id="f_doclang"><option value="EN">English</option><option value="AR">العربية</option></select>
        <div class="hint" data-i18n="loc_doc_sub"></div></div>
      <span class="loc-badge" id="edLocBadge" hidden></span>
      <div class="field req"><label for="f_biz" data-i18n="f_biz">Business name</label><input id="f_biz" class="input" autocomplete="off"></div>
      <div class="field"><label for="f_slug" data-i18n="f_slug">Link slug</label><input id="f_slug" class="input" autocomplete="off">
        <div class="hint" data-i18n="f_slughint"></div>
        <div class="hint warn" id="slugWarn" data-i18n="slug_taken" hidden></div></div>

      <!-- Twelve fields at rest is a form you brace yourself for. What the page actually needs
           is the name, the link, the three things you built and the busier-pair. The date, the
           location, the phone and the quote are real and optional, so they wait behind one
           disclosure that counts how many of them you have filled in. -->
      <h4 class="sec-h" data-icon="check" data-i18n="ed_g_proof">Proof</h4>
      <div class="bar" style="margin:0 0 12px">
        <button class="btn ghost sm" id="edMoreBtn" aria-expanded="false" aria-controls="edMore" data-icon="filter" data-i18n="lib_more">More</button>
      </div>
      <div id="edMore" class="more-bar" hidden>
        <div class="field"><label for="f_sent" data-i18n="f_sent">Send date</label><input id="f_sent" class="input" type="date"></div>
        <div class="field"><label for="f_location" data-i18n="f_location">Location</label><input id="f_location" class="input" autocomplete="off"></div>
        <div class="field"><label for="f_phone" data-i18n="f_phone">Phone (if any)</label><input id="f_phone" class="input" autocomplete="off"></div>
        <!-- The quote and its attribution fill a template's quote slot. Upload mode hosts a
             finished page, so it never shows them (they are grouped here to hide as one). -->
        <div id="quoteFields">
          <div class="field"><label for="f_quote" data-i18n="f_quote">Quote</label><textarea id="f_quote" rows="2"></textarea>
            <div class="hint" data-i18n="f_quotehint"></div></div>
          <div class="field"><label for="f_quoteby" data-i18n="f_quoteby">Quote attribution</label><input id="f_quoteby" class="input" autocomplete="off"></div>
        </div>
      </div>

      <div id="fillFields">
        <h4 class="sec-h" data-icon="text" data-i18n="ed_g_content">Content</h4>
        <div class="field req"><label for="f_proof1" data-i18n="f_proof1">What you built · 1</label><textarea id="f_proof1" rows="2"></textarea></div>
        <div class="field req"><label for="f_proof2" data-i18n="f_proof2">What you built · 2</label><textarea id="f_proof2" rows="2"></textarea></div>
        <div class="field req"><label for="f_proof3" data-i18n="f_proof3">What you built · 3</label><textarea id="f_proof3" rows="2"></textarea></div>
        <div class="field req"><label for="f_want" data-i18n="f_want">The busier-pair</label><input id="f_want" class="input" autocomplete="off">
          <div class="hint" data-i18n="f_wanthint"></div></div>
      </div>

      <div id="uploadBox" hidden>
        <h4 class="sec-h" data-i18n="mode_upload">Upload HTML</h4>
        <p class="hint" data-i18n="up_batch_hint"></p>
        <div class="dz" id="dz" data-i18n="upload_dz">Drop a finished .html file here, or click to choose</div>
        <input id="fileInput" type="file" accept=".html,.htm,.zip,.md,.txt,text/html" multiple hidden>
        <div id="batchPanel" hidden></div>
      </div>

      <div class="note" data-i18n="help_body"></div>
    </div>

    <div class="preview">
      <h4 class="sec-h" data-icon="send" data-i18n="ed_g_publish">Activation</h4>
      <div class="bar"><span class="urlpill" id="urlpill">https://console.thriveiii.com/opp/</span></div>
      <div class="bar">
        <div class="devtoggle">
          <button data-dev="desktop" class="on" data-i18n="dev_desktop">Desktop</button>
          <button data-dev="phone" data-i18n="dev_phone">Phone</button>
        </div>
        <button class="btn ghost sm" id="openTab" data-icon="page" data-i18n="preview_open">Open</button>
        <button class="btn ghost sm" id="copyLink" data-i18n="preview_copy">Copy link</button>
      </div>
      <div class="framewrap"><iframe id="frame" class="frame" title="preview"></iframe></div>
      <div class="bar bar-actions">
        <button class="btn" id="publishBtn" data-icon="send" data-i18n="publish">Activate</button>
        <button class="btn ghost" id="saveLib" data-icon="check" data-i18n="save_lib">Save to library</button>
        <button class="btn ghost" id="dlPage" data-icon="import" data-i18n="dl_page">Download</button>
        <button class="btn ghost" id="copyManifest" data-i18n="copy_manifest">Copy manifest entry</button>
      </div>
    </div>
  </div>
</main>

<script src="icons.js" defer></script>
<script src="i18n.js" defer></script>
<script src="stage-model.js" defer></script>
<script src="kinds.js" defer></script>
<script src="store.js" defer></script>
<script src="drafts.js" defer></script>
<script src="flows.js" defer></script>
<script src="app.js" defer></script>
<script>document.addEventListener("DOMContentLoaded",function(){
  var pt=new URLSearchParams(location.search).get("t"); if(pt){ var s=document.getElementById("f_template"); if([].some.call(s.options,function(o){return o.value===pt;})) s.value=pt; }
  initLang(); initEditor();
});</script>
</body>
</html>
