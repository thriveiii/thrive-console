<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Thrive · Library</title>
<link rel="icon" href="../assets/thrive-logo.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="dns-prefetch" href="https://api.github.com">
<script>(function(){var d=document.documentElement;function lock(){d.classList.add('gate-locked')}try{if(sessionStorage.getItem('thrive_gate_v2')!=='0983eea9ab7aa4a1dea8d6015db3b63a66e67144947a7705cbab6ce91b395dc8')lock()}catch(e){lock()}/* boot failsafe: a script that never runs must not leave a blank locked page */setTimeout(function(){if(!d.classList.contains('gate-locked')||document.getElementById('thriveGate'))return;var ar=false;try{ar=localStorage.getItem('thrive_lang')==='ar'}catch(e){}var p=document.createElement('p');p.className='bootfail';p.textContent=ar?'تعذّر تشغيل الكونسول. أعد تحميل الصفحة، وتحقق من الاتصال إن تكرر الأمر.':'The console could not start. Reload the page, and check your connection if it happens again.';(document.body||d).appendChild(p)},6000)})();</script>
<script src="gate.js" defer></script>
</head>
<body>
<noscript><p class="bootfail">This console needs JavaScript to run. <span dir="rtl">يحتاج هذا الكونسول إلى تفعيل JavaScript.</span></p></noscript>
<header class="top">
  <a class="brand" href="index.html"><img src="../assets/thrive-logo.png" alt="Thrive" width="26" height="26" decoding="async"><b data-i18n="brand">Thrive Digital Solutions</b></a>
  <nav class="nav">
    <a href="console.html#board" data-i18n="nav_board">Board</a>
    <a href="console.html#home" data-i18n="nav_insights">Insights</a>
    <a href="console.html#library" class="active" data-i18n="nav_library">Library</a>
    <a href="console.html#settings" data-i18n="nav_settings">Settings</a>
    <button id="langbtn" class="langbtn">العربية</button>
    <button id="lockbtn" class="langbtn" onclick="window.thriveLock&&window.thriveLock()" data-icon="lock" data-i18n="lock_btn">Lock</button>
  </nav>
</header>

<main class="wrap">
  <div class="page-h"><h1 class="title" data-i18n="lib_title">Opportunity Library</h1></div>
  <p class="sub" data-i18n="lib_sub"></p>

  <!-- One primary path: find it, or make one. Search, the pills under it, and New
       opportunity. Sorting, filtering by template, the status list and the exports are real
       controls that are used rarely, so they wait behind one disclosure instead of competing
       with the search box for the same glance. -->
  <div class="toolbar">
    <div class="search"><span class="fieldic" data-icon="search" aria-hidden="true"></span><input id="q" type="search" data-i18n-ph="search_ph"></div>
    <a class="btn" href="editor.html" data-icon="page" data-i18n="new_opp">New opportunity</a>
    <button class="btn ghost" id="libMoreBtn" aria-expanded="false" aria-controls="libMore" data-icon="filter" data-i18n="lib_more">More</button>
  </div>

  <div id="libMore" class="more-bar" hidden>
    <select id="sort" aria-label="Sort">
      <option value="new" data-i18n="sort_new">Newest sent</option>
      <option value="old" data-i18n="sort_old">Oldest sent</option>
      <option value="az" data-i18n="sort_az">Business A-Z</option>
    </select>
    <select id="filter" aria-label="Template"><option value="all" data-i18n="filter_all">All templates</option></select>
    <select id="statusFilter" aria-label="Status">
      <option value="active" data-i18n="statusf_active">Active</option>
      <option value="followup" data-i18n="statusf_followup">Needs follow-up</option>
      <option value="archived" data-i18n="statusf_archived">Archived</option>
      <option value="all" data-i18n="statusf_all">All statuses</option>
    </select>
    <button class="btn ghost" id="exportManifest" data-icon="import" data-i18n="export_manifest">Export manifest.json</button>
    <a class="btn ghost" href="templates.html" data-icon="page" data-i18n="nav_templates">Templates</a>
    <a class="btn ghost" href="activity.html" data-icon="clock" data-i18n="nav_activity">Activity</a>
  </div>

  <div id="pipeline" class="pipeline"></div>
  <div id="grid" class="grid"></div>
</main>

<script src="icons.js" defer></script>
<script src="i18n.js" defer></script>
<script src="stage-model.js" defer></script>
<script src="lifecycle.js" defer></script>
<script src="numbers.js" defer></script>
<script src="inbound.js" defer></script>
<script src="kinds.js" defer></script>
<script src="drafts.js" defer></script>
<script src="app.js" defer></script>
<script>document.addEventListener("DOMContentLoaded",function(){ initLang(); initDashboard(); });</script>
</body>
</html>
