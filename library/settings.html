<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Thrive · Settings</title>
<link rel="icon" href="../assets/thrive-logo.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="dns-prefetch" href="https://api.github.com">
<script>(function(){try{if(sessionStorage.getItem('thrive_gate_v2')!=='0983eea9ab7aa4a1dea8d6015db3b63a66e67144947a7705cbab6ce91b395dc8')document.documentElement.classList.add('gate-locked');}catch(e){document.documentElement.classList.add('gate-locked');}})();</script>
<script src="gate.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><img src="../assets/thrive-logo.png" alt="Thrive" width="26" height="26" decoding="async"><b data-i18n="brand">Thrive Digital Solutions</b></a>
  <nav class="nav">
    <a href="index.html" data-i18n="nav_home">Overview</a>
    <a href="library.html" data-i18n="nav_library">Library</a>
    <a href="editor.html" data-i18n="nav_editor">Editor</a>
    <a href="compose.html" data-i18n="nav_compose">Email</a>
    <a href="templates.html" data-i18n="nav_templates">Templates</a>
    <a href="activity.html" data-i18n="nav_activity">Activity</a>
    <a href="settings.html" class="active" data-i18n="nav_settings">Settings</a>
    <button id="langbtn" class="langbtn">العربية</button>
    <button id="lockbtn" class="langbtn" onclick="window.thriveLock&&window.thriveLock()" data-i18n="lock_btn">Lock</button>
  </nav>
</header>

<main class="wrap">
  <div class="page-h"><h1 class="title" data-i18n="set_title">Settings</h1><span class="pill" id="ghStatus"></span></div>
  <p class="sub" data-i18n="set_sub"></p>

  <section class="panel settings-panel">
    <h3 class="block-h" data-i18n="set_gh_h">GitHub publishing</h3>
    <p class="sub" data-i18n="set_gh_sub"></p>
    <div class="grid3">
      <div class="field"><label data-i18n="gh_owner_l">Owner</label><input id="gh_owner" class="input" autocomplete="off"></div>
      <div class="field"><label data-i18n="gh_repo_l">Repository</label><input id="gh_repo" class="input" autocomplete="off"></div>
      <div class="field"><label data-i18n="gh_branch_l">Branch</label><input id="gh_branch" class="input" autocomplete="off"></div>
    </div>
    <div class="field"><label data-i18n="gh_token_l">Access token</label>
      <input id="gh_token" class="input" type="password" autocomplete="off" spellcheck="false">
      <div class="hint" data-i18n="gh_token_hint"></div></div>
    <div class="bar">
      <button class="btn" id="ghSave" data-i18n="gh_save">Save</button>
      <button class="btn ghost" id="ghTest" data-i18n="gh_test">Test connection</button>
    </div>
    <div class="gh-result" id="ghResult" hidden></div>
  </section>

  <section class="panel settings-panel">
    <h3 class="block-h" data-i18n="set_ep_h">Analytics endpoint</h3>
    <p class="sub" data-i18n="set_ep_sub"></p>
    <div class="field"><input id="ep2" class="input" type="url" data-i18n-ph="ins_endpoint_ph"></div>
    <button class="btn ghost" id="epSave2" data-i18n="ep_save">Save endpoint</button>
  </section>

  <section class="panel settings-panel">
    <h3 class="block-h" data-i18n="set_email_h">Email sending</h3>
    <p class="sub" data-i18n="set_email_sub"></p>
    <div class="grid2">
      <div class="field"><label data-i18n="set_from_name">Sender name</label><input id="em_name" class="input" autocomplete="off" placeholder="Thrive"></div>
      <div class="field"><label data-i18n="set_from_email">Sender address</label><input id="em_from" class="input" value="hi@thriveiii.com" readonly></div>
    </div>
    <div class="field"><label data-i18n="set_email_ep_l">Send endpoint</label><input id="em_ep" class="input" type="url" data-i18n-ph="set_email_ph"></div>
    <button class="btn" id="emSave" data-i18n="gh_save">Save</button>
  </section>

  <section class="panel settings-panel">
    <h3 class="block-h" data-i18n="set_sync_h">Live sync across devices</h3>
    <p class="sub" data-i18n="set_sync_sub"></p>
    <div class="field"><label data-i18n="sy_ep_l">Sync endpoint (the same relay /exec URL)</label>
      <input id="sy_ep" class="input" type="url" autocomplete="off"></div>
    <div class="bar">
      <button class="btn" id="syEnable" data-i18n="sy_enable">Save &amp; publish to all devices</button>
      <button class="btn ghost" id="syVerify" data-i18n="sy_verify">Check this URL</button>
      <button class="btn ghost" id="syNow" data-i18n="sy_now">Sync now</button>
      <button class="btn ghost" id="syPush" data-i18n="sy_push">Force push from this device</button>
    </div>
    <div class="quota-readout" id="syCounts"></div>
    <div class="gh-result" id="syStatus" hidden></div>
  </section>

  <section class="panel settings-panel">
    <h3 class="block-h" data-i18n="set_quota_h">Sending limits (Resend free tier)</h3>
    <p class="sub" data-i18n="set_quota_sub"></p>
    <div class="quota-readout" id="quotaReadout"></div>
    <div class="grid2">
      <div class="field"><label data-i18n="set_quota_daily">Daily cap</label><input id="q_daily" class="input" type="number" min="1" inputmode="numeric"></div>
      <div class="field"><label data-i18n="set_quota_monthly">Monthly cap</label><input id="q_monthly" class="input" type="number" min="1" inputmode="numeric"></div>
    </div>
    <button class="btn" id="qSave" data-i18n="gh_save">Save</button>
  </section>

  <section class="panel settings-panel">
    <h3 class="block-h" data-i18n="set_backup_h">Backup &amp; restore</h3>
    <p class="sub" data-i18n="set_backup_sub"></p>
    <div class="bar">
      <button class="btn" id="bkExport" data-i18n="bk_export">Export backup</button>
      <label class="btn ghost" for="bkFile" data-i18n="bk_import">Restore from file</label>
      <input id="bkFile" type="file" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
<script>document.addEventListener("DOMContentLoaded",function(){ initLang(); initSettings(); });</script>
</body>
</html>
