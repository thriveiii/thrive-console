<script src="gate.js" defer></script>
</head>
<body>

<!-- The Thrive Contact Book (P10): one person, one record, findable. A read-plus-curation lens over the
     ledger; the review items, tag filter and person list are rendered by initContacts. -->
<main class="wrap">
  <div class="page-h"><h1 class="title" data-i18n="contacts_title">Contact Book</h1></div>
  <p class="sub" data-i18n="contacts_sub"></p>

  <div class="toolbar cb-tools">
    <div class="search cb-search"><span class="fieldic" data-icon="search" aria-hidden="true"></span><input id="contactsSearch" type="search" autocomplete="off" data-i18n-ph="contacts_search" placeholder="Search people"></div>
    <label class="cb-sort"><span data-i18n="contacts_sort">Sort</span>
      <select id="contactsSort">
        <option value="recent" data-i18n="contacts_sort_recent">Newest activity</option>
        <option value="name" data-i18n="contacts_sort_name">Name</option>
      </select></label>
    <button class="btn ghost" id="contactsRefresh" data-icon="undo" data-i18n="ins_refresh">Refresh</button>
  </div>

  <div id="contactsTags" class="cb-tagfilter"></div>
  <div id="contactsReview"></div>
  <div id="contactsList"></div>
</main>

<script src="icons.js" defer></script>
<script src="i18n.js" defer></script>
<script src="stage-model.js" defer></script>
