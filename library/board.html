function toPlainText(html, sig){                                                             // app.js:6371
  var s = String(html||"");
  s = s.replace(/<br\s*\/?>/gi, "\n")
       .replace(/<\/(p|div|li|h[1-6])>/gi, "\n")
       .replace(/<li[^>]*>/gi, "- ")
       .replace(/<a[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi, function(_, h, txt){ var tt = String(txt).replace(/<[^>]*>/g, "").trim(); return (tt && tt!==h) ? (tt + " (" + h + ")") : h; })
       .replace(/<[^>]*>/g, "");
  s = s.replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  s = s.replace(/\n{3,}/g, "\n\n").replace(/[ \t]+\n/g, "\n").trim();
  return sig ? (s + "\n\n" + sig) : s;
}
// PLAIN-ONLY law of the new console: a clean plain message lands in inbox, not spam (Thyab's standing
// instruction). plainToHtml is the ONLY html the send carries now: a minimal, faithful mirror of the plain
// text - the text escaped, with real line breaks preserved by white-space:pre-wrap. No brandWrap, no logo,
// no inline color styling, no open pixel. Whichever part a client renders (html or text), it reads the SAME
// clean plain message: no run-on, no jammed signature, no heavy HTML.
function plainToHtml(t){
  var font = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif";
  return '<div style="white-space:pre-wrap;font-family:' + font + ';font-size:15px;line-height:1.5;color:#111">'
    + esc(String(t==null?"":t)) + '</div>';
}

// compile(recipient, content) for ONE recipient. Content is the opp RECORD's prepared message
// (console_opps.data.outreach_subject / outreach_text / sig). PLAIN-ONLY: the deliverable is the plain-text
// arm (toPlainText preserves newlines and separates the sig from the body by a blank line, then the POSTAL
// footer); the html is plainToHtml of that exact same plain text. The tokenized opp-page link (channel 2)
// stays in the text as a plain URL, so a recipient VISITING the page is recorded by beacon.js (a real
// interest signal). Channel 1 (the HTML open pixel) is removed with the heavy HTML.
function sendCompile(slug, row, data, rcpt){
  data = data || {}; rcpt = rcpt || {};
  var full = String(rcpt.name==null?"":rcpt.name).trim();
  var name = (data.firstName && full) ? full.split(/\s+/)[0] : full;
  var lang = (rcpt.lang==="ar" || data.lang==="ar") ? "ar" : "en";
  var addr = bareAddress(rcpt.addr||"");
  var ctx = { business:(row&&row.business)||data.business||"", link:liveUrl(slug), month:data.month||"" };
  var inner = mergeFieldsInto(data.outreach_text||"", name, ctx);
  var subject = mergeFieldsInto(data.outreach_subject||"", name, ctx).replace(/^\s+|\s+$/g, "");
  var sig = data.sig || "";
  var plan = planAttachments(data.attachments||[]);
  // The clean plain message: body (newlines intact) + blank line + signature + POSTAL footer. Hosted-image
  // links (if any) ride as a text block, never an html block.
  var text = toPlainText(inner, sig) + attachHostedBlockText(plan.hosted, lang) + footerText(lang);
  var token = recipientOpenToken(slug, addr, subject);       // == the console_mail row id (attribution join)
  if(token){
    var base = liveUrl(slug), tokd = base + (base.indexOf("?")<0?"?":"&") + "r=" + encodeURIComponent(token);
    text = text.split(base).join(tokd);                      // channel 2: the opp page link carries the token
  }
  var html = plainToHtml(text);                              // minimal, faithful; identical content to the plain text
  return { to:addr, name:name, subject:subject, html:html, text:text, token:token, lang:lang, attachments:plan.attach };
}

// ---- eligibility + recipient (the engine's own gate) ------------------------------------------------
function isEmail(a){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(a||"")); }
// A sighted recipient email on the opp RECORD: the engine derives recipients from data.recipients[] (app.js:1050,
// campaignRecipients). First valid email wins.
function firstRecipient(data){
  var rs = (data && Array.isArray(data.recipients)) ? data.recipients : [];
  for(var i=0;i<rs.length;i++){ var r = rs[i]||{}; var a = bareAddress(r.addr||""); if(isEmail(a)) return { addr:a.toLowerCase(), name:r.name||"", lang:r.lang||"" }; }
  return null;
}
// The engine allows a send when the opp has a prepared outreach message (has_email = console_board view line 210,
// docs/supabase-board-view.sql) and is not a closed/archived card, and a relay endpoint is configured (relaySend
// refuses with no endpoint, app.js:7426). The sighted-recipient requirement is checked at send time from the record.
function sendEligible(row){
  if(!row) return false;
  if(row.archived) return false;
  if(TRAY_STAGES.indexOf((row&&row.stage)||"")>=0) return false;   // won / lost / dropped are terminal
  if(!relayEp()) return false;
  return !!row.has_email;
}

// ---- the console_mail confirm write (supaConfirmMail shape) -----------------------------------------
// POST /rest/v1/console_mail, Prefer resolution=merge-duplicates,return=minimal, columns per supaMailRow
// (app.js:3913) via the generic upsert (supabase.js:408). Bounded + one refresh-retry, through authFetchOnce.
function confirmMail(row, retried){
  var url = URL_BASE + "/rest/v1/console_mail";
  return authFetchOnce(url, {
    method:"POST",
    headers:{ "apikey":ANON, "Authorization":"Bearer " + bearer(), "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
    cache:"no-store", body: JSON.stringify([row])
  }).then(function(r){
    if((r.res.status===401 || r.res.status===403) && !retried && session() && session().refresh_token){
      return refresh().then(function(ok){ if(ok) return confirmMail(row, true); var e=new Error("auth"); e.authRequired=true; throw e; });
    }
    if(!r.res.ok){ var e2=new Error((r.data && r.data.message) || ("HTTP " + r.res.status)); if(r.res.status===401||r.res.status===403) e2.authRequired=true; throw e2; }
    return true;
  });
}
// The relay POST, faithful to app.js:7452: text/plain body, the app.js:7446 payload shape. The response body is
// read INSIDE authFetchOnce's timeout race (the fix), so it settles even on a wedged body stream.
function relayPost(payload){
  return authFetchOnce(relayEp(), {
    method:"POST", headers:{ "Content-Type":"text/plain;charset=UTF-8" }, cache:"no-store", body: JSON.stringify(payload)
  });
}

// ---- runSend: optimistic confirm-or-revert, faithful ordering (app.js:7440-7481) --------------------
// (a) optimistic UI first (card jumps to Sent, a 'sending' pill), (b) POST to the relay, (c) ONLY on Resend
// acceptance write the console_mail server row and re-read the board from server truth, (d) on relay error /
// Resend reject / aborted body-read, revert the card and show red - never a phantom Sent (mirrors the engine's
// unsent local-only path, app.js:7458/7460/7479). A post-acceptance confirm-write failure is the engine's
// 'sending' limbo (app.js:7473): the email went out, so it is NOT reverted to unsent; the board reflects server
// truth (no phantom) and an amber 'confirming' note shows.
function runSend(slug){
  if(__writing) return; __writing = true;
  var row = findRow(slug);
  if(!row){ __writing = false; return; }
  __act[slug] = { msg:t("s_sending"), cls:"" };
  drawerActsDisabled(true);
  var snap = null;
  oppReadData(slug).then(function(data){
    var rcpt = firstRecipient(data);
    if(!rcpt) { var e0=new Error("no recipient"); e0.__kind="norecip"; throw e0; }
    if(!(data && (String(data.outreach_text||"").trim() || String(data.outreach_subject||"").trim()))){ var e1=new Error("no message"); e1.__kind="nomsg"; throw e1; }
    var art = sendCompile(slug, row, data, rcpt);
    var idem = sendIdem(slug, art.to, art.subject, art.html);          // app.js:7429 default idempotency key
    var msgid = newMessageId();                                        // app.js:7430 / :8824
    var headers = Object.assign({}, outboundHeaders(slug), { "Message-ID": msgid });   // app.js:7445
    var payload = { v:REQUIRED_RELAY_L5, from:FROM_EMAIL_L5, fromName:fromName(), to:art.to, subject:art.subject,
      html:art.html, text:art.text, idempotencyKey:idem, headers:headers, slug:slug };  // app.js:7446-7447
    if(art.attachments && art.attachments.length) payload.attachments = art.attachments; // app.js:7450
    // optimistic paint: the card shows sending at once (snapshot for a clean revert)
    snap = JSON.parse(JSON.stringify(row));
    row.stage = "sent"; row.sent_count = Number(row.sent_count||0) + 1; row.__sending = true;
    try{ renderBoard(__data); }catch(e){}
    return relayPost(payload).then(function(r){
      if(!r.res.ok){ var e2=new Error("relay " + r.res.status); e2.__kind="relay"; throw e2; }
      var d = r.data;
      if(d && d.ok===false){ var e3=new Error(d.error||"send failed"); e3.__kind="reject"; throw e3; }
      // Resend accepted. Write the server row ONLY now. id = the open token (== console_hits.data.r join target).
      var mailRow = { id:art.token, opp:slug, status:"sent", to_addr:art.to, subject:art.subject, ts:isoNow(),
        actor:currentUid(), up:Date.now(),   // Step 1: actor is the uid (currentActor()=authUid() parity), not the email
        data:{ mid:art.token, idem:idem, msgid:msgid, resend_id:(d && d.id) || "", provider:"endpoint", direction:"out" } };
      return confirmMail(mailRow).then(function(){
        return reloadBoardData().then(function(){ __writing=false; __act[slug]={ msg:t("s_sent"), cls:"ok" }; if(__drawerSlug===slug) refreshDrawer(slug); });
      }, function(){
        // email out, server write failed: the engine's 'sending' state. Reflect server truth (no phantom), amber note.
        return reloadBoardData().then(function(){ __writing=false; __act[slug]={ msg:t("s_confirming"), cls:"" }; if(__drawerSlug===slug) refreshDrawer(slug); },
                                      function(){ __writing=false; __act[slug]={ msg:t("s_confirming"), cls:"" }; if(__drawerSlug===slug) refreshDrawer(slug); });
      });
    });
  }).catch(function(e){
    __writing = false;
    if(snap){ replaceRow(slug, snap); try{ renderBoard(__data); }catch(x){} }   // revert the optimistic send (no phantom Sent)
    var kind = e && e.__kind;
    var msg = (kind==="norecip") ? t("s_no_recip") : (kind==="nomsg") ? t("s_no_msg") : (e && e.authRequired) ? t("err") : t("s_failed");
    __act[slug] = { msg:msg, cls:"bad" };
    if(__drawerSlug===slug) refreshDrawer(slug); else { try{ redInto(root, "send", new Error(t("s_failed"))); }catch(x){} }
  });
}

// ===================================================================================================
// L5.5 RECIPIENT FIELD - put a recipient email on an opp so L5's Send gate can clear. Inlined verbatim into
// library/board.html by tools/bundle.js (interpolated as a string, so its regexes need no template escaping)
// and runs inside board.html's IIFE alongside the L5 send clone (board-send.src.js). It reuses that file's
// esc, t, bareAddress, isEmail, sendEligible, oppReadData, oppPatch, isoNow, reloadBoardData, refreshDrawer,
// __drawerSlug, __writing, __act, findRow, redInto, root.
//
// The write goes through the SAME column the engine's saveDraft({slug, recipients:list}) writes: recipients
// live inside console_opps.data (supaRowFromOpp puts them there, app.js:3882-3886), and the engine's roster
// editor persists them via saveDraft (app.js:2198). board.html writes the SAME data.recipients[] via its L4
// oppPatch (PATCH console_opps {data}), so the row the L5 gate reads (campaignRecipients / firstRecipient,
// app.js:1050) is byte-identical to an engine-written one. No new column, no new write path.
// ===================================================================================================

// The email the opp already knows, from its own R11 contact model. Mirrors contactChannels / primaryEmailChannel
// (app.js:12675-12684): channels[] (the source of truth) first, then the legacy channel.to / data.email mirror
// (seeded at intake.js:626/631). Returns "" when the opp carries no email anywhere - the field then starts empty.
function knownEmail(data){
  data = data || {};
  if(Array.isArray(data.channels)){
    var prim = data.channels.filter(function(c){ return c && c.primary && c.type==="email" && c.value; })[0];
    var any  = data.channels.filter(function(c){ return c && c.type==="email" && c.value; })[0];
    var pick = prim || any;
    if(pick) return bareAddress(pick.value);
  }
  var c = data.channel || {};
  if(c.kind==="email" && c.to) return bareAddress(c.to);
  if(data.email) return bareAddress(data.email);
  if(/@/.test(String(c.to||""))) return bareAddress(c.to);
  return "";
}
// The addresses already saved on the opp (data.recipients[]), the exact field the L5 gate reads.
function recipientAddrs(data){
  var rs = (data && Array.isArray(data.recipients)) ? data.recipients : [];
  return rs.map(function(r){ return bareAddress((r && r.addr) || ""); }).filter(Boolean);
}
// The field's pre-fill: the saved recipients if any, else the known email as an editable SUGGESTION (not saved).
function recipientPrefill(data){
  var ex = recipientAddrs(data);
  if(ex.length) return ex.join(", ");
  return knownEmail(data);
}
// Parse one or more addresses, comma / newline / semicolon separated (single AND future group send).
function parseAddrs(text){
  return String(text||"").split(/[\n,;]+/).map(function(s){ return bareAddress(s).toLowerCase(); }).filter(Boolean);
}

var __recSaved = {};   // per-slug transient "Saved." status, rendered on each drawer paint (survives the enrichment re-render)

function recipientHtml(slug, row, detail){
  if(!sendEligible(row)) return "";                    // only where Send is offered (has_email, not closed, endpoint set)
  var data = (detail && detail.opp && detail.opp.data) || null;
  var val = data ? recipientPrefill(data) : "";
  var st = __recSaved[slug] || {};
  return '<div class="dw-sec"><h3>'+esc(t("r_h"))+'</h3>'+
    '<textarea class="rec-in mono-iso" id="recIn" rows="1" dir="ltr" autocomplete="off" spellcheck="false" '+
      'placeholder="'+esc(t("r_ph"))+'" aria-label="'+esc(t("r_h"))+'">'+esc(val)+'</textarea>'+
    '<div class="acts"><button class="act send" id="recSave" type="button">'+esc(t("r_save"))+'</button></div>'+
    '<div class="act-status'+(st.cls?(" "+st.cls):"")+'" id="recStatus">'+esc(st.msg||"")+'</div></div>';
}

function setRecStatus(msg, cls){ var el=document.getElementById("recStatus"); if(el){ el.className="act-status"+(cls?(" "+cls):""); el.textContent=msg||""; } }

// Write data.recipients[] via the board's bounded oppPatch (same column as the engine's saveDraft), then read
// back to confirm it persisted. Each address becomes {addr,name,lang} - the exact shape campaignRecipients /
// firstRecipient reads (app.js:1050). Settles either way (authFetchOnce race); no storage touched.
function saveRecipients(slug, list){
  return oppReadData(slug).then(function(data){
    var next = Object.assign({}, data, { recipients: list });
    return oppPatch(slug, { data: next, up: Date.now() }).then(function(){
      return oppReadData(slug).then(function(d2){                       // read-back confirm
        var got = (d2 && Array.isArray(d2.recipients)) ? d2.recipients : [];
        if(got.length < list.length){ throw new Error("recipients did not persist"); }
        return got;
      });
    });
  });
}

// Optimistic confirm-or-revert, same discipline as L4/L5. Validate first (an @ and a dotted domain); reject empty
// or malformed with red and NO write. On success re-read the board (server truth), so L5's Send gate reads the
// saved recipient on its next tap with no manual reload, and any stale L5 "no recipient" red is cleared.
function onSaveRecipient(slug){
  var input = document.getElementById("recIn"); if(!input) return;
  var addrs = parseAddrs(input.value); setRecStatus("", "");
  if(!addrs.length){ setRecStatus(t("r_empty"), "bad"); return; }
  var bad = addrs.filter(function(a){ return !isEmail(a); });
  if(bad.length){ setRecStatus(t("r_bad"), "bad"); return; }
  if(__writing) return; __writing = true;
  setRecStatus(t("r_saving"), ""); var btn=document.getElementById("recSave"); if(btn) btn.disabled=true;
  var list = addrs.map(function(a){ return { addr:a, name:"", lang:"" }; });
  saveRecipients(slug, list).then(function(){
    return reloadBoardData();
  }).then(function(){
    __writing = false;
    if(__act[slug] && __act[slug].cls==="bad"){ delete __act[slug]; }    // clear a stale L5 "no recipient email" red
    __recSaved[slug] = { msg:t("r_saved"), cls:"ok" };
    if(__drawerSlug===slug) refreshDrawer(slug);
  }).catch(function(e){
    __writing = false; var b2=document.getElementById("recSave"); if(b2) b2.disabled=false;
    setRecStatus((e && e.authRequired) ? t("err") : t("r_failed"), "bad");
  });
}

// ===================================================================================================
// UNIFIED MESSAGE EDITOR (compose + reply) - net-new on board.html (EDITOR_EVIDENCE 2: no compose surface
// exists today; the L5 send refuses when data.outreach_subject/outreach_text are both empty, board.html
// gate). Inlined verbatim into library/board.html by tools/bundle.js (interpolated as a string, so no
// template escaping; this file therefore uses NO backticks and NO dollar-brace). Runs inside board.html's
// IIFE alongside the L5 send clone (board-send.src.js) and the L5.5 recipient field (board-recipient.src.js),
// reusing their scope: esc, t, oppReadData, oppPatch, sendCompile, firstRecipient, liveUrl, MF_LINK,
// bareAddress, isEmail, findRow, refreshDrawer, reloadBoardData, __drawerSlug, __writing, __act, root,
// and window.__thriveIdentity (Step 2 identity).
//
// WHAT IT DOES (one surface for both first compose and reply):
//   * subject input + body textarea (textarea so newlines are real, the L5.5 lesson), pre-filled from the
//     opp record (data.outreach_subject / data.outreach_text) or empty.
//   * signature from RUNTIME identity: content.sig = name + ", " + title (name alone if no title; nothing if
//     no name, never invented). Written to data.sig so compile()/sendCompile place it via brandWrap exactly
//     where the send renders the closing (EDITOR_EVIDENCE 1 + 5).
//   * the opp link inserted as the LINK merge token (MF_LINK, built by concatenation), which sendCompile
//     tokenizes to liveUrl(slug) = console.thriveiii.com/opp/<slug> (EDITOR_EVIDENCE 3); never a hardcoded URL.
//   * a live preview compiled by the SAME sendCompile the send path uses, so preview == send (no
//     false-success gap): the preview iframe html is byte-identical to what runSend would POST.
//   * debounced auto-save to data.outreach_subject/outreach_text/sig via the bounded oppPatch (same shape
//     as L4/2B/L5.5 writes), optimistic confirm-or-revert with a visible red on failure and NEVER a phantom
//     save. No forced value reset on each keystroke, so the native textarea undo stack is preserved (ConTh 4).
//   * a light pre-send checklist (subject / body / recipient / link). The Send button is greyed while the
//     MESSAGE is incomplete (subject/body/link); the RECIPIENT check is shown but stays enforced by the
//     existing runSend gate (its red refusal is the tested backstop), so this pre-flight never walls off the
//     send path. Reply carries the opp's slug for free: the editor is bound to one slug and runSend(slug)
//     stamps outboundHeaders(slug) Reply-To hi+<slug> (EDITOR_EVIDENCE 4), never a campaign.
//   * Send itself is UNCHANGED: the editor only prepares subject/body/sig/link on the record; the actual
//     send is the existing L5 single-recipient path (runSend). No fork, no duplicate send logic.
// ===================================================================================================

var __edT = {};        // per-slug debounce timer id
var __edSaving = false; // editor's own in-flight guard (separate from the shared __writing send/note lock)
var __edBase = {};      // per-slug base data jsonb (non-message fields), captured at render for the preview compile
var __edStat = {};      // per-slug transient save status {msg,cls}, re-rendered on each drawer paint

// The editor renders for any editable opp: not archived, not a terminal tray declaration (won/lost/dropped).
// It deliberately does NOT require has_email, so an opp with NO prepared message can be given one from the
// board, flipping the L5 gate on the next reload. Sent/replied/live/draft all show it (reply is just a new
// compose on the same slug).
function editorEligible(row){
  if(!row) return false;
  if(row.archived) return false;
  if(TRAY_STAGES.indexOf((row&&row.stage)||"")>=0) return false;
  return true;
}

// The signature, from runtime identity ONLY (never the record's stale sig). name + ", " + title; name alone
// if the title is unset; "" if the name is unset (never invented). This is the exact string compile places.
function edIdentity(){ try{ return window.__thriveIdentity || {}; }catch(e){ return {}; } }
function edSignature(){
  var id = edIdentity();
  var name = String(id.name==null?"":id.name).trim();
  var title = String(id.title==null?"":id.title).trim();
  if(!name) return "";
  return title ? (name + ", " + title) : name;
}

function edVal(id){ var el=document.getElementById(id); return el ? String(el.value||"") : ""; }
// The link is present when the body carries the merge token OR an already-tokenized/literal opp URL.
function edHasLink(slug, body){
  var b = String(body||"");
  if(b.indexOf(MF_LINK) >= 0) return true;
  try{ if(b.indexOf(liveUrl(slug)) >= 0) return true; }catch(e){}
  return false;
}
// The Send-disable gate covers ONLY what the editor exclusively owns and what makes an opp sendable at all:
// a non-empty subject AND body. The link and the recipient are shown in the checklist as pass states, but
// they are NOT part of the disable gate: the recipient has its own field and runSend's red refusal is the
// tested backstop, and a prepared message may legitimately carry the page link in an already-tokenized form.
// Gating only on subject+body keeps the pre-flight light (never a wall) and never disables Send for an opp
// that already has a message, so the existing send-gate paths stay clickable.
function edMessageReady(slug){
  return !!(edVal("edSubj").trim() && edVal("edBody").trim());
}

// Build the data jsonb the preview/send compiles from: the captured base overlaid with the LIVE subject,
// body, and the identity signature. edCompileFrom then runs the SAME sendCompile the send path uses, so the
// preview html equals the send payload html for identical inputs.
function edLiveData(slug){
  var base = __edBase[slug] || {};
  return Object.assign({}, base, { outreach_subject:edVal("edSubj"), outreach_text:edVal("edBody"), sig:edSignature() });
}
function edCompileFrom(slug, data){
  var row = findRow(slug) || { slug:slug, business:(data&&data.business)||"" };
  var rcpt = firstRecipient(data) || { addr:"", name:"", lang:"" };
  return sendCompile(slug, row, data, rcpt);          // the send path's own compiler (EDITOR_EVIDENCE 1)
}

// The editor surface. Placed just before the recipient field and the Send action in the drawer, so compose
// -> recipient -> send read top to bottom. Pre-fills from the record; empty for a fresh compose.
function editorHtml(slug, row, detail){
  if(!editorEligible(row)) return "";
  var data = (detail && detail.opp && detail.opp.data) || null;
  __edBase[slug] = data || __edBase[slug] || {};       // capture base for the preview compile (enrich paint sets it)
  var subj = data ? String(data.outreach_subject||"") : (edVal("edSubj"));
  var body = data ? String(data.outreach_text||"") : (edVal("edBody"));
  var hasRecip = data ? !!firstRecipient(data) : false;
  var st = __edStat[slug] || {};
  var ck = function(id, ok, key){
    return '<li class="ed-ck '+(ok?"ck-ok":"ck-no")+'" id="'+id+'">'+esc(t(key))+'</li>';
  };
  var subjOk = !!subj.trim(), bodyOk = !!body.trim(), linkOk = edHasLink(slug, body);
  return '<div class="dw-sec ed-sec"><h3>'+esc(t("ed_h"))+'</h3>'+
    '<input class="ed-subj" id="edSubj" type="text" autocomplete="off" spellcheck="true" '+
      'placeholder="'+esc(t("ed_subj_ph"))+'" aria-label="'+esc(t("ed_subj"))+'" value="'+esc(subj)+'">'+
    '<textarea class="rec-in ed-body" id="edBody" rows="6" autocomplete="off" spellcheck="true" '+
      'placeholder="'+esc(t("ed_body_ph"))+'" aria-label="'+esc(t("ed_body"))+'">'+esc(body)+'</textarea>'+
    '<div class="acts"><button class="act" id="edLink" type="button">'+esc(t("ed_link"))+'</button></div>'+
    '<ul class="ed-checks">'+
      ck("ckSubj", subjOk, "ed_ck_subj")+ck("ckBody", bodyOk, "ed_ck_body")+
      ck("ckRecip", hasRecip, "ed_ck_recip")+ck("ckLink", linkOk, "ed_ck_link")+
    '</ul>'+
    '<div class="ed-sig"><span class="ed-sig-lab">'+esc(t("ed_sig"))+'</span> <bdi>'+esc(edSignature()||t("none"))+'</bdi></div>'+
    '<div class="ed-prev-h">'+esc(t("ed_preview"))+'</div>'+
    '<iframe class="ed-preview" id="edPreview" title="'+esc(t("ed_preview"))+'" sandbox="" referrerpolicy="no-referrer" srcdoc=""></iframe>'+
    '<div class="act-status'+(st.cls?(" "+st.cls):"")+'" id="edStatus">'+esc(st.msg||"")+'</div></div>';
}

function edSetStatus(slug, msg, cls){
  __edStat[slug] = { msg:msg||"", cls:cls||"" };
  var el=document.getElementById("edStatus"); if(el){ el.className="act-status"+(cls?(" "+cls):""); el.textContent=msg||""; }
}
// Re-mark the four check items from the LIVE values (no value reset, so undo is untouched). Recipient is not
// re-derived on keystroke (it changes only via the recipient field, which reloads the drawer).
function edRefreshChecks(slug){
  var set=function(id, ok){ var el=document.getElementById(id); if(el) el.className="ed-ck "+(ok?"ck-ok":"ck-no"); };
  set("ckSubj", !!edVal("edSubj").trim());
  set("ckBody", !!edVal("edBody").trim());
  set("ckLink", edHasLink(slug, edVal("edBody")));
  var sigEl=document.querySelector(".ed-sig bdi"); if(sigEl) sigEl.textContent = edSignature() || t("none");
}
// Grey the Send button while the MESSAGE is incomplete (subject/body/link). Recipient stays enforced by
// runSend, so the no-recipient refusal remains a live, clickable path.
function edApplyGate(slug){
  var b=document.querySelector('#drawer .act[data-act="send"]');
  if(b) b.disabled = !edMessageReady(slug);
}
// Recompile the preview from the LIVE values, through the send path's own sendCompile, and show it. The
// srcdoc html is byte-identical to what runSend would POST for the same record (proven by edCompileFrom
// reusing sendCompile). Best-effort: a compile hiccup never throws into the editor.
function edRenderPreview(slug){
  try{
    var art = edCompileFrom(slug, edLiveData(slug));
    var f=document.getElementById("edPreview"); if(f) f.setAttribute("srcdoc", art.html);
  }catch(e){}
}
function edTick(slug){ edRefreshChecks(slug); edApplyGate(slug); edRenderPreview(slug); }

// Insert the opp-link token at the cursor via execCommand, which PRESERVES the native undo stack (ConTh 4).
// Falls back to a splice + manual input event if execCommand is unavailable.
function edInsertLink(slug){
  var el=document.getElementById("edBody"); if(!el) return;
  el.focus();
  var token=MF_LINK, ok=false;
  try{ ok=document.execCommand("insertText", false, token); }catch(e){ ok=false; }
  if(!ok){
    var s=el.selectionStart==null?el.value.length:el.selectionStart, e2=el.selectionEnd==null?el.value.length:el.selectionEnd;
    el.value = el.value.slice(0,s) + token + el.value.slice(e2);
    var pos=s+token.length; try{ el.selectionStart=el.selectionEnd=pos; }catch(_){}
    try{ el.dispatchEvent(new Event("input", { bubbles:true })); }catch(_){}
  }
  edTick(slug); edScheduleSave(slug, 300);
}

function edScheduleSave(slug, delay){
  if(__edT[slug]) clearTimeout(__edT[slug]);
  __edT[slug] = setTimeout(function(){ __edT[slug]=null; edSaveNow(slug); }, delay||700);
}
// Bounded, optimistic confirm-or-revert save. The textarea IS the optimistic state; on a CONFIRMED write we
// show green (never a phantom "Saved" without persistence); on failure we show red and leave the operator's
// text intact (reverting it would lose typing). Never fights the shared send/note lock: if one is in flight,
// reschedule shortly so the text is never dropped. On the FIRST message that makes an opp sendable, reload
// the board once so the L5 gate flips and Send appears; ongoing edits do not reload (undo preserved).
function edSaveNow(slug){
  if(__drawerSlug!==slug) return;
  var subjEl=document.getElementById("edSubj"), bodyEl=document.getElementById("edBody");
  if(!subjEl || !bodyEl) return;
  if(__writing || __edSaving){ edScheduleSave(slug, 500); return; }
  __edSaving = true;
  var subj=String(subjEl.value||""), body=String(bodyEl.value||""), sig=edSignature();
  edSetStatus(slug, t("a_saving"), "");
  oppReadData(slug).then(function(data){
    var wasEmpty = !(String(data.outreach_subject||"").trim() || String(data.outreach_text||"").trim());
    var nowHas = !!(subj.trim() || body.trim());
    var next = Object.assign({}, data, { outreach_subject:subj, outreach_text:body, sig:sig });
    return oppPatch(slug, { data:next, up:Date.now() }).then(function(){
      __edSaving = false;
      __edBase[slug] = next;                                   // keep the preview base in sync with the persisted record
      var row = findRow(slug);
      var reveal = wasEmpty && nowHas && row && !row.has_email; // first message: flip the L5 gate so Send appears
      if(reveal){
        return reloadBoardData().then(function(){ edSetStatus(slug, t("a_saved"), "ok"); if(__drawerSlug===slug) refreshDrawer(slug); },
                                     function(){ edSetStatus(slug, t("a_saved"), "ok"); });
      }
      edSetStatus(slug, t("a_saved"), "ok"); edRenderPreview(slug);
    });
  }).catch(function(e){
    __edSaving = false;
    edSetStatus(slug, (e && e.authRequired) ? t("err") : t("a_failed"), "bad");   // red, no phantom save; text kept
  });
}

// Wire the editor after each drawer paint (called from wireDrawer). Input listeners update the checklist,
// the Send gate, and the live preview, then debounce a save. No value is ever reset here, so undo is intact.
function wireEditor(slug){
  var subjEl=document.getElementById("edSubj"), bodyEl=document.getElementById("edBody");
  if(!subjEl && !bodyEl) return;
  var onInput=function(){ edTick(slug); edScheduleSave(slug, 700); };
  if(subjEl) subjEl.addEventListener("input", onInput);
  if(bodyEl) bodyEl.addEventListener("input", onInput);
  var lk=document.getElementById("edLink"); if(lk) lk.addEventListener("click", function(){ edInsertLink(slug); });
  edTick(slug);                                                // initial checklist + gate + preview
}

// Read-only hooks for later steps and board_editor_test:
//   __thriveComposeArtifact(slug): the artifact compiled from the PERSISTED record, byte-identical to what
//     runSend compiles before it POSTs (oppReadData -> firstRecipient -> sendCompile), so preview == send.
//   __thriveReplyTo(slug): the Reply-To the send stamps, proving a reply carries the opp slug (never a campaign).
try{
  window.__thriveComposeArtifact = function(slug){ return oppReadData(slug).then(function(data){ return edCompileFrom(slug, data); }); };
  window.__thriveReplyTo = function(slug){ try{ return outboundHeaders(slug)["Reply-To"]; }catch(e){ return ""; } };
  window.__thriveEditorSignature = function(){ return edSignature(); };
}catch(e){}

  function normFrom(s){ return String(s==null?"":s).trim().toLowerCase(); }
  // One resolver, linked-everywhere-or-nowhere (§3): a reply belongs to a card ONLY by its stored resolved opp
  // (the server attributed it on write); auto-replies and bounces move no card; dedup by sender keeping the
  // earliest, sort, number 1..N. An unattributed human reply is inbox backlog (feeds the inbound-health pill).
  function buildReplies(inbound){
    var byOpp={}, waiting=0;
    (Array.isArray(inbound)?inbound:[]).forEach(function(r){ try{
      r=r||{}; var data=r.data||{};
      if(r.kind==="auto" || r.bounce) return;
      var opp=r.opp||"";
      if(!opp){ waiting++; return; }
      var from=normFrom(data.from||r.from), ts=String(r.ts||data.ts||"");
      var g=byOpp[opp]||(byOpp[opp]={});
      var key=from||("_"+ts);
      // Keep a snippet for the L3 drawer thread (never changes the count/numbering; still one resolver).
      if(!g[key] || ts < g[key].ts) g[key]={ from:from, ts:ts, subject:(data.subject||""), snippet:(data.snippet||data.body||data.text||"") };
    }catch(e){} });
    var count={}, list={};
    Object.keys(byOpp).forEach(function(slug){
      var items=Object.keys(byOpp[slug]).map(function(k){ return byOpp[slug][k]; }).sort(function(a,b){ return a.ts<b.ts?-1:(a.ts>b.ts?1:0); });
      items.forEach(function(it,i){ it.num=i+1; });
      count[slug]=items.length; list[slug]=items;
    });
    return { count:count, list:list, waiting:waiting };
  }
  // new-activity (paintCardBadges spirit): per-card last-seen last_activity_ts, device-local. A card is "new"
  // only if it was seen before AND its activity is newer; a first view marks nothing new.
  function readSeen(){ try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}")||{}; }catch(e){ return {}; } }
  function writeSeen(m){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify(m||{})); }catch(e){} }
  function countUpAll(){
    try{
      var els=root.querySelectorAll("[data-countup]");
      [].forEach.call(els, function(el){
        var to=Number(el.getAttribute("data-countup"))||0, dur=520, t0=null;
        if(to<=0){ el.textContent="0"; return; }
        function step(ts){ if(t0===null) t0=ts; var p=Math.min(1,(ts-t0)/dur); el.textContent=String(Math.round(p*to)); if(p<1) requestAnimationFrame(step); else el.textContent=String(to); }
        requestAnimationFrame(step);
      });
    }catch(e){}
  }

  // ---- views (localized; a lang toggle sits on the sign-in card and in the board header) ----
  var VIEW = "signin", __data = null;
  function langBtn(){ return '<button class="link" id="langBtn" type="button">' + esc(langLabel()) + '</button>'; }
  function rerender(){ if(VIEW==="board" && __data){ renderBoard(__data); } else if(VIEW==="board"){ loadBoard(); } else { signinView(); } }

  function signinView(){
    VIEW="signin"; applyLang();
    root.innerHTML =
      '<div class="signin">' +
      '<h1>' + esc(t("title")) + '</h1>' +
      '<p>' + esc(t("sub")) + '</p>' +
      '<input id="em" type="email" autocomplete="username" spellcheck="false" placeholder="' + esc(t("email")) + '">' +
      '<input id="pw" type="password" autocomplete="current-password" placeholder="' + esc(t("pass")) + '">' +
      '<button id="go" class="primary" type="button">' + esc(t("go")) + '</button>' +
      '<div id="siErr"></div>' +
      '<p style="margin:14px 0 0">' + langBtn() + '</p>' +
      '</div>';
    var em=document.getElementById("em"), pw=document.getElementById("pw"), go=document.getElementById("go"), er=document.getElementById("siErr");
    var lb=document.getElementById("langBtn"); if(lb) lb.addEventListener("click", toggleLang);
    setTimeout(function(){ try{ em.focus(); }catch(e){} }, 40);
    function submit(){
      er.innerHTML="";
      var e=(em.value||"").trim(), p=pw.value||"";
      if(!e || !p){ redInto(er, "sign-in", new Error(t("fill"))); return; }
      go.disabled=true; go.textContent=t("busy");
      signIn(e, p).then(function(){ loadBoard(); })
        .catch(function(ex){
          go.disabled=false; go.textContent=t("go"); er.innerHTML="";
          var kind=(ex&&ex.kind)||"auth";
          redInto(er, "sign-in", new Error((kind==="timeout"||kind==="network"||kind==="unavailable") ? t("net") : t("err")));
        });
    }
    go.addEventListener("click", submit);
    pw.addEventListener("keydown", function(ev){ if(ev.key==="Enter") submit(); });
  }

  // Operator chip (signed-in email) + language toggle + refresh + sign-out.
  function headerHtml(){
    return '<div class="top" style="padding:8px 2px">' +
      '<span class="muted" id="opChip">' + esc(authEmail()) + '</span>' +
      '<span class="row-actions">' + langBtn() +
        // Step 2D: the Admin executive surface is a SEPARATE header entry, hidden by default and revealed only
        // for an owner. isOwner() resolves async (loadIdentity), so paintAdminSlot() runs both now and again
        // from finishIdentity once the role settles. A member never sees this control, and openAdmin() is a
        // no-op for a non-owner besides, so the real gate stays the RLS policy on the write.
        '<button class="link" id="adminBtn" type="button" hidden>' + esc(t("adm_open")) + '</button>' +
        '<button class="link" id="profileBtn" type="button">' + esc(t("pf_open")) + '</button>' +
        '<button class="link" id="reload" type="button">' + esc(t("refresh")) + '</button>' +
        '<button class="link" id="signout" type="button">' + esc(t("signout")) + '</button>' +
      '</span></div>';
  }
  // Reveal the Admin entry only for an owner. Safe to call repeatedly (idempotent) and before the role settles.
  function paintAdminSlot(){
    var ab=document.getElementById("adminBtn"); if(!ab) return;
    var owner=false; try{ owner = (typeof isOwner==="function") && isOwner(); }catch(e){}
    ab.hidden = !owner;
  }
  try{ window.__thrivePaintAdminSlot = paintAdminSlot; }catch(e){}
  function wireHeader(){
    var lb=document.getElementById("langBtn"); if(lb) lb.addEventListener("click", toggleLang);
    var ab=document.getElementById("adminBtn"); if(ab) ab.addEventListener("click", function(){ openAdmin(); });   // Step 2D
    var pb=document.getElementById("profileBtn"); if(pb) pb.addEventListener("click", function(){ openProfile(); });   // Step 2B
    var rl=document.getElementById("reload"); if(rl) rl.addEventListener("click", function(){ loadBoard(); });
    var so=document.getElementById("signout"); if(so) so.addEventListener("click", function(){ signOut().then(signinView); });
    paintAdminSlot();
  }

  // Bucket by the SERVER stage only (never derived here). Domain law: a REPLIED opp is a terminal-success story
  // and stays in Replied even once archived - archiving is end-of-conversation, NOT exclusion, so it must never
  // subtract from the replied stage count. Every OTHER archived opp (and won/lost/dropped) belongs to the tray;
  // the archived tray is rebuilt separately below from the archived flag, so a replied+archived opp shows in BOTH
  // its Replied lane and the closed shelf. "other" must end empty.
  function laneOf(row){
    var st=(row && row.stage) || "";
    if(st==="replied") return "replied";
    if(row && row.archived) return "tray";
    if(BOARD_LANES.indexOf(st)>=0) return st;
    if(TRAY_STAGES.indexOf(st)>=0) return "tray";
    return "other";
  }
  // A card. The NAME (business) is shown in BOTH languages, never the slug (the slug is only a last resort when
  // an opp has no business at all). Counts/opens/idle and the reply N-badge come from the server; no stage math.
  function cardHtml(row){
    row = row || {};
    var slug = row.slug || "";
    var biz = esc(row.business || row.slug || t("unnamed"));
    var isNew = (__seen && (slug in __seen)) && (String(row.last_activity_ts||"") > String(__seen[slug]||""));
    var rc = (__reps && __reps.count && __reps.count[slug]) || 0;
    var bits = [];
    var sc = Number(row.sent_count||0), oc = Number(row.open_count||0);
    if(sc) bits.push(sc + " " + t(sc===1 ? "b_send" : "b_sends"));
    if(oc) bits.push(oc + " " + t(oc===1 ? "b_open" : "b_opens"));
    if(row.idle_days!=null && row.idle_days!=="") bits.push(row.idle_days + t("b_idle"));
    var badges = "";
    if(row.has_page)  badges += '<span class="badge">' + esc(t("bg_page")) + '</span>';
    if(row.has_email) badges += '<span class="badge">' + esc(t("bg_email")) + '</span>';
    if(row.archived)  badges += '<span class="badge">' + esc(t("bg_archived")) + '</span>';
    var nb  = rc ? ' <span class="nbadge" title="' + esc(t("b_replies")) + '">' + rc + '</span>' : '';
    var dot = isNew ? '<span class="newdot" aria-hidden="true"></span>' : '';
    var sendmark = row.__sending ? '<span class="sendmark">' + esc(t("s_sending")) + '</span>' : '';   // L5 optimistic send-in-flight
    var reps = "";
    if(rc && __reps.list && __reps.list[slug]){
      // reply grouping (replyGroupHtml spirit): numbered repliers 1..N, the same count as the N-badge.
      reps = '<div class="reps">' + __reps.list[slug].map(function(it){
        return '<div class="rep"><span class="repn">' + it.num + '</span> ' + esc(it.from || t("unnamed")) + '</div>';
      }).join("") + '</div>';
    }
    return '<div class="card" data-slug="' + esc(slug) + '" role="button" tabindex="0">' + dot +
           '<div class="b">' + biz + nb + '</div>' +
           (bits.length ? ('<div class="s">' + esc(bits.join("  \u00b7  ")) + '</div>') : '') +
           (badges || sendmark ? ('<div>' + sendmark + badges + '</div>') : '') +
           reps +
           '</div>';
  }
  // ---- L3 opportunity detail drawer (read-only): open and view; no edit/send/archive. Cloned from the engine
  //      card modal (Overview + the reply thread + the activity trail). The board stays mounted underneath; the
  //      drawer is an overlay, so Close returns to the board with NO reload. ----
  function fmtWhen(ts){ ts=String(ts||""); if(!ts) return ""; return ts.replace("T"," ").replace(/\.\d+.*$/,"").replace(/Z$/,"").trim(); }
  function numsHtml(row, slug){
    var sc=Number(row.sent_count||0), oc=Number(row.open_count||0), rc=(__reps.count&&__reps.count[slug])||0;
    function n(k,v,src){ return '<div class="dw-num"><div class="k">'+v+'</div><div class="l">'+esc(t(k))+'</div><div class="src">'+esc(src)+'</div></div>'; }
    return '<div class="dw-sec"><h3>'+esc(t("d_signals"))+'</h3><div class="dw-nums">'+
      n("n_sent",sc,t("src_mail"))+n("n_opens",oc,t("src_hits"))+n("n_replies",rc,t("src_inbound"))+'</div></div>';
  }
  function factsHtml(row){
    function yn(b){ return b ? t("d_present") : t("d_absent"); }
    var idle = (row.idle_days!=null && row.idle_days!=="") ? String(row.idle_days) : "-";
    return '<div class="dw-sec"><h3>'+esc(t("d_channels"))+'</h3><dl class="dl">'+
      '<dt>'+esc(t("d_email_l"))+'</dt><dd>'+esc(yn(row.has_email))+'</dd>'+
      '<dt>'+esc(t("d_page_l"))+'</dt><dd>'+esc(yn(row.has_page))+'</dd>'+
      '<dt>'+esc(t("d_idle_l"))+'</dt><dd>'+esc(idle)+'</dd></dl></div>';
  }
  // The reply thread is the HEART. Inbound replies come from the ONE resolver (__reps.list[slug]) - the SAME list
  // and numbering as the card badge and the header count (§3 linked-everywhere-or-nowhere). The Thrive->prospect
  // outbound sends (context) come from the best-effort console_mail read; they never change the reply count.
  function threadHtml(slug, detail){
    var list = (__reps.list && __reps.list[slug]) ? __reps.list[slug] : [];
    var rc = (__reps.count && __reps.count[slug]) || 0;
    var items = [];
    if(detail && detail.mail) detail.mail.forEach(function(m){ m=m||{}; var d=m.data||{}; items.push({ dir:"out", ts:String(m.ts||d.ts||""), subject:(d.subject||m.subject||""), who:t("d_you") }); });
    list.forEach(function(it){ items.push({ dir:"in", ts:String(it.ts||""), num:it.num, from:it.from, subject:it.subject, snip:it.snippet }); });
    items.sort(function(a,b){ return a.ts<b.ts?-1:(a.ts>b.ts?1:0); });
    var bubbles = items.map(function(m){
      if(m.dir==="in"){
        return '<div class="msg in" data-in="1"><div class="mh"><span class="mnum">#'+m.num+'</span><span class="maddr">'+esc(m.from||t("unnamed"))+'</span></div>'+
          (m.subject?'<div class="msubj">'+esc(m.subject)+'</div>':'')+
          (m.snip?'<div class="msnip">'+esc(m.snip)+'</div>':'')+
          '<div class="mwhen">'+esc(fmtWhen(m.ts))+'</div></div>';
      }
      return '<div class="msg out"><div class="mh"><span class="mwho">'+esc(m.who)+'</span></div>'+
        (m.subject?'<div class="msubj">'+esc(m.subject)+'</div>':'')+
        '<div class="mwhen">'+esc(fmtWhen(m.ts))+'</div></div>';
    }).join("");
    var body = rc===0 ? ('<div class="empty">'+esc(t("d_no_thread"))+'</div>'+bubbles) : bubbles;
    return '<div class="dw-sec"><h3>'+esc(t("d_thread"))+' <span class="nbadge" data-threadn="1">'+rc+'</span></h3><div class="thread">'+body+'</div></div>';
  }
  function recordHtml(detail){
    if(!detail) return '<div class="dw-sec"><h3>'+esc(t("d_record"))+'</h3><div class="muted">'+esc(t("d_loading"))+'</div></div>';
    var d = (detail.opp && detail.opp.data) || {};
    var rows=[];
    if(d.prohibition) rows.push([t("d_prohibition"), d.prohibition]);
    if(d.drop_reason) rows.push([t("d_drop"), d.drop_reason]);
    if(d.lost_reason) rows.push([t("d_lost"), d.lost_reason]);
    if(d.page_missing) rows.push([t("d_pagemiss"), t("d_present")]);
    if(d.template_retired) rows.push([t("d_tmplretired"), t("d_present")]);
    var body = rows.length ? '<dl class="dl">'+rows.map(function(r){ return '<dt>'+esc(r[0])+'</dt><dd>'+esc(String(r[1]))+'</dd>'; }).join("")+'</dl>' : '<div class="empty">'+esc(t("d_no_notes"))+'</div>';
    return '<div class="dw-sec"><h3>'+esc(t("d_record"))+'</h3><div class="note">'+esc(t("d_no_memory"))+'</div>'+body+'</div>';
  }
  // Activity timeline: sends (console_mail) + opens (console_hits) + replies (the ONE resolver), newest first.
  // L4 writes stage moves/archiving to console_opps and re-reads the board view; there is still no per-move
  // console_activity table, so an individual move is not itemized here - its effect shows as the card's new lane.
  function activityHtml(slug, detail){
    if(!detail) return '<div class="dw-sec"><h3>'+esc(t("d_activity"))+'</h3><div class="muted">'+esc(t("d_loading"))+'</div></div>';
    var ev=[];
    (detail.mail||[]).forEach(function(m){ m=m||{}; var d=m.data||{}; var s=(d.subject||m.subject||""); ev.push({ ts:String(m.ts||d.ts||""), label:t("e_sent")+(s?(" - "+s):"") }); });
    (detail.hits||[]).forEach(function(h){ h=h||{}; var d=h.data||{}; ev.push({ ts:String(h.ts||d.ts||""), label:t("e_open") }); });
    ((__reps.list&&__reps.list[slug])||[]).forEach(function(it){ ev.push({ ts:String(it.ts||""), label:t("e_reply")+" #"+it.num }); });
    ev.sort(function(a,b){ return a.ts>b.ts?-1:(a.ts<b.ts?1:0); });
    var body = ev.length ? '<div class="log">'+ev.map(function(e){ return '<div class="logrow"><span class="lt">'+esc(fmtWhen(e.ts))+'</span> '+esc(e.label)+'</div>'; }).join("")+'</div>' : '<div class="empty">'+esc(t("d_no_activity"))+'</div>';
    return '<div class="dw-sec"><h3>'+esc(t("d_activity"))+'</h3><div class="note">'+esc(t("d_stage_local"))+'</div>'+body+'</div>';
  }
  // ---- L4 write-action surface (in the drawer): stage moves, archive/reopen, and a note composer. Only the
  //      moves the board view HONORS as declared overrides are offered (draft<->live, and the terminal outcomes
  //      won/lost/dropped); sent/opened/replied are EARNED from real signals, never fabricated by a button. ----
  var __act = {}, __notes = {};   // __act: per-slug transient action status {msg,cls}, rendered on every drawer
                    // paint so a "Saved." confirmation survives the detail-enrichment re-render. __notes: per-slug
                    // in-session confirmed notes (from a read-back), so a just-added note shows without a refetch.
  function actBtn(action, key, cls){ return '<button class="act'+(cls?(" "+cls):"")+'" type="button" data-act="'+action+'">'+esc(t(key))+'</button>'; }
  function actionsHtml(row){
    var st=(row && row.stage) || "", arch=!!(row && row.archived);
    var inTray = arch || TRAY_STAGES.indexOf(st)>=0;                    // won/lost/dropped, or archived
    var btns=[];
    if(inTray){
      btns.push(actBtn("reopen","a_reopen",""));                        // the only sensible write on a closed card
    } else {
      if(sendEligible(row)) btns.push(actBtn("send","s_send","send")); // L5: the opp has a prepared message (has_email) and is not closed
      if(st==="draft") btns.push(actBtn("promote","a_promote","win")); // the one declarable forward step
      else if(st==="live") btns.push(actBtn("revert","a_revert",""));
      btns.push(actBtn("won","a_won","win"));
      btns.push(actBtn("lost","a_lost","danger"));
      btns.push(actBtn("drop","a_drop","warn"));
      btns.push(actBtn("archive","a_archive","warn"));
    }
    var a=__act[row.slug]||{};
    return '<div class="dw-sec"><h3>'+esc(t("a_actions"))+'</h3><div class="acts">'+btns.join("")+'</div>'+
      '<div class="act-status'+(a.cls?(" "+a.cls):"")+'" id="actStatus">'+esc(a.msg||"")+'</div></div>';
  }
  function noteItemHtml(n){
    n=n||{}; var meta=[fmtWhen(n.ts), (n.by ? (t("a_note_by")+" "+actorName(n.by)) : "")].filter(Boolean).join("  \u00b7  ");
    return '<div class="note-item">'+esc(n.text||"")+(meta?'<span class="nmeta">'+esc(meta)+'</span>':'')+'</div>';
  }
  function notesFor(slug, detail){
    if(__notes[slug]) return __notes[slug];                             // in-session confirmed notes take priority
    var d=(detail && detail.opp && detail.opp.data) || {};
    return Array.isArray(d.notes) ? d.notes : [];
  }
  function notesHtml(slug, detail){
    var notes=notesFor(slug, detail);
    var listInner = notes.length ? notes.slice().reverse().map(noteItemHtml).join("") : '<div class="empty">'+esc(t("d_no_notes"))+'</div>';
    return '<div class="dw-sec"><h3>'+esc(t("a_notes"))+'</h3>'+
      '<div class="notes-list" id="notesList">'+listInner+'</div>'+
      '<div class="note-form"><textarea class="note-in" id="noteIn" placeholder="'+esc(t("a_note_ph"))+'"></textarea>'+
      '<div class="acts"><button class="act note-add" id="noteAdd" type="button">'+esc(t("a_note_add"))+'</button></div>'+
      '<div class="act-status" id="noteStatus"></div></div></div>';
  }
  function drawerHtml(row, detail){
    var slug=row.slug||"";
    return '<div class="dw-top"><div><div class="dw-name">'+esc(row.business||row.slug||t("unnamed"))+'</div>'+
      '<span class="dw-stage">'+esc(row.stage||"")+'</span></div>'+
      '<button class="dw-close" id="dwClose" type="button" aria-label="'+esc(t("d_close"))+'">\u00d7</button></div>'+
      numsHtml(row, slug)+factsHtml(row)+editorHtml(slug, row, detail)+recipientHtml(slug, row, detail)+actionsHtml(row)+threadHtml(slug, detail)+recordHtml(detail)+notesHtml(slug, detail)+activityHtml(slug, detail);
  }
  var __drawerSlug=null, __writing=false;
  function wireDrawer(){
    var b=document.getElementById("dwClose"); if(b) b.addEventListener("click", closeDrawer);
    var slug=__drawerSlug;
    [].forEach.call(document.querySelectorAll("#drawer .act[data-act]"), function(btn){
      btn.addEventListener("click", function(){ onAction(slug, btn.getAttribute("data-act")); });
    });
    var na=document.getElementById("noteAdd");
    if(na) na.addEventListener("click", function(){ onAddNote(slug); });
    var rs=document.getElementById("recSave");                          // L5.5 recipient save
    if(rs) rs.addEventListener("click", function(){ onSaveRecipient(slug); });
    try{ wireEditor(slug); }catch(e){}                                  // unified message editor (compose + reply)
  }
  function openDrawer(slug){
    __drawerSlug=slug;
    var scrim=document.getElementById("scrim"), dw=document.getElementById("drawer");
    if(!scrim || !dw) return;
    var row=null; if(__data && __data.rows) __data.rows.forEach(function(r){ if(r && r.slug===slug) row=r; });
    if(!row) return;
    try{
      dw.innerHTML = drawerHtml(row, null);      // the heart renders instantly from in-memory data + the resolver
      scrim.hidden=false; dw.scrollTop=0; wireDrawer();
      fetchDetail(slug).then(function(detail){   // then enrich: record notes, outbound sends, activity timeline
        if(__drawerSlug!==slug) return;
        // Cache the freshest server notes so a later note re-render (finishIdentity, Step 2A) has a source;
        // notesFor already prioritizes __notes[slug], and this keeps it in sync with the latest detail.
        try{ var dn=detail && detail.opp && detail.opp.data && detail.opp.data.notes; if(Array.isArray(dn)) __notes[slug]=dn; }catch(e){}
        try{ dw.innerHTML = drawerHtml(row, detail); wireDrawer(); }catch(e){ redFull("drawer detail", e); }
      }, function(){});
    }catch(e){ redFull("drawer", e); }
  }
  function closeDrawer(){ var s=__drawerSlug; if(s){ delete __act[s]; delete __recSaved[s]; } __drawerSlug=null; var sc=document.getElementById("scrim"); if(sc) sc.hidden=true; }

  // ---- L4 optimistic confirm-or-revert runner (spec item 4). The card updates IMMEDIATELY (mutate the in-memory
  //      row + repaint), then the write confirms; on confirm the board RE-READS console_board and paints from
  //      server truth (§3 - the optimistic stage is never the authority); on failure the row is restored, the
  //      board repaints (the card jumps back), and a visible RED status shows - never a silent wrong state. ----
  function findRow(slug){ var r=null; if(__data && __data.rows) __data.rows.forEach(function(x){ if(x && x.slug===slug) r=x; }); return r; }
  function replaceRow(slug, snap){ if(!__data || !__data.rows) return; for(var i=0;i<__data.rows.length;i++){ if(__data.rows[i] && __data.rows[i].slug===slug){ __data.rows[i]=snap; return; } } }
  function drawerActsDisabled(on){ var dw=document.getElementById("drawer"); if(!dw) return; [].forEach.call(dw.querySelectorAll(".act"), function(b){ b.disabled=!!on; }); }
  function refreshDrawer(slug){ if(__drawerSlug!==slug) return; if(!findRow(slug)){ closeDrawer(); return; } openDrawer(slug); }
  function runOppWrite(slug, optimistic, patch){
    if(__writing) return; __writing=true;
    var row=findRow(slug); if(!row){ __writing=false; return; }
    var snap=JSON.parse(JSON.stringify(row));                            // exact pre-write state for a clean revert
    try{ optimistic(row); }catch(e){}
    __act[slug]={ msg:t("a_saving"), cls:"" };
    drawerActsDisabled(true);
    try{ renderBoard(__data); }catch(e){}                               // optimistic paint: the card jumps at once
    oppPatch(slug, patch).then(function(){
      return reloadBoardData();                                         // confirmed: adopt server truth
    }).then(function(){
      __writing=false; __act[slug]={ msg:t("a_saved"), cls:"ok" }; refreshDrawer(slug);
    }).catch(function(e){
      __writing=false;
      replaceRow(slug, snap); try{ renderBoard(__data); }catch(x){}     // revert the optimistic change
      __act[slug]={ msg:((e&&e.authRequired)? t("err") : t("a_failed")), cls:"bad" };
      if(__drawerSlug===slug) refreshDrawer(slug); else redInto(root, "write", new Error(t("a_failed")));
    });
  }
  function onAction(slug, act){
    var m=Date.now(), row=findRow(slug); if(!row) return; var st=row.stage||"";
    if(act==="send")    return runSend(slug);                             // L5 single-recipient send
    if(act==="promote") return runOppWrite(slug, function(r){ r.stage="live"; }, { stage:"live", up:m });
    if(act==="revert")  return runOppWrite(slug, function(r){ r.stage="draft"; }, { stage:"draft", up:m });
    if(act==="won")     return runOppWrite(slug, function(r){ r.stage="won"; }, { stage:"won", up:m });
    if(act==="lost")    return runOppWrite(slug, function(r){ r.stage="lost"; }, { stage:"lost", up:m });
    if(act==="drop")    return runOppWrite(slug, function(r){ r.stage="dropped"; }, { stage:"dropped", up:m });
    if(act==="archive") return runOppWrite(slug, function(r){ r.archived=true; }, { archived:true, up:m });   // stage untouched (domain law)
    if(act==="reopen"){
      var clear = TRAY_STAGES.indexOf(st)>=0;                           // a terminal declaration is cleared; a replied+archived card keeps its earned stage
      return runOppWrite(slug, function(r){ r.archived=false; if(clear) r.stage=""; }, clear ? { archived:false, stage:"", up:m } : { archived:false, up:m });
    }
  }
  function setNoteStatus(msg, cls){ var el=document.getElementById("noteStatus"); if(el){ el.className="act-status"+(cls?(" "+cls):""); el.textContent=msg||""; } }
  function renderNotesInto(slug){ var host=document.getElementById("notesList"); if(!host) return; var notes=__notes[slug]||[]; host.innerHTML = notes.length ? notes.slice().reverse().map(noteItemHtml).join("") : '<div class="empty">'+esc(t("d_no_notes"))+'</div>'; }
  function onAddNote(slug){
    var input=document.getElementById("noteIn"); if(!input) return;
    var text=(input.value||"").trim(); setNoteStatus("", "");
    if(!text) return;
    if(__writing) return; __writing=true;
    setNoteStatus(t("a_note_saving"), ""); var na=document.getElementById("noteAdd"); if(na) na.disabled=true;
    addNote(slug, text).then(function(notes){                            // confirmed via read-back (count grew)
      __writing=false; __notes[slug]=notes;
      if(__drawerSlug===slug){ var i2=document.getElementById("noteIn"); if(i2) i2.value=""; renderNotesInto(slug); setNoteStatus(t("a_note_saved"), "ok"); var n2=document.getElementById("noteAdd"); if(n2) n2.disabled=false; }
    }).catch(function(e){
      __writing=false; var n3=document.getElementById("noteAdd"); if(n3) n3.disabled=false;
      setNoteStatus((e&&e.authRequired)? t("err") : t("a_note_failed"), "bad");
    });
  }

  function renderBoard(data){
    data = data || {}; __data = data; VIEW="board"; applyLang();
    var rows = Array.isArray(data.rows) ? data.rows : [];
    var groups = {}; BOARD_LANES.concat(["tray","other"]).forEach(function(l){ groups[l]=[]; });
    rows.forEach(function(r){ try{ groups[laneOf(r)].push(r); }catch(e){} });
    // ONE bucketer, ONE count (no second count path): the verdict hero, the pipeline strip, and every lane header
    // all read the SAME laneOf() grouping via laneN(). A replied+archived opp counts as Replied here precisely
    // because laneOf() keeps it in "replied"; the old cnt() scan (which subtracted archived) is gone.
    function laneN(l){ return (groups[l]||[]).length; }

    // Verdict hero (count-up) + the five-stage pipeline strip.
    var draft=laneN("draft"), live=laneN("live"), sent=laneN("sent"), opened=laneN("opened"), replied=laneN("replied");
    var awaiting=sent+opened, heroN, heroK;
    if(replied>0){ heroN=replied; heroK="v_replied"; }
    else if(awaiting>0){ heroN=awaiting; heroK="v_awaiting"; }
    else if(live>0){ heroN=live; heroK="v_ready"; }
    else { heroN=draft; heroK="v_draft"; }
    var verdict = '<div class="verdict"><span class="vnum" data-countup="' + heroN + '">0</span><span class="vlabel">' + esc(t(heroK)) + '</span></div>';
    var pipe = '<div class="pipe">' + ["draft","live","sent","opened","replied"].map(function(st){
      return '<span class="pchip"><span class="pn" data-countup="' + laneN(st) + '">0</span> ' + esc(t("l_"+st)) + '</span>';
    }).join("") + '</div>';

    // Chips (display only in L2): stalled sent/opened cards, and archived count.
    var stalled=0, archived=0;
    rows.forEach(function(r){ if(r && r.archived) archived++; else if((r.stage==="sent"||r.stage==="opened") && Number(r.idle_days||0)>7) stalled++; });
    var chips=""; if(stalled) chips+='<span class="chip">'+stalled+' '+esc(t("c_stalled"))+'</span>';
    if(archived) chips+='<span class="chip">'+archived+' '+esc(t("c_archived"))+'</span>';
    var chipsHtml = chips ? ('<div class="chips">'+chips+'</div>') : "";

    // Pills: a truthful live-freshness pill, and the inbound-health pill (replies waiting to be filed) from the
    // console_inbound read. The engine's drift/sync pills are intentionally NOT carried: the direct reader has
    // no local ledger to drift from and no relay to be stale against, so there is nothing truthful to show.
    var pills = '<span class="pill live">'+esc(t("p_live"))+'</span>';
    var waiting = (__reps && __reps.waiting) || 0;
    if(waiting) pills += '<span class="pill warn">'+waiting+' '+esc(t("p_waiting"))+'</span>';
    var pillsHtml = '<div class="pills">'+pills+'</div>';

    // Lanes: the five open lanes always; bounced/failed only when non-empty; "other" only if (unexpectedly) used.
    var order = ["draft","live","sent","opened","replied"];
    if((groups.bounced||[]).length) order.push("bounced");
    if((groups.failed||[]).length) order.push("failed");
    if((groups.other||[]).length) order.push("other");
    var lanesHtml = '<div class="lanes">' + order.map(function(l){
      var list = groups[l] || [];
      return '<div class="lane"><h2>' + esc(t("l_"+l)) + '<span class="n">' + list.length + '</span></h2>' +
             (list.length ? list.map(cardHtml).join("") : '<div class="empty">' + esc(t("none")) + '</div>') + '</div>';
    }).join("") + '</div>';

    // Closed/archived tray: the archived shelf lists EVERY archived opp plus won/lost/dropped, independent of the
    // stage lane it also appears in - a replied+archived opp shows in Replied AND here, because archiving is a
    // shelf, not an exclusion (and never subtracts from its stage count). Collapsible; per-card reopen is later.
    var tray = rows.filter(function(r){ return r && (r.archived || TRAY_STAGES.indexOf((r && r.stage) || "")>=0); });
    var trayHtml = '<section class="tray"><button class="tray-toggle link" id="trayToggle" type="button" aria-expanded="false">' +
      esc(t("tray")) + ' <span class="n">' + tray.length + '</span></button>' +
      '<div class="tray-body" id="trayBody" hidden>' + (tray.length ? tray.map(cardHtml).join("") : '<div class="empty">'+esc(t("none"))+'</div>') + '</div></section>';

    root.innerHTML = headerHtml() + verdict + pipe + pillsHtml + chipsHtml +
      '<div class="muted" style="padding:2px">' + rows.length + ' ' + esc(t("opps")) + '</div>' +
      lanesHtml + trayHtml;
    wireHeader();
    var tt=document.getElementById("trayToggle"), tb=document.getElementById("trayBody");
    if(tt && tb) tt.addEventListener("click", function(){ var open=tb.hidden; tb.hidden=!open; tt.setAttribute("aria-expanded", String(open)); });
    // L3: tap any card (open lane OR tray) to open its read-only detail drawer.
    [].forEach.call(root.querySelectorAll(".card[data-slug]"), function(c){
      var slug=c.getAttribute("data-slug");
      c.addEventListener("click", function(){ openDrawer(slug); });
      c.addEventListener("keydown", function(e){ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); openDrawer(slug); } });
    });
    countUpAll();
  }

  // ONE read path (fetchBoard + fetchInbound -> renderBoard), reused by the first load AND by every post-write
  // re-read: after a confirmed write, the board reads console_board again and paints from SERVER TRUTH, never
  // from the optimistic local stage (§3 stage-authority). Returns the settled promise so a write can chain on it.
  function reloadBoardData(){
    return fetchBoard(false).then(function(rows){
      return fetchInbound().then(function(inbound){
        rows = Array.isArray(rows) ? rows : [];
        __seen = readSeen();
        __reps = buildReplies(inbound);
        try{ renderBoard({ rows: rows }); }catch(e){ redFull("render", e); }
        // update last-seen to current activity, so the NEXT load flags what changed since now
        var next={}; rows.forEach(function(r){ if(r && r.slug) next[r.slug]=String(r.last_activity_ts||""); });
        writeSeen(next);
      });
    });
  }
  function loadBoard(){
    VIEW="board"; applyLang();
    try{ loadIdentity(); }catch(e){}   // Step 1: fire-and-forget profile/role load; NEVER gates the render
    root.innerHTML = headerHtml() + '<div class="muted" style="padding:10px 2px">' + esc(t("loading")) + '</div>';
    wireHeader();
    reloadBoardData().catch(function(e){ if(e && e.authRequired){ signinView(); } else { redFull("board fetch", e); } });
  }

  // Warm boot: adopt a surviving mirrored session into memory (session() does it) and go STRAIGHT to the board,
  // no re-sign-in; an expired token gets one bounded refresh. Never a loop (refresh clears only on a definitive
  // 400/401), never a black screen (everything wrapped; an auth failure returns the sign-in card, not red text).
  function boot(){
    applyLang();
    try{
      if(!signedIn()){ signinView(); return; }
      var s=session();
      if(!expired(s)){ loadBoard(); return; }
      refresh().then(function(ok){ ok ? loadBoard() : signinView(); }).catch(function(){ signinView(); });
    }catch(e){ redFull("boot", e); }
  }
  // Drawer dismissal wired once: a backdrop tap or Escape closes it and returns to the board (no reload).
  (function(){ try{
    var s=document.getElementById("scrim");
    if(s) s.addEventListener("click", function(e){ if(e.target===s) closeDrawer(); });
    var ps=document.getElementById("pfScrim");                                            // Step 2B profile overlay
    if(ps) ps.addEventListener("click", function(e){ if(e.target===ps) closeProfile(); });
    var as=document.getElementById("admScrim");                                           // Step 2D admin overlay
    if(as) as.addEventListener("click", function(e){ if(e.target===as) closeAdmin(); });
    document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeDrawer(); closeProfile(); closeAdmin(); } });
  }catch(e){} })();
  boot();
})();
</script>
