# NETLIFY_DEPLOY: build the same site the GitHub Pages flow builds, and serve HTML that can never be stale.
# `node tools/bundle.js` regenerates the console (library/console.html, index.html, version.json, dist) and
# then assembles a clean publish/ tree with a _headers file that forces revalidation on every file. The
# Capability Orbit emitter runs only after the console build succeeds, verifies all four pinned source
# hashes byte-for-byte, then adds the isolated capability pages and host rewrites to publish/.
[build]
  command = "node tools/bundle.js && node cap-orbit/emit.js"
  publish = "publish"
